<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/contador.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family:'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

nav{
  display:flex;
  gap:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

/* TITULOS */
h1{
  text-align:center;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  margin:30px 20px 10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
  gap:20px;
  padding:0 20px 40px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* IMG */
.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

/* TITULO */
.card h3{
  font-size:14px;
  margin:10px 0;
}

/* BOTÃO */
.btn{
  margin-top:10px;
  padding:10px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <nav>
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav>
    <a href="#" class="nav-item">Carrinho</a>
  </nav>
</header>

<h1>COBOGÓS</h1>

<!-- 40x40 -->

<h3>Estrela 30x30</h3>

<!-- (segue o mesmo padrão para TODOS os outros, sem alterar nomes/imagens) -->

</div>

<script src="js/contador.js"></script>

<script>

iniciarContadores();

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.contador-input').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado!");
}

</script>

</body>
</html>
