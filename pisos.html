<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pisos e Pisadeiras | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>

/* FUNDO */
body{
  background: linear-gradient(to bottom, #ddd, #ccc);
  font-family:'Montserrat', sans-serif;
  padding-top:90px;
}

/* HEADER IGUAL COBOGÓS */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:transparent;
}

nav{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

.nav-item:hover{
  color:#e63946;
}

/* TITULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  color:#e63946;
  text-shadow:2px 2px 4px rgba(0,0,0,0.3);
  margin-bottom:20px;
}

h2{
  text-align:left;
  margin:30px 0 15px;
  font-size:22px;
  padding-left:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px;
}

/* PC */
@media(min-width:900px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

/* CARD */
.card{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* IMAGEM */
.imagem-container{
  width:100%;
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.imagem-container img{
  max-width:100%;
  max-height:100%;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px 0;
}

.contador button{
  padding:3px 8px;
  margin:0 5px;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
<nav>
<a href="index.html" class="nav-item">
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 10L12 3l9 7"></path>
<path d="M5 10v10h14V10"></path>
</svg>
Início
</a>
</nav>

<nav class="nav-right">
<a href="#" class="nav-item">
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<circle cx="9" cy="20" r="1"></circle>
<circle cx="18" cy="20" r="1"></circle>
<path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
</svg>
Carrinho
</a>
</nav>
</header>

<h1>PISOS E PISADEIRAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText) + 1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText) - 1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const nomeFinal = variacao ? nome + " - " + variacao : nome;

  const existente = carrinho.find(item => item.nome === nomeFinal);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({ nome: nomeFinal, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado!");
}

function titulo(texto){
  grid.innerHTML += `<div style="grid-column:1/-1"><h2>${texto}</h2></div>`;
}

function criarProduto(nome, img, opcoes=null){
  grid.innerHTML += `
  <div class="card">

    <div class="imagem-container">
      <img src="${img}">
    </div>

    <h3>${nome}</h3>

    ${opcoes ? `
    <select>
    ${opcoes.map(o=>`<option>${o}</option>`).join('')}
    </select>` : ''}

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>

  </div>`;
}

/* PRODUTOS */
titulo("Pisos");

criarProduto("Piso Quadrado Liso","img/pisos/quadrado.jpg",["40x40cm","50x50cm","60x60cm"]);
criarProduto("Piso Copacabana 50x50cm","img/pisos/copacabana.jpg");
criarProduto("Piso Trabalhado em Flor 45x45cm","img/pisos/flor.jpg");
criarProduto("Piso em X 45x45cm","img/pisos/x.jpg");

titulo("Pisadeiras");

criarProduto("Pezão de Jardim 50cm","img/pisos/pezao.jpg");
criarProduto("Círculo Estelar 50cm","img/pisos/circulo.jpg");
criarProduto("Pisadeira Xis 50cm","img/pisos/xis.jpg");

titulo("Conjuntos");

criarProduto("Conjunto Trevo Oriente 60x60cm","img/pisos/trevo.jpg");
criarProduto("Conjunto Passarela Estrelado 70x70cm","img/pisos/passarela.jpg");
criarProduto("Conjunto Passarela Estelar 140x140cm","img/pisos/passarela-grande.jpg");

</script>

</body>
</html>
