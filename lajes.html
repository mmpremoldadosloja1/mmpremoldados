<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lajes Pré-Moldadas</title>

<style>

body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background:#f5f5f5;
  padding-top:90px;
  overflow-x:hidden;
}

/* HEADER IGUAL COBOGO */
body.sem-header{
  padding-top:0 !important;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

header.sumir{
  display:none;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
  stroke:currentColor;
}

/* CARRINHO */
.carrinho-lateral{
  position:fixed;
  right:-350px;
  top:0;
  width:320px;
  height:100%;
  background:#fff;
  z-index:1001;
  padding:20px;
  transition:0.3s;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{
  right:0;
}

.lista-carrinho{
  flex:1;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* BLOCO */
.bloco{
  background:#fff;
  margin:20px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

/* IMG */
.imagem{
  width:100%;
  height:150px;
  background:#eee;
  border-radius:10px;
  margin-bottom:15px;
}

/* INPUT */
select, input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* CONTADOR IGUAL COBOGO */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-top:10px;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  border-radius:5px;
  cursor:pointer;
}

.contador input{
  width:60px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
}

/* BTN */
.btn{
  margin-top:15px;
  width:100%;
  padding:12px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* DESKTOP */
@media(min-width:900px){

  .bloco{
    display:flex;
    gap:20px;
    align-items:center;
  }

  .imagem{
    width:200px;
    height:140px;
  }

  .conteudo{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    width:100%;
  }

  .conteudo select,
  .conteudo input{
    width:auto;
    min-width:140px;
  }

}

</style>
</head>

<body>

<!-- HEADER CORRETO -->
<header id="header">
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item" onclick="abrirCarrinho();return false;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviar()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1 style="text-align:center;color:#e63946;">LAJES</h1>

<!-- SUA ESTRUTURA ORIGINAL (INTOCADA) -->
<div class="bloco">
<div class="imagem"></div>

<div class="conteudo">

<select id="tipoLaje" required onchange="atualizarIsopor()">
<option value="" disabled selected>Selecione a laje</option>
<option value="H8">Laje de Teto H8</option>
<option value="H10">Laje de Piso H10</option>
</select>

<select id="isopor" required>
<option value="" disabled selected>Selecione o isopor</option>
</select>

<input type="number" id="c" placeholder="Comprimento">
<input type="number" id="l" placeholder="Largura">

<div id="m2">0 m²</div>

<button class="btn" onclick="addLaje()">Adicionar</button>

</div>
</div>

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* CARRINHO */
function abrirCarrinho(){
  carrinhoEl.classList.add("active");
  overlay.classList.add("active");
  header.classList.add("sumir");
  document.body.classList.add("sem-header");
  render();
}

function fecharCarrinho(){
  carrinhoEl.classList.remove("active");
  overlay.classList.remove("active");
  header.classList.remove("sumir");
  document.body.classList.remove("sem-header");
}

function render(){
  lista.innerHTML="";
  if(carrinho.length === 0){
    lista.innerHTML="Carrinho vazio";
    return;
  }

  carrinho.forEach((item,i)=>{
    lista.innerHTML+=`
    <div class="item">
      ${item.nome} (x${item.qtd})
      <button class="remover" onclick="remover(${i})">X</button>
    </div>`;
  });
}

function remover(i){
  carrinho.splice(i,1);
  salvar();
}

function salvar(){
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  render();
}

function enviar(){
  let msg="Pedido:%0A";
  carrinho.forEach(i=>{
    msg+=`${i.nome} - ${i.qtd}%0A`;
  });
  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

const carrinhoEl = document.getElementById("carrinho");
const overlay = document.getElementById("overlay");
const header = document.getElementById("header");

</script>

</body>
</html>
