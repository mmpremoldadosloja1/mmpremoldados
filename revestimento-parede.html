<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meio-Fio | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* FUNDO BRANCO */
body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TÍTULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:30px;
  color:#e63946;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:25px;
  padding:0 20px 40px;
}

@media (min-width:768px){
  .grid{
    grid-template-columns:repeat(3, 1fr);
  }
}

@media (min-width:1200px){
  .grid{
    max-width:1100px;
    margin:0 auto;
  }
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 25px rgba(0,0,0,0.12);
}

.card img{
  width:100%;
  height:140px;
  object-fit:contain;
  margin-bottom:10px;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:10px;
}

.contador button{
  padding:5px 10px;
  margin:0 5px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid">

<div class="card">
<img src="img/meiofio/arredondado.jpg">
<h3>Meio-Fio Arredondado 80x25x8cm</h3>

<div class="contador">
<button>−</button>
<span class="qtd">1</span>
<button>+</button>
</div>

<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/meiofio/cordao.jpg">
<h3>Meio-Fio Cordão 80x25x4cm</h3>

<div class="contador">
<button>−</button>
<span class="qtd">1</span>
<button>+</button>
</div>

<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/meiofio/ondulado.jpg">
<h3>Guia de Jardim Ondulado 80x20x4cm</h3>

<div class="contador">
<button>−</button>
<span class="qtd">1</span>
<button>+</button>
</div>

<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

</div>

<script>

/* ===== CONTADOR COM SEGURAR ===== */

function alterarQtd(botao, valor){
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

function segurar(botao, valor){
  alterarQtd(botao, valor);

  botao._interval = setInterval(()=>{
    alterarQtd(botao, valor);
  }, 120);
}

function parar(botao){
  clearInterval(botao._interval);
}

/* APLICA EM TODOS */
document.querySelectorAll('.contador button').forEach(btn=>{
  const valor = btn.innerText.trim() === '+' ? 1 : -1;

  btn.onmousedown = () => segurar(btn, valor);
  btn.onmouseup = () => parar(btn);
  btn.onmouseleave = () => parar(btn);

  btn.ontouchstart = () => segurar(btn, valor);
  btn.ontouchend = () => parar(btn);
});

/* ===== CARRINHO ===== */

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert('Produto adicionado');
}

</script>

</body>
</html>
