<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MANILHAS E TAMPAS | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>

/* FUNDO PADRÃO */
body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER LIMPO */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
  box-shadow:none;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

.nav-item:hover{
  color:#e63946;
}

/* TITULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* IMAGEM */
.imagem-placeholder{
  width:100%;
  height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  background:#f5f5f5;
  border-radius:8px;
  color:#777;
  font-size:13px;
}

/* SELECT */
select{
  width:100%;
  padding:7px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

.contador button{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 5px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:6px;
  background:#eee;
  cursor:pointer;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn:hover{
  background:#c92f3b;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<h1>MANILHAS E TAMPAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* TITULO */
function titulo(texto) {
  grid.innerHTML += `
    <div style="grid-column:1/-1">
      <h2>${texto}</h2>
    </div>
  `;
}

/* CONTADOR BASE */
function alterarQtd(botao, valor){
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

/* SEGURAR BOTÃO */
function segurar(botao, valor){
  alterarQtd(botao, valor);

  botao._interval = setInterval(()=>{
    alterarQtd(botao, valor);
  }, 120);
}

function parar(botao){
  clearInterval(botao._interval);
}

/* ATIVAR EM TODOS */
function ativarSegurar(){
  document.querySelectorAll('.contador button').forEach(btn=>{
    const valor = btn.innerText.trim() === '+' ? 1 : -1;

    btn.onmousedown = () => segurar(btn, valor);
    btn.onmouseup = () => parar(btn);
    btn.onmouseleave = () => parar(btn);

    btn.ontouchstart = () => segurar(btn, valor);
    btn.ontouchend = () => parar(btn);
  });
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const nomeFinal = variacao ? nome + " - " + variacao : nome;

  const existente = carrinho.find(item => item.nome === nomeFinal);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome: nomeFinal, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado ao carrinho!");
}

/* PRODUTO */
function criarProduto(nome, opcoes = null){
  grid.innerHTML += `
  <div class="card">

    <div class="imagem-placeholder">
      Imagem será adicionada aqui
    </div>

    <h3>${nome}</h3>

    ${opcoes ? `
      <select>
        ${opcoes.map(op => `<option>${op}</option>`).join('')}
      </select>
    ` : ''}

    <div class="contador">
      <button>−</button>
      <span class="qtd">1</span>
      <button>+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>

  </div>`;
}

/* ========================= */
/* PRODUTOS */
/* ========================= */

titulo("Manilhas");

[
"Manilha 90cm x 50cm",
"Manilha 1,10m x 50cm"
].forEach(nome => criarProduto(nome));

titulo("Tampas de Manilha");

criarProduto("Tampa 90cm", ["Aberta", "Fechada"]);
criarProduto("Tampa 1m", ["Aberta", "Fechada"]);
criarProduto("Tampa 1,10cm", ["Aberta", "Fechada"]);
criarProduto("Tampa 1,20cm", ["Aberta", "Fechada"]);

/* ATIVA DEPOIS DE CRIAR */
ativarSegurar();

</script>

</body>
</html>
