<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item:hover{
  color:#e63946;
}

/* TITULO */
h1{
  text-align:center;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  margin:30px 0 15px;
  padding-left:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
  gap:20px;
  padding:0 20px 40px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
}

/* IMAGEM */
.card img{
  width:100%;
  height:110px;
  object-fit:contain;
  margin-bottom:10px;
}

/* TITULO PRODUTO */
.card h3{
  font-size:14px;
  margin:10px 0;
  min-height:40px;
}

/* 🔥 CONTADOR MELHORADO (SEM MUDAR LÓGICA) */
.contador{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin:10px 0;
}

.contador button{
  width:28px;
  height:28px;
  border:none;
  border-radius:6px;
  background:#eee;
  font-size:16px;
  cursor:pointer;
  transition:0.2s;
}

.contador button:hover{
  background:#ddd;
}

.qtd{
  min-width:28px;
  text-align:center;
  font-weight:600;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn:hover{
  background:#c92f3b;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">Carrinho</a>
  </nav>
</header>

<h1>COBOGÓS</h1>

<h2>Cobogós 40x40</h2>
<div class="grid">

<!-- TODOS OS PRODUTOS MANTIDOS IGUAL -->
<div class="card">
<img src="img/cobogo/cobogo-16-furos-40.jpg">
<h3>16 Furos 40x40</h3>
<div class="contador">
<button onclick="alterarQtd(this,-1)">−</button>
<span class="qtd">1</span>
<button onclick="alterarQtd(this,1)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/cobogo/cobogo-4-pontas-40.jpg">
<h3>4 Pontas 40x40</h3>
<div class="contador">
<button onclick="alterarQtd(this,-1)">−</button>
<span class="qtd">1</span>
<button onclick="alterarQtd(this,1)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/cobogo/cobogo-anti-chuva-40.jpg">
<h3>Anti-Chuva 40x40</h3>
<div class="contador">
<button onclick="alterarQtd(this,-1)">−</button>
<span class="qtd">1</span>
<button onclick="alterarQtd(this,1)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/cobogo/cobogo-arabe-40.jpg">
<h3>Árabe 40x40</h3>
<div class="contador">
<button onclick="alterarQtd(this,-1)">−</button>
<span class="qtd">1</span>
<button onclick="alterarQtd(this,1)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/cobogo/cobogo-flor-40.jpg">
<h3>Flor 40x40</h3>
<div class="contador">
<button onclick="alterarQtd(this,-1)">−</button>
<span class="qtd">1</span>
<button onclick="alterarQtd(this,1)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/cobogo/cobogo-taco-chines-40.jpg">
<h3>Taco Chinês 40x40</h3>
<div class="contador">
<button onclick="alterarQtd(this,-1)">−</button>
<span class="qtd">1</span>
<button onclick="alterarQtd(this,1)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

</div>

<script>

/* CONTADOR */
function alterarQtd(botao, valor){
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

/* SEGURAR */
function segurar(botao, valor){
  alterarQtd(botao, valor);
  botao._interval = setInterval(()=>{
    alterarQtd(botao, valor);
  }, 120);
}

function parar(botao){
  clearInterval(botao._interval);
}

/* EVENTOS */
document.querySelectorAll('.contador button').forEach(btn=>{
  const valor = btn.innerText.trim() === '+' ? 1 : -1;

  btn.onmousedown = () => segurar(btn, valor);
  btn.onmouseup = () => parar(btn);
  btn.onmouseleave = () => parar(btn);

  btn.ontouchstart = () => segurar(btn, valor);
  btn.ontouchend = () => parar(btn);
});

/* CARRINHO */
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert('Produto adicionado');
}

</script>

</body>
</html>
