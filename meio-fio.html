<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Meio-Fio de Jardim | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* FUNDO GLOBAL (remove branco) */
html, body{
  min-height:100%;
  background: linear-gradient(to bottom, #ddd, #ccc);
  font-family: Arial, sans-serif;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:15px 25px;
  z-index:999;
}

.nav-item{
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:bold;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.nav-item svg{
  width:24px;
  height:24px;
}

/* TÍTULO */
h1{
  text-align:center;
  margin-top:90px;
  margin-bottom:30px;
  color:#e63946;
  text-transform:uppercase;
  text-shadow:2px 2px 4px rgba(0,0,0,0.3);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  padding:0 20px 40px;
}

@media(min-width:768px){
  .grid{
    grid-template-columns:repeat(3,1fr);
    max-width:1100px;
    margin:auto;
  }
}

/* CARD */
.card{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:260px;
}

/* IMAGEM */
.card img{
  width:100%;
  height:120px;
  object-fit:contain;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

/* BOTÕES REDONDOS */
.contador button{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:#e0e0e0;
  font-size:18px;
  cursor:pointer;
  transition:0.2s;
}

.contador button:hover{
  background:#d5d5d5;
}

.qtd{
  font-weight:bold;
  margin:0 10px;
}

/* BOTÃO CARRINHO */
.btn{
  width:100%;
  padding:9px 0;
  border:none;
  border-radius:6px;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  background:#c92f3b;
}

</style>
</head>
<body>

<header>
  <a href="index.html" class="nav-item">Início</a>
  <a href="#" class="nav-item">Carrinho</a>
</header>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid" id="gridProdutos"></div>

<script>
const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText) + 1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText) - 1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome: nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado ao carrinho!");
}

function criarProduto(nome, img){
  grid.innerHTML += `
  <div class="card">
    <img src="${img}">
    <h3>${nome}</h3>

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
  </div>`;
}

/* PRODUTOS */

criarProduto("Meio-Fio Arredondado 80x25x8cm", "img/meiofio/arredondado.jpg");
criarProduto("Meio-Fio Cordão 80x25x4cm", "img/meiofio/cordao.jpg");
criarProduto("Guia de Jardim Ondulado 80x20x4cm", "img/meiofio/ondulado.jpg");

</script>

</body>
</html>
