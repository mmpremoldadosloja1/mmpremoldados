<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MM Premoldados</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* ===== HEADER ===== */
header {
  background: #1e1e1e;
  text-align: center;
  padding: 12px 10px 20px;
}

header img {
  max-width: 320px;
  width: 100%;
}

header p {
  color: #ccc;
  margin: 10px 0 0;
  font-size: 15px;
}

/* ===== BOTÃO MENU ≡ ===== */
.menu-button {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 9999;

  background: #222;
  color: #fff;
  border: none;
  border-radius: 10px;
  width: 44px;
  height: 44px;
  font-size: 22px;
  cursor: pointer;
}

/* ===== MENU BOLHA ===== */
.menu {
  display: none;
  position: fixed;
  top: 70px;
  left: 16px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  width: 240px;
  z-index: 9998;
}

.menu a {
  display: block;
  padding: 14px;
  text-decoration: none;
  color: #333;
  border-bottom: 1px solid #eee;
  font-weight: bold;
}

.menu a:last-child {
  border-bottom: none;
}

.menu a:hover {
  background: #f1f1f1;
}

/* ===== DESTAQUES ===== */
section {
  padding: 20px;
}

h2 {
  margin-bottom: 15px;
  color: #333;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 20px;
  text-align: center;
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

.tag {
  display: inline-block;
  background: #d4af37;
  color: #000;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  margin-bottom: 8px;
}

.card h3 {
  margin: 12px 0;
}

.whatsapp {
  display: inline-block;
  background: #25d366;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- BOTÃO MENU -->
<button class="menu-button" onclick="toggleMenu()">≡</button>

<!-- MENU -->
<div class="menu" id="menu">
  <a href="#">Manilhas</a>
  <a href="#">Lajes Pré Moldadas</a>
  <a href="#">Pingadeiras</a>
  <a href="#">Blocos / Canaletas</a>
  <a href="#">Pisadeiras de Jardim</a>
  <a href="#">Revestimento de Piso</a>
  <a href="#">Revestimento de Parede</a>
  <a href="#">Cobogós</a>
</div>

<!-- HEADER -->
<header>
  <img src="img/logo.png" alt="MM Premoldados">
  <p>Qualidade, resistência e acabamento em pré-moldados</p>
</header>

<!-- DESTAQUES -->
<section>
  <h2>Destaques</h2>

  <div class="card">
    <span class="tag">Mais vendido</span>
    <img src="img/cobogo-16-furos-40x40.jpg">
    <h3>Cobogó 16 Furos 40x40</h3>
    <a class="whatsapp" href="https://wa.me/55SEUNUMERO" target="_blank">WhatsApp</a>
  </div>

  <div class="card">
    <span class="tag">Destaque</span>
    <img src="img/cobogo-4-furos-24x24.jpg">
    <h3>Cobogó 4 Furos 24x24</h3>
    <a class="whatsapp" href="https://wa.me/55SEUNUMERO" target="_blank">WhatsApp</a>
  </div>

</section>

<script>
function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
