<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lajes Pré-Moldadas | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:'Montserrat', sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

/* TITULO */
h1{
  text-align:center;
  color:#e63946;
  margin-bottom:20px;
}

/* SUBTITULO */
h2{
  margin-top:25px;
  color:#333;
}

/* CONTAINER */
.container{
  max-width:650px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* CAMPOS */
select, input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

/* BOTÕES */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.add{
  background:#e63946;
  color:#fff;
}

.finalizar{
  background:#25D366;
  color:#fff;
}

/* LISTA */
.lista{
  margin-top:20px;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:8px;
  border-bottom:1px solid #ddd;
}

.remover{
  background:red;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:5px;
  cursor:pointer;
}

</style>
</head>

<body>

<h1>LAJES PRÉ-MOLDADAS</h1>

<div class="container">

  <!-- LAJE -->
  <h2>Lajes</h2>

  <select id="tipoLaje">
    <option>Laje Teto H8</option>
    <option>Laje Piso H10</option>
  </select>

  <select id="medidaLaje">
    <option>7,5cm x 33cm</option>
    <option>7,5cm x 40cm</option>
    <option>9cm x 33cm</option>
    <option>9cm x 40cm</option>
  </select>

  <input type="number" id="qtdLaje" value="1" min="1">

  <button class="btn add" onclick="addLaje()">Adicionar Laje</button>

  <!-- VIGA -->
  <h2>Vigas</h2>

  <select id="tipoViga">
    <option>H8</option>
    <option>H10</option>
  </select>

  <select id="tamViga">
    <option>2 metros</option>
    <option>3 metros</option>
    <option>4 metros</option>
  </select>

  <input type="number" id="qtdViga" value="1" min="1">

  <button class="btn add" onclick="addViga()">Adicionar Viga</button>

  <!-- ISOPOR -->
  <h2>Isopor</h2>

  <select id="tamIsopor">
    <option>7,5 x 33cm</option>
    <option>8 x 40cm</option>
    <option>9 x 33cm</option>
    <option>9 x 40cm</option>
  </select>

  <input type="number" id="qtdIsopor" value="1" min="1">

  <button class="btn add" onclick="addIsopor()">Adicionar Isopor</button>

  <!-- LISTA -->
  <div class="lista" id="lista"></div>

  <button class="btn finalizar" onclick="enviar()">Finalizar no WhatsApp</button>

</div>

<script>

let carrinho = [];

/* ADICIONAR LAJE */
function addLaje(){
  const tipo = document.getElementById("tipoLaje").value;
  const medida = document.getElementById("medidaLaje").value;
  const qtd = parseInt(document.getElementById("qtdLaje").value);

  adicionarItem(`${tipo} - ${medida}`, qtd);
}

/* ADICIONAR VIGA */
function addViga(){
  const tipo = document.getElementById("tipoViga").value;
  const tamanho = document.getElementById("tamViga").value;
  const qtd = parseInt(document.getElementById("qtdViga").value);

  adicionarItem(`Viga ${tipo} - ${tamanho}`, qtd);
}

/* ADICIONAR ISOPOR */
function addIsopor(){
  const tamanho = document.getElementById("tamIsopor").value;
  const qtd = parseInt(document.getElementById("qtdIsopor").value);

  adicionarItem(`Isopor - ${tamanho}`, qtd);
}

/* FUNÇÃO GLOBAL */
function adicionarItem(nome, qtd){
  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({nome, qtd});
  }

  renderizar();
}

/* RENDER */
function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  carrinho.forEach((item, i)=>{
    lista.innerHTML += `
      <div class="item">
        ${item.nome} (x${item.qtd})
        <button class="remover" onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

/* REMOVER */
function remover(i){
  carrinho.splice(i,1);
  renderizar();
}

/* WHATSAPP */
function enviar(){
  if(carrinho.length === 0){
    alert("Adicione itens!");
    return;
  }

  let msg = "Pedido de Lajes:%0A";

  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

</script>

</body>
</html>
