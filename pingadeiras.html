<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pingadeiras | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family:'Montserrat', sans-serif;
}

body.sem-header{
  padding-top:0 !important;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

header.sumir{
  display:none;
}

nav{
  display:flex;
  gap:25px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
}

/* CARRINHO */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.25);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;

  border-top-left-radius:15px;
  border-bottom-left-radius:15px;
}

.carrinho-lateral.active{
  right:0;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

h1{
  text-align:center;
  font-size:36px;
  color:#e63946;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  height:120px;
  object-fit:contain;
}

select{
  width:100%;
  margin:10px 0;
}

.contador{
  display:flex;
  justify-content:center;
  gap:5px;
}

.qtd{
  width:50px;
  text-align:center;
}

.btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
}

/* DESKTOP */
@media(min-width:900px){
  .carrinho-lateral{
    right:0 !important;
  }

  .overlay{
    display:none;
  }

  body{
    padding-right:320px;
  }

  header{
    width:calc(100% - 320px);
  }
}

</style>
</head>

<body>

<header>
<a href="index.html">Início</a>
<a href="#" onclick="abrirCarrinho()">Carrinho</a>
</header>

<div class="carrinho-lateral" id="carrinho">
<h3>Seu Carrinho</h3>
<div id="lista"></div>
<button onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>Pingadeiras</h1>

<div class="grid">

<!-- CASINHA -->
<div class="card">
<img src="img/pingadeira/casinha.jpg">
<h3>Pingadeira Casinha</h3>
<select>
<option>1m x 20cm</option>
<option>1m x 23cm</option>
<option>1m x 25cm</option>
<option>1m x 30cm</option>
</select>
<div class="contador">
<button onclick="diminuir(this)">-</button>
<input class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<!-- RETA -->
<div class="card">
<img src="img/pingadeira/reta.jpg">
<h3>Pingadeira Reta</h3>
<select>
<option>1m x 20cm</option>
<option>1m x 23cm</option>
<option>1m x 25cm</option>
<option>1m x 30cm</option>
<option>1m x 40cm</option>
</select>
<div class="contador">
<button onclick="diminuir(this)">-</button>
<input class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<!-- DEGRAU (🔥 AGORA INCLUÍDO) -->
<div class="card">
<img src="img/pingadeira/degrau.jpg">
<h3>Pingadeira Degrau</h3>
<select>
<option>1m x 20cm</option>
</select>
<div class="contador">
<button onclick="diminuir(this)">-</button>
<input class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

</div>

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function aumentar(btn){
  const i = btn.parentElement.querySelector('.qtd');
  i.value = parseInt(i.value)+1;
}

function diminuir(btn){
  const i = btn.parentElement.querySelector('.qtd');
  i.value = Math.max(1, parseInt(i.value)-1);
}

function adicionarCarrinho(btn){
  const card = btn.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);
  const medida = card.querySelector('select').value;

  const nomeFinal = nome + " - " + medida;

  const existe = carrinho.find(p => p.nome === nomeFinal);

  if(existe){
    existe.qtd += qtd;
  } else {
    carrinho.push({nome:nomeFinal, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  renderizar();
}

function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if(carrinho.length === 0){
    lista.innerHTML = "Carrinho vazio";
    return;
  }

  carrinho.forEach((item,i)=>{
    lista.innerHTML += `
      <div>
        ${item.nome} (x${item.qtd})
        <button onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

function remover(i){
  carrinho.splice(i,1);
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  renderizar();
}

function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  renderizar();
}

function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

function enviarWhatsApp(){
  let msg = "Pedido:%0A";
  carrinho.forEach(i=>{
    msg += `${i.nome} - ${i.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

window.onload = function(){
  renderizar();
}

</script>

</body>
</html>
