<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEIO-FIO | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* FUNDO */
body{
  background: linear-gradient(to bottom, #ddd, #ccc);
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:transparent;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

/* TÍTULO */
h1{
  text-align:center;
  font-size:36px;
  margin-bottom:30px;
  color:#e63946;
}

/* GRID CENTRALIZADA IGUAL PINGADEIRAS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 300px));
  justify-content:center;
  gap:25px;
  padding:0 20px 60px;
}

/* CARD PADRÃO (IGUAL PINGADEIRAS) */
.card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  text-align:center;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 25px rgba(0,0,0,0.12);
}

/* IMAGEM CENTRALIZADA */
.imagem-container{
  width:100%;
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.imagem-container img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

/* TITULO */
.card h3{
  font-size:14px;
  margin:10px 0;
  min-height:40px;
}

/* CONTADOR IGUAL COBOGO */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

.contador button{
  padding:5px 10px;
  margin:0 5px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.qtd{
  font-weight:bold;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
}

</style>
</head>

<body>

<header>
  <nav>
    <a href="index.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav>
    <a href="#" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* CONTADOR */
function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText) + 1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText) - 1);
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado");
}

/* PRODUTOS */
function criar(nome){
  grid.innerHTML += `
  <div class="card">

    <div class="imagem-container">
      <img src="img/meiofio/guia-de-jardim.jpg" alt="${nome}">
    </div>

    <h3>${nome}</h3>

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>

  </div>`;
}

[
"Meio-Fio Arredondado 80x25x8cm",
"Meio-Fio Cordão 80x25x4cm",
"Guia de Jardim Ondulado 80x20x4cm"
].forEach(criar);

</script>

</body>
</html>
