<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Meio-Fio de Jardim | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* FUNDO GLOBAL DEFINITIVO */
html, body{
  min-height:100%;
  background: linear-gradient(to bottom, #ddd, #ccc);
  font-family:'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
}

/* NAV */
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TÍTULO */
h1{
  text-align:center;
  margin-top:90px;
  margin-bottom:25px;
  color:#e63946;
  text-transform:uppercase;
  text-shadow:2px 2px 4px rgba(0,0,0,0.3);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  padding:0 20px 50px;
}

@media(min-width:768px){
  .grid{
    grid-template-columns:repeat(3,1fr);
    max-width:1100px;
    margin:auto;
  }
}

/* CARD COM ANIMAÇÃO */
.card{
  opacity:0;
  transform:translateY(30px);
  animation:fadeUp .6s ease forwards;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:260px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px) scale(1.02);
}

/* TOQUE MOBILE */
.card:active{
  transform:scale(.97);
}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* IMAGEM */
.card img{
  width:100%;
  height:120px;
  object-fit:contain;
  margin-bottom:10px;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

.contador button{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:#e0e0e0;
  font-size:18px;
  cursor:pointer;
  transition:.2s;
}

.contador button:hover{
  background:#d5d5d5;
}

.qtd{
  font-weight:bold;
  margin:0 10px;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:9px 0;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

</style>
</head>

<body>

<header>

<a href="index.html" class="nav-item">
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 10L12 3l9 7"></path>
<path d="M5 10v10h14V10"></path>
</svg>
Início
</a>

<a href="#" class="nav-item">
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<circle cx="9" cy="20" r="1"></circle>
<circle cx="18" cy="20" r="1"></circle>
<path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
</svg>
Carrinho
</a>

</header>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid" id="gridProdutos"></div>

<script>
const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText) + 1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText) - 1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado!");
}

function criarProduto(nome, img){
  grid.innerHTML += `
  <div class="card">
    <img src="${img}">
    <h3>${nome}</h3>

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
  </div>`;
}

/* PRODUTOS */

criarProduto("Meio-Fio Arredondado 80x25x8cm","img/meiofio/arredondado.jpg");
criarProduto("Meio-Fio Cordão 80x25x4cm","img/meiofio/cordao.jpg");
criarProduto("Guia de Jardim Ondulado 80x20x4cm","img/meiofio/ondulado.jpg");

</script>

</body>
</html>
