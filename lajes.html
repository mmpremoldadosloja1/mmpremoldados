<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lajes Pré-Moldadas | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>
.laje-box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:30px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.laje-box h2{
  margin-bottom:15px;
}

select, input{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  margin-top:10px;
  width:100%;
}

.hidden{
  display:none;
}

.viga-opcoes{
  margin-top:15px;
}

.btn{
  margin-top:15px;
}
</style>

</head>
<body>

<a href="index.html" class="voltar">
  <svg viewBox="0 0 24 24">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</a>

<h1 style="text-align:center; margin-top:60px;">Lajes Pré-Moldadas</h1>

<div style="padding:20px; max-width:800px; margin:auto;">

<!-- LAJE TETO H8 -->
<div class="laje-box">
  <h2>Laje Teto H8</h2>

  <label>Selecionar medida:</label>
  <select id="medidaH8">
    <option value="">Escolher...</option>
    <option>7,5cm x 33cm</option>
    <option>7,5cm x 40cm</option>
  </select>

  <div id="metragemH8" class="hidden">
    <label>Adicionar metragem (m²):</label>
    <input type="number" min="1" id="qtdH8">
    <button class="btn" onclick="addLaje('Laje Teto H8', 'medidaH8', 'qtdH8')">Adicionar ao carrinho</button>
  </div>
</div>

<!-- LAJE PISO H10 -->
<div class="laje-box">
  <h2>Laje Piso H10</h2>

  <label>Selecionar medida:</label>
  <select id="medidaH10">
    <option value="">Escolher...</option>
    <option>9cm x 33cm</option>
    <option>9cm x 40cm</option>
  </select>

  <div id="metragemH10" class="hidden">
    <label>Adicionar metragem (m²):</label>
    <input type="number" min="1" id="qtdH10">
    <button class="btn" onclick="addLaje('Laje Piso H10', 'medidaH10', 'qtdH10')">Adicionar ao carrinho</button>
  </div>
</div>

<!-- VIGA POR UNIDADE -->
<div class="laje-box">
  <h2>Viga por Unidade</h2>

  <label>Selecionar modelo:</label>
  <select id="tipoViga">
    <option value="">Escolher...</option>
    <option>H8</option>
    <option>H10</option>
  </select>

  <div id="vigaTamanhoBox" class="hidden">
    <label>Digite o tamanho (ex: 1.50):</label>
    <input type="number" step="0.10" min="1.5" max="6" id="tamanhoViga">

    <div id="vigaQtdBox" class="hidden viga-opcoes">
      <label>Quantidade:</label>
      <input type="number" min="1" id="qtdViga">
      <button class="btn" onclick="addViga()">Adicionar ao carrinho</button>
    </div>
  </div>
</div>

</div>

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* MOSTRAR METRAGEM QUANDO ESCOLHER */
document.getElementById("medidaH8").addEventListener("change", function(){
  document.getElementById("metragemH8").classList.toggle("hidden", this.value === "");
});

document.getElementById("medidaH10").addEventListener("change", function(){
  document.getElementById("metragemH10").classList.toggle("hidden", this.value === "");
});

/* MOSTRAR TAMANHO VIGA */
document.getElementById("tipoViga").addEventListener("change", function(){
  document.getElementById("vigaTamanhoBox").classList.toggle("hidden", this.value === "");
});

/* MOSTRAR QUANTIDADE APÓS DIGITAR TAMANHO */
document.getElementById("tamanhoViga").addEventListener("input", function(){
  const tamanho = parseFloat(this.value);
  if(tamanho >= 1.5 && tamanho <= 6){
    document.getElementById("vigaQtdBox").classList.remove("hidden");
  } else {
    document.getElementById("vigaQtdBox").classList.add("hidden");
  }
});

/* ADICIONAR LAJE */
function addLaje(nome, selectId, qtdId){
  const medida = document.getElementById(selectId).value;
  const qtd = document.getElementById(qtdId).value;

  if(!medida || !qtd) return alert("Preencha todos os campos!");

  const produto = `${nome} - ${medida} - ${qtd}m²`;

  carrinho.push({nome: produto, qtd:1});
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  alert("Adicionado ao carrinho!");
}

/* ADICIONAR VIGA */
function addViga(){
  const tipo = document.getElementById("tipoViga").value;
  const tamanho = document.getElementById("tamanhoViga").value;
  const qtd = document.getElementById("qtdViga").value;

  if(!tipo || !tamanho || !qtd) return alert("Preencha todos os campos!");

  const produto = `Viga ${tipo} - ${tamanho}m`;
  carrinho.push({nome: produto, qtd: parseInt(qtd)});
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  alert("Adicionado ao carrinho!");
}

</script>

</body>
</html>
