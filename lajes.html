<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lajes Pré-Moldadas</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/carrinho.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:110px;
  font-family: 'Montserrat', sans-serif;
}

body.sem-header{
  padding-top:0 !important;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
  transition:0.3s;
}

header.sumir{
  display:none;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* ===== IMAGENS ===== */
.imagem{
  width:100%;
  height:150px;
  background:#eee;
  border-radius:10px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.imagem img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== ORIGINAL ===== */

.bloco{
  background:#fff;
  margin:20px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

select, input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

select:invalid{
  color:#999;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-top:10px;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  cursor:pointer;
}

.contador input{
  width:30px;
  text-align:center;
}

.btn{
  margin-top:15px;
  width:70%;
  padding:12px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
/* botão aparece só no mobile */
.btn-carrinho{
  display:flex;
}

/* DESKTOP */
@media(min-width:900px){
.btn-carrinho{
  display:none !important;
}
  .bloco{
    display:flex;
    gap:20px;
    align-items:center;
  }

  .imagem{
    width:200px;
    height:140px;
  }

  .conteudo{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    width:100%;
  }

  .conteudo select,
  .conteudo input{
    width:auto;
    min-width:140px;
  }

  body{
    padding-right:320px;
  }

  header{
    width:calc(100% - 320px);
  }

</style>
</head>

<body>

<header id="header">
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item btn-carrinho" onclick="abrirCarrinho(); return false;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<!-- CARRINHO (🔥 removido active daqui) -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1 style="text-align:center;color:#e63946;">LAJES</h1>

<!-- LAJE -->
<div class="bloco">
<div class="imagem">
<img src="img/lajes/laje.jpg">
</div>

<div class="conteudo">
<select id="tipoLaje" required onchange="atualizarIsopor()">
<option value="" disabled selected>Selecione a laje</option>
<option value="H8">Laje de Teto H8</option>
<option value="H10">Laje de Piso H10</option>
</select>

<select id="isopor" required>
<option value="" disabled selected>Selecione o isopor</option>
</select>

<input type="number" id="c" placeholder="Comprimento">
<input type="number" id="l" placeholder="Largura">

<div id="m2">0 m²</div>

<button class="btn" onclick="addLaje()">Adicionar</button>
</div>
</div>

<!-- VIGA -->
<div class="bloco">
<div class="imagem">
<img src="img/lajes/viga.jpg">
</div>

<div class="conteudo">
<select id="tipoViga">
<option>H8 TETO</option>
<option>H10 PISO</option>
</select>

<input list="listaVigas" id="tamViga" placeholder="Tamanho">
<datalist id="listaVigas"></datalist>

<div class="contador">
<button onclick="dim('qv')">-</button>
<input id="qv" value="1">
<button onclick="mais('qv')">+</button>
</div>

<button class="btn" onclick="addViga()">Adicionar</button>
</div>
</div>

<!-- ISOPOR -->
<div class="bloco">
<div class="imagem">
<img src="img/lajes/isopor.jpg">
</div>

<div class="conteudo">
<select id="tipoIso">
<option>H8 - 7,5x33</option>
<option>H8 - 7,5x40</option>
<option>H10 - 9x33</option>
<option>H10 - 9x40</option>
</select>

<div class="contador">
<button onclick="dim('qi')">-</button>
<input id="qi" value="1">
<button onclick="mais('qi')">+</button>
</div>

<button class="btn" onclick="addIso()">Adicionar</button>
</div>
</div>

<script>

/* ISOPOR */
function atualizarIsopor(){

  const tipo =
    document.getElementById("tipoLaje").value;

  const select =
    document.getElementById("isopor");

  select.innerHTML =
    `<option disabled selected>Selecione o isopor</option>`;

  if(tipo === "H8"){

    select.innerHTML +=
      `<option>7,5x33</option>`;

    select.innerHTML +=
      `<option>7,5x40</option>`;
  }

  if(tipo === "H10"){

    select.innerHTML +=
      `<option>9x33</option>`;

    select.innerHTML +=
      `<option>9x40</option>`;
  }

}

/* CONTADOR */
function mais(id){

  let el =
    document.getElementById(id);

  el.value =
    parseInt(el.value || 1) + 1;

}

function dim(id){

  let el =
    document.getElementById(id);

  el.value =
    Math.max(
      1,
      parseInt(el.value || 1) - 1
    );

}

/* LISTA VIGAS */
for(let i = 0.8; i <= 6; i += 0.1){

  listaVigas.innerHTML +=
    `<option value="${i.toFixed(1)}m">`;

}

/* CALCULO M2 */
document
  .getElementById("c")
  .addEventListener("input", calcularM2);

document
  .getElementById("l")
  .addEventListener("input", calcularM2);

function calcularM2(){

  let c =
    parseFloat(
      document.getElementById("c").value
    ) || 0;

  let l =
    parseFloat(
      document.getElementById("l").value
    ) || 0;

  let total =
    (c * l).toFixed(2);

  document.getElementById("m2").innerText =
    total + " m²";

}

/* =========================
   ADD LAJE
========================= */

function addLaje(){

  let tipo =
    document.getElementById("tipoLaje").value;

  let iso =
    document.getElementById("isopor").value;

  let c =
    document.getElementById("c").value;

  let l =
    document.getElementById("l").value;

  let m2 =
    (
      parseFloat(c || 0) *
      parseFloat(l || 0)
    ).toFixed(2);

  if(!tipo || !iso || !c || !l){

    alert("Preencha todos os campos da laje");
    return;

  }

  carrinho.push({

    nome:
      `Laje | ${tipo} | ${iso} | ${c}x${l} | ${m2} m²`,

    tipo,
    iso,
    c,
    l,
    m2,

    qtd:1

  });

  salvarCarrinho();

}

/* =========================
   ADD VIGA
========================= */

function addViga(){

  let tipo =
    document.getElementById("tipoViga").value;

  let tam =
    document.getElementById("tamViga").value;

  let qtd =
    document.getElementById("qv").value;

  if(!tam){

    alert("Informe o tamanho da viga");
    return;

  }

  carrinho.push({

    nome:
      `Viga | ${tipo} | ${tam}`,

    tipo,
    tam,
    qtd

  });

  salvarCarrinho();

}

/* =========================
   ADD ISOPOR
========================= */

function addIso(){

  let tipo =
    document.getElementById("tipoIso").value;

  let qtd =
    document.getElementById("qi").value;

  carrinho.push({

    nome:
      `Isopor | ${tipo}`,

    tipo,
    qtd

  });

  salvarCarrinho();

}

</script>

<script src="js/carrinho.js"></script>  
  
</body>
</html>
