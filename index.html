<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MM Pré-Moldados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #3f3f3f;
      color: white;
    }

    header {
      background: #e5e5e5;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header img {
      height: 40px;
    }

    /* BOTÃO CATEGORIAS */
    .area-categorias {
      padding: 15px;
      display: flex;
      justify-content: flex-start;
    }

    .btn-categorias {
      background: linear-gradient(135deg, #00bfff, #009acd);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .btn-categorias:hover {
      transform: scale(1.05);
    }

    .menu-categorias {
      display: none;
      background: #2c2c2c;
      padding: 15px;
    }

    .menu-categorias button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
    }

    .menu-categorias button:hover {
      background: #00bfff;
    }

    h2 {
      padding: 15px;
      color: #00bfff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: #1e1e1e;
      border-radius: 15px;
      overflow: hidden;
      text-align: center;
    }

    .card img {
      width: 100%;
      background: white;
    }

    .card h3 {
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <img src="img/logo.png" alt="MM Pré Moldados">
  </header>

  <!-- BOTÃO ABAIXO DO CABEÇALHO -->
  <div class="area-categorias">
    <button class="btn-categorias" onclick="toggleCategorias()">
      Categorias ▼
    </button>
  </div>

  <div id="menuCategorias" class="menu-categorias">
    <button onclick="filtrarCategoria('pingadeiras')">Pingadeiras</button>
    <button onclick="filtrarCategoria('meio_fio_jardim')">Meio-Fio de Jardim</button>
    <button onclick="filtrarCategoria('revestimento_parede')">Revestimento</button>
    <button onclick="filtrarCategoria('lajes')">Lajes</button>
  </div>

  <h2>🔥 Produtos em Destaque</h2>
  <div id="produtosDestaque" class="grid"></div>

  <h2>✨ Novidades</h2>
  <div id="produtosNovidades" class="grid"></div>

  <script src="produtos.js"></script>
  <script src="apps.js"></script>

  <script>
    function toggleCategorias() {
      const menu = document.getElementById("menuCategorias");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
  </script>

</body>
</html>
