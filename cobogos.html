<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
  transition:0.3s;
}

header.hide{
  transform:translateY(-100%);
}

/* BOTÃO MENU */
.btn-menu{
  position:fixed;
  top:20px;
  left:20px;
  z-index:1000;
  padding:10px 15px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}

/* MENU */
.menu-categorias{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:#000;
  padding:90px 20px;
  transition:0.4s;
  z-index:998;
}

.menu-categorias.active{
  left:0;
}

.menu-categorias a{
  display:block;
  color:#fff;
  text-decoration:none;
  margin:15px 0;
}

/* OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  opacity:0;
  pointer-events:none;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* PRODUTOS */
h1{
  text-align:center;
  color:#e63946;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#fff;
  padding:15px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:100px;
  object-fit:contain;
}

</style>
</head>

<body>

<button class="btn-menu" onclick="abrirMenu()">☰ Produtos</button>

<header id="header">
  <div>Carrinho</div>
</header>

<div class="menu-categorias" id="menuCategorias">
  <a href="index.html">🏠 Início</a>
  <a href="blocos.html">Blocos</a>
  <a href="manilhas.html">Manilhas</a>
  <a href="lajes.html">Lajes</a>
  <a href="cobogos.html">Cobogós</a>
</div>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>

<h1>COBOGÓS</h1>

<div class="grid">

<div class="card">
<img src="img/cobogo/cobogo-16-furos-40.jpg">
<p>16 Furos 40x40</p>
</div>

<div class="card">
<img src="img/cobogo/cobogo-4-pontas-40.jpg">
<p>4 Pontas 40x40</p>
</div>

<div class="card">
<img src="img/cobogo/cobogo-anti-chuva-40.jpg">
<p>Anti-Chuva 40x40</p>
</div>

</div>

<script>

const menu = document.getElementById("menuCategorias");
const overlay = document.getElementById("overlay");
const header = document.getElementById("header");

function abrirMenu(){
  menu.classList.add("active");
  overlay.classList.add("active");
  header.classList.add("hide"); // 👈 ESCONDE HEADER
}

function fecharMenu(){
  menu.classList.remove("active");
  overlay.classList.remove("active");
  header.classList.remove("hide"); // 👈 VOLTA HEADER
}

</script>

</body>
</html>
