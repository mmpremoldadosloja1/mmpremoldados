<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* BOTÃO MENU */
.btn-menu{
  position:fixed;
  top:20px;
  left:20px;
  z-index:1000;
  padding:10px 15px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}

/* MENU LATERAL */
.menu-categorias{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  backdrop-filter:blur(12px);
  background:rgba(0,0,0,0.88);
  padding:90px 20px;
  transition:0.4s ease;
  z-index:998;
}

.menu-categorias.active{
  left:0;
}

.menu-categorias a{
  display:block;
  color:#fff;
  text-decoration:none;
  margin:18px 0;
  font-size:15px;
  font-weight:600;
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding-bottom:10px;
  transition:0.3s;
}

.menu-categorias a:hover{
  color:#e63946;
  padding-left:8px;
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* TÍTULOS */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

</style>
</head>

<body>

<!-- BOTÃO MENU -->
<button class="btn-menu" onclick="abrirMenu()">☰ Produtos</button>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<!-- MENU LATERAL -->
<div class="menu-categorias" id="menuCategorias">
  <a href="blocos.html">Blocos e Canaletas</a>
  <a href="manilhas.html">Manilhas</a>
  <a href="lajes.html">Lajes</a>
  <a href="cobogos.html">Cobogós</a>
  <a href="pingadeiras.html">Pingadeiras</a>
  <a href="caixas.html">Caixas</a>
  <a href="pisos.html">Pisos</a>
  <a href="meio-fio.html">Meio-fio</a>
  <a href="revestimento-parede.html">Revestimentos</a>
</div>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>

<h1>COBOGÓS</h1>

<script>

const menu = document.getElementById("menuCategorias");
const overlay = document.getElementById("overlay");

function abrirMenu(){
  menu.classList.add("active");
  overlay.classList.add("active");
}

function fecharMenu(){
  menu.classList.remove("active");
  overlay.classList.remove("active");
}

function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = parseInt(input.value) + 1;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, parseInt(input.value) - 1);
}

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert('Produto adicionado');
}

</script>

</body>
</html>
