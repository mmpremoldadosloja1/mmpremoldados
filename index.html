<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f2f2f2;
  color:#333;
}

/* ===== HEADER ===== */
header{
  background:#1f1f1f;
  padding:14px 10px 18px;
  text-align:center;
}

header img{
  max-width:260px;
  width:100%;
}

header .frase{
  margin-top:8px;
  font-size:15px;
  color:#d4d4d4;
  font-weight:600;
}

/* ===== MENU ===== */
nav{
  background:#111;
  padding:10px 15px;
  display:flex;
  justify-content:flex-start;
}

.menu-btn{
  font-size:26px;
  color:#fff;
  text-decoration:none;
  padding:6px 10px;
  background:#222;
  border-radius:6px;
}

.menu-btn:hover{
  background:#c9a24d;
  color:#000;
}

/* ===== SEÇÕES ===== */
section{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h2{
  margin-bottom:15px;
  border-left:6px solid #c9a24d;
  padding-left:10px;
}

/* ===== DEPARTAMENTOS ===== */
#departamentos{
  display:none;
}

#departamentos:target{
  display:block;
}

.departamentos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
}

.departamento{
  background:#fff;
  padding:25px 15px;
  text-align:center;
  border-radius:10px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.departamento a{
  text-decoration:none;
  color:#333;
}

.departamento:hover{
  border:2px solid #c9a24d;
}

/* ===== CATÁLOGO ===== */
#catalogo{
  display:none;
}

#catalogo:target{
  display:block;
}

/* ===== PRODUTOS ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:10px;
  padding:10px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

.card h3{
  font-size:15px;
  margin:10px 0;
}

.whatsapp{
  display:inline-block;
  background:#25D366;
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
}

/* ===== MOBILE ===== */
@media (max-width:768px){
  header img{
    max-width:220px;
  }

  header .frase{
    font-size:14px;
  }
}

/* ===== FOOTER ===== */
footer{
  background:#1f1f1f;
  color:#fff;
  text-align:center;
  padding:15px;
  margin-top:40px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <img src="img/logo.png" alt="MM Pré-Moldados">
  <div class="frase">
    Qualidade, resistência e acabamento em pré-moldados
  </div>
</header>

<nav>
  <a href="#departamentos" class="menu-btn">≡</a>
</nav>

<!-- ===== DEPARTAMENTOS ===== -->
<section id="departamentos">
  <h2>Produtos</h2>

  <div class="departamentos-grid">
    <div class="departamento">Manilhas</div>
    <div class="departamento">Lajes Pré Moldadas</div>
    <div class="departamento">Pingadeiras</div>
    <div class="departamento">Blocos / Canaletas</div>
    <div class="departamento">Pisadeiras de Jardim</div>
    <div class="departamento">Revestimento de Piso</div>
    <div class="departamento">Revestimento de Parede</div>
    <div class="departamento">
      <a href="#catalogo">Cobogós</a>
    </div>
  </div>
</section>

<!-- ===== CATÁLOGO ===== -->
<section id="catalogo">
  <h2>Cobogós</h2>

  <div class="grid">
    <div class="card">
      <img src="img/cobogo-16-furos-40.jpg">
      <h3>Cobogó 16 Furos 40x40</h3>
      <a class="whatsapp" href="https://wa.me/5561999385680" target="_blank">
        WhatsApp
      </a>
    </div>
  </div>
</section>

<footer>
© MM Pré-Moldados
</footer>

</body>
</html>
