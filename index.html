<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Pré-Moldados</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER PREMIUM -->
<header class="header">
  <div class="logo">
    <img src="img/logo.png" alt="MM Pré-Moldados">
  </div>

  <div class="header-icons">
    <input type="text" placeholder="Buscar produtos">
    <div class="cart">🛒</div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>CONCRETO COM DESIGN</h1>
  <p>Sofisticação Industrial em Cada Peça</p>
  <div class="hero-line"></div>
</section>

<!-- BANNER / CARROSSEL -->
<section class="banner">
  <img src="img/banner1.jpg" alt="">
</section>

<!-- DESTAQUES -->
<section class="destaques">
  <h2>🔥 Produtos em Destaque</h2>
  <div class="cards">
    <div class="card">
      <img src="img/produto1.png" alt="">
      <h3>Cobogó 16 Furos 40x40</h3>
    </div>
  </div>
</section>

<!-- NOVIDADES -->
<section class="novidades">
  <h2>✨ Novidades</h2>
  <div class="cards">
    <div class="card">
      <img src="img/produto2.png" alt="">
      <h3>Cobogó Flor 40x40</h3>
    </div>
    <div class="card">
      <img src="img/produto3.png" alt="">
      <h3>Cobogó Estrela 30x30</h3>
    </div>
  </div>
</section>

<!-- BOTÃO WHATSAPP -->
<a href="https://wa.me/5599999999999" class="whatsapp" target="_blank">
  Solicitar Orçamento
</a>

</body>
</html>
