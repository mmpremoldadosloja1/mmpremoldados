<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

/* ===== HEADER ===== */
header{
  background:#000;
  display:flex;
  align-items:center;
  padding:10px;
}

.menu-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:26px;
  cursor:pointer;
}

.logo{
  margin-left:10px;
}

.logo img{
  height:60px;
}

.search-bar{
  flex:1;
  margin:0 10px;
}

.search-bar input{
  width:100%;
  padding:8px 12px;
  border-radius:20px;
  border:none;
  outline:none;
}

.header-icons{
  display:flex;
  gap:10px;
}

.header-icons button{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .logo img{
    height:50px;
  }
}

/* ===== SEÇÕES ===== */
.section{
  padding:20px;
}

.section h2{
  margin-bottom:10px;
}

/* ===== CARROSSEL ===== */
.carousel{
  overflow:hidden;
  width:100%;
}

.carousel-track{
  display:flex;
  gap:15px;
  transition:transform 0.5s ease;
}

.card{
  min-width:200px;
  background:#f5f5f5;
  border-radius:10px;
  padding:10px;
  text-align:center;
  cursor:pointer;
}

.card img{
  width:100%;
  border-radius:8px;
}

.card h3{
  font-size:14px;
  margin-top:8px;
}

@media(min-width:768px){
  .card{
    min-width:250px;
  }
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <button class="menu-btn">☰</button>

  <div class="logo">
    <img src="img/logo.png" alt="MM Pré-Moldados">
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Buscar produtos">
  </div>

  <div class="header-icons">
    <button>🛒</button>
  </div>
</header>

<!-- ===== PRODUTOS EM DESTAQUE ===== -->
<section class="section">
  <h2>🔥 Produtos em Destaque</h2>

  <div class="carousel">
    <div class="carousel-track" id="carouselTrack">

      <!-- COBOGÓS -->
      <div class="card">
        <img src="img/cobogos/cobogo1.jpg">
        <h3>Cobogó Modelo 01</h3>
      </div>

      <div class="card">
        <img src="img/cobogos/cobogo2.jpg">
        <h3>Cobogó Modelo 02</h3>
      </div>

      <div class="card">
        <img src="img/cobogos/cobogo3.jpg">
        <h3>Cobogó Modelo 03</h3>
      </div>

      <!-- MANILHAS -->
      <div class="card">
        <img src="img/manilhas/manilha1.jpg">
        <h3>Manilha 90cm</h3>
      </div>

      <div class="card">
        <img src="img/manilhas/manilha2.jpg">
        <h3>Manilha 1,10m</h3>
      </div>

    </div>
  </div>
</section>

<!-- ===== JAVASCRIPT ===== -->
<script>
const track = document.getElementById("carouselTrack");
let index = 0;

function moveCarousel(){
  const card = track.children[0];
  const gap = 15;
  const cardWidth = card.offsetWidth + gap;

  index++;

  if(index >= track.children.length){
    index = 0;
  }

  track.style.transform = `translateX(-${index * cardWidth}px)`;
}

setInterval(moveCarousel, 3000);
</script>

</body>
</html>
