<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f5f5;
}

header{
  background:#111;
  padding:15px;
  text-align:center;
}

header img{
  max-width:260px;
}

section{
  padding:20px;
}

h2{
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:12px;
  text-align:center;
  box-shadow:0 4px 8px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  height:180px;
  object-fit:contain;
  border-radius:8px;
}

button{
  margin-top:10px;
  background:#25d366;
  color:#fff;
  border:none;
  padding:10px;
  width:100%;
  border-radius:8px;
  font-size:15px;
}
</style>
</head>

<body>

<header>
  <img src="img/logo.png" alt="MM Pré-Moldados">
</header>

<section>
  <h2>Cobogós 40x40</h2>
  <div class="grid">
    <div class="card">
      <img src="img/cobogos/40x40/cobogo-16-furos-40.jpg">
      <p>Cobogó 16 Furos 40x40</p>
      <button>WhatsApp</button>
    </div>

    <div class="card">
      <img src="img/cobogos/40x40/cobogo-taco-chines-40.jpg">
      <p>Cobogó Taco Chinês 40x40</p>
      <button>WhatsApp</button>
    </div>
  </div>
</section>

<section>
  <h2>Cobogós 30x30</h2>
  <div class="grid">
    <div class="card">
      <img src="img/cobogos/30x30/cobogo-estrela-30.jpg">
      <p>Cobogó Estrela 30x30</p>
      <button>WhatsApp</button>
    </div>
  </div>
</section>

<section>
  <h2>Cobogós 24x24</h2>
  <div class="grid">
    <div class="card">
      <img src="img/cobogos/24x24/cobogo-4-furos-24.jpg">
      <p>Cobogó 4 Furos 24x24</p>
      <button>WhatsApp</button>
    </div>
  </div>
</section>

</body>
</html>
