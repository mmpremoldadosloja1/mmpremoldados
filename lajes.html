<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lajes | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* BASE */
body{
  background:#fff;
  font-family:'Montserrat', sans-serif;
  padding-top:90px;
}

/* HEADER IGUAL COBOGÓ */
body.sem-header{ padding-top:0 !important; }

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

header.sumir{ display:none; }

nav{
  display:flex;
  gap:25px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
}

/* ===== CARRINHO ===== */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  padding:20px;
  transition:.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{ right:0; }

.lista-carrinho{ flex:1; overflow:auto; }

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* ===== SUA ESTRUTURA (MANTIDA) ===== */

.container{
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:20px;
}

@media(min-width:900px){
  .container{
    flex-direction:row;
  }
}

.bloco{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
  width:100%;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin:10px 0;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  border-radius:5px;
  cursor:pointer;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

.btn{
  width:100%;
  padding:10px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<header id="header">
  <nav>
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav>
    <a href="#" class="nav-item" onclick="abrirCarrinho();return false;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div id="lista" class="lista-carrinho"></div>
  <button class="btn" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1 style="text-align:center;color:#e63946;">LAJES</h1>

<div class="container">

<!-- EXEMPLO BLOCO (MANTIDO) -->
<div class="bloco">

  <h3>Produto Exemplo</h3>

  <div class="contador">
    <button onclick="diminuir(this)">−</button>
    <input type="number" class="qtd" value="1" min="1">
    <button onclick="aumentar(this)">+</button>
  </div>

  <button class="btn" onclick="adicionarCarrinho(this)">
    Adicionar
  </button>

</div>

</div>

<script>

/* CONTADOR IGUAL COBOGÓ */
function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = parseInt(input.value) + 1;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, parseInt(input.value) - 1);
}

/* CARRINHO */
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.bloco');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado");
}

/* ABRIR/FECHAR */
function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  document.getElementById("header").classList.add("sumir");
  document.body.classList.add("sem-header");
  renderizar();
}

function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
  document.getElementById("header").classList.remove("sumir");
  document.body.classList.remove("sem-header");
}

/* RENDER */
function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if(carrinho.length === 0){
    lista.innerHTML = "Carrinho vazio";
    return;
  }

  carrinho.forEach((item, i)=>{
    lista.innerHTML += `
      <div class="item">
        ${item.nome} (x${item.qtd})
        <button class="remover" onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

function remover(i){
  carrinho.splice(i,1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  renderizar();
}

function enviarWhatsApp(){
  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

</script>

</body>
</html>
