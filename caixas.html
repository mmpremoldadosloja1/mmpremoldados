<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAIXAS | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/carrinho.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TITULOS */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

/* botão mobile */
.btn-carrinho{
  display:flex;
}

/* DESKTOP */
@media(min-width:900px){

  .btn-carrinho{
    display:none !important;
  }

}

</style>
</head>

  
<body>

<header>
  <nav class="nav-left">

    <a href="index.html" class="nav-item">

      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>

      Início

    </a>

  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item btn-carrinho" onclick="abrirCarrinho(); return false;">

    <a href="#"
       class="nav-item btn-carrinho"
       onclick="abrirCarrinho(); return false;">

      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>

      Carrinho

    </a>

  </nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>CAIXAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");

let carrinho;

try{

  carrinho = JSON.parse(localStorage.getItem('carrinho'));

  if(!Array.isArray(carrinho)){
    carrinho = [];
  }

}catch(e){

  carrinho = [];

}

/* CONTADOR */
function aumentar(btn){

  const input = btn.parentElement.querySelector('.qtd');

  input.value = parseInt(input.value) + 1;

}

function diminuir(btn){

  const input = btn.parentElement.querySelector('.qtd');

  input.value = Math.max(1, parseInt(input.value) - 1);

}

/* ADICIONAR */
function adicionarCarrinho(botao){

  const card = botao.closest('.card');

  const nome = card.querySelector('h3').innerText;

  const variacao = card.querySelector('select').value;

  const qtd = parseInt(card.querySelector('.qtd').value);

  const nomeFinal = nome + " - " + variacao;

  const existente = carrinho.find(item => item.nome === nomeFinal);

  if(existente){

    existente.qtd += qtd;

  }else{

    carrinho.push({
      nome: nomeFinal,
      qtd
    });

  }

  salvarCarrinho();

}

/* SALVAR */
function salvarCarrinho(){

  localStorage.setItem('carrinho', JSON.stringify(carrinho));

  renderizar();

}

/* ABRIR */
function abrirCarrinho(){

  document.getElementById("carrinho").classList.add("active");

  document.getElementById("overlay").classList.add("active");

  document.getElementById("header").classList.add("sumir");

  document.body.classList.add("sem-header");

  renderizar();

}

/* FECHAR */
function fecharCarrinho(){

  document.getElementById("carrinho").classList.remove("active");

  document.getElementById("overlay").classList.remove("active");

  document.getElementById("header").classList.remove("sumir");

  document.body.classList.remove("sem-header");

}

/* RENDER */
function renderizar(){

  const lista = document.getElementById("lista");

  lista.innerHTML = "";

  /* CARRINHO VAZIO */
  if(carrinho.length === 0){

    lista.innerHTML = `

      <div class="carrinho-vazio">

        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" width="50" height="50">

          <circle cx="9" cy="20" r="1"></circle>

          <circle cx="18" cy="20" r="1"></circle>

          <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>

        </svg>

        <p>Seu carrinho está vazio</p>

        <span>Adicione produtos para continuar</span>

      </div>

    `;

    return;

  }

  carrinho.forEach((item, i)=>{

    lista.innerHTML += `

      <div class="item">

        <div class="info-item">

          <div class="titulo-item">${item.nome}</div>

          <div class="detalhe">

            Quantidade: <strong>${item.qtd}</strong>

          </div>

        </div>

        <button class="remover" onclick="remover(${i})">

          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" width="20" height="20">

            <path d="M3 6h18"></path>

            <path d="M8 6V4h8v2"></path>

            <path d="M6 6l1 14h10l1-14"></path>

            <path d="M10 11v6"></path>

            <path d="M14 11v6"></path>

          </svg>

        </button>

      </div>

    `;

  });

}

/* REMOVER */
function remover(i){

  carrinho.splice(i,1);

  localStorage.setItem("carrinho", JSON.stringify(carrinho));

  renderizar();

}

/* WHATSAPP */
function enviarWhatsApp(){

  let msg = "Pedido:%0A";

  carrinho.forEach(item=>{

    msg += `${item.nome} - Qtd: ${item.qtd}%0A`;

  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);

}

/* PRODUTOS */
function criarProduto(nome){

  grid.innerHTML += `

    <div class="card">

      <div class="imagem-placeholder">

        Imagem

      </div>

      <h3>${nome}</h3>

      <select>

        <option>Com tampa</option>

        <option>Sem tampa</option>

      </select>

      <div class="contador">

        <button onclick="diminuir(this)">−</button>

        <input type="number" class="qtd" value="1" min="1">

        <button onclick="aumentar(this)">+</button>

      </div>

      <button class="btn" onclick="adicionarCarrinho(this)">

        Adicionar

      </button>

    </div>

  `;

}

criarProduto("Caixa de Passagem 40x40x40");

criarProduto("Caixa de Energia 30x30x20");

/* DESKTOP */
window.addEventListener("load", () => {

  if(window.innerWidth >= 900){

    document.getElementById("carrinho").classList.add("active");

  }

  renderizar();

});

</script>

<script src="js/carrinho.js"></script>

</body>
</html>
