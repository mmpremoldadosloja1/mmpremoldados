<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family:'Montserrat', sans-serif;
  overflow-x:hidden;
}

/* TITULOS */
h1{
  text-align:center;
  text-transform:uppercase;

  font-size:36px;

  margin-bottom:20px;

  color:#e63946;
}

h2{
  text-align:left;

  margin-top:30px;
  margin-bottom:15px;

  font-size:22px;

  padding-left:20px;
}

/* GRID */
.grid{
  display:grid;

  grid-template-columns:
  repeat(auto-fill, minmax(150px,1fr));

  gap:20px;

  padding:0 20px 40px 20px;
}

/* CARD */
.card{
  background:#fff;

  border-radius:12px;

  padding:15px;

  text-align:center;

  box-shadow:0 8px 20px rgba(0,0,0,0.08);

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  position:relative;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.card h3{
  margin:10px 0;

  font-size:14px;

  min-height:40px;
}

/* CONTADOR */
.contador{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:5px;

  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;

  font-size:16px;

  cursor:pointer;

  border:none;
  border-radius:5px;

  background:#eee;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}

.contador input{
  width:50px;

  text-align:center;

  border:1px solid #ccc;
  border-radius:5px;

  padding:5px;
}

/* BOTÃO */
.btn{
  width:100%;

  padding:12px 0;

  background:#e63946;

  color:#fff;

  font-weight:bold;

  border:none;
  border-radius:8px;

  cursor:pointer;

  transition:0.3s;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

  position:relative;

  z-index:1;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

/* botão mobile */
.btn-carrinho{
  display:flex;
}

/* MOBILE */
@media(max-width:899px){

  body{
    overflow-x:hidden;
  }

  .btn{
    min-height:48px;
  }

}

/* DESKTOP */
@media(min-width:900px){

  .btn-carrinho{
    display:none !important;
  }

  body{
    padding-right:320px;
  }

  header{
    width:calc(100% - 320px);
  }

}

</style>
</head>
