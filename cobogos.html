/* HEADER */

}

/* NAV */
nav{

}

.nav-left, .nav-right{
.nav-left,
.nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{

}

.nav-item{
  display:flex;

.nav-item svg{

  margin-bottom:3px;

}

.nav-item:hover{

}

/* TITULOS */
h1{
  text-align:center;
  text-transform:uppercase;

  color:#e63946;

  position:relative;
  z-index:1;
}

h2{

  margin-top:30px;
  margin-bottom:15px;

  font-size:22px;

  padding-left:20px;

  position:relative;
  z-index:1;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));

  grid-template-columns:
  repeat(auto-fill, minmax(150px,1fr));

  gap:20px;

  padding:0 20px 40px 20px;

  position:relative;
  z-index:1;
}

/* CARD */
.card{
  background:#fff;

  border-radius:12px;

  padding:15px;

  text-align:center;

  box-shadow:0 8px 20px rgba(0,0,0,0.08);

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  position:relative;
  z-index:2;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;

  position:relative;
  z-index:1;
}

.card h3{
  margin:10px 0;

  font-size:14px;

  min-height:40px;

  position:relative;
  z-index:1;
}

/* CONTADOR */
.contador{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:5px;

  margin-bottom:8px;

  position:relative;
  z-index:5;
}

.contador button{
  padding:5px 10px;

  font-size:16px;

  cursor:pointer;

  border:none;
  border-radius:5px;

  background:#eee;

  pointer-events:auto !important;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

  position:relative;
  z-index:5;
}

.contador input{
  width:50px;

  text-align:center;

  border:1px solid #ccc;
  border-radius:5px;

  padding:5px;

  pointer-events:auto !important;

  position:relative;
  z-index:5;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;

  padding:12px 0;

  background:#e63946;

  color:#fff;

  font-weight:bold;

  border:none;
  border-radius:8px;

  cursor:pointer;

  transition:0.3s;

  pointer-events:auto !important;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

  position:relative;
  z-index:10;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}
  

/* botão mobile */
.btn-carrinho{
  display:flex;

  position:relative;
  z-index:20;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}
  

/* MOBILE */
@media(max-width:899px){

  body{
    overflow-x:hidden;
  }

  .grid{
    z-index:2;
  }

  .card{
    z-index:2;
  }

  .btn{
    min-height:45px;
  }

}

/* DESKTOP */
@media(min-width:900px){

  .btn-carrinho{
    display:none !important;
  }

  body{
    padding-right:320px;
  }

  header{
    width:calc(100% - 320px);
  }

}

</style>

<script>

/* =========================
   CONTADOR
========================= */

function aumentar(btn){

  const input =
    btn.parentElement.querySelector('.qtd');

  input.value =
    parseInt(input.value) + 1;
}

function diminuir(btn){

  const input =
    btn.parentElement.querySelector('.qtd');

  input.value =
    Math.max(
      1,
      parseInt(input.value) - 1
    );
}

/* =========================
   ADD AO CARRINHO
========================= */

function adicionarCarrinho(botao){

  const card =
    botao.closest('.card');

  const nome =
    card.querySelector('h3').innerText;

  const qtd =
    parseInt(
      card.querySelector('.qtd').value
    );

  const imagem =
    card.querySelector('img').src;

  let carrinhoAtual =
    JSON.parse(
      localStorage.getItem("carrinho")
    ) || [];

  const existente =
    carrinhoAtual.find(
      item => item.nome === nome
    );

  if(existente){

    existente.qtd += qtd;

  }else{

    carrinhoAtual.push({
      nome:nome,
      qtd:qtd,
      imagem:imagem
    });
  }

  localStorage.setItem(
    "carrinho",
    JSON.stringify(carrinhoAtual)
  );

  /* ATUALIZA */

  if(typeof renderizarCarrinho === "function"){
    renderizarCarrinho();
  }

  /* MOBILE */

  if(window.innerWidth <= 899){

    const carrinho =
      document.querySelector(".carrinho-lateral");

    const overlay =
      document.querySelector(".overlay");

    if(carrinho){
      carrinho.classList.add("active");
    }

    if(overlay){
      overlay.classList.add("active");
    }
  }
}

/* =========================
   MOBILE FIX
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    /* REMOVE TOUCH DUPLO */

    const botoes =
      document.querySelectorAll(".btn");

    botoes.forEach(botao => {

      botao.style.pointerEvents = "auto";

      botao.addEventListener(
        "touchstart",
        function(e){

          e.stopPropagation();
        },
        { passive:true }
      );
    });

  }
);

</script>
