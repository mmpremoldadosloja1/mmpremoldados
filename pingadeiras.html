<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pingadeiras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="index.html" class="voltar">← Voltar</a>

<h1>Pingadeiras</h1>

<div class="grid">

  <!-- MODELO CASINHA -->
  <h2>Modelo Casinha</h2>

  <div class="card">
    <img src="img/pingadeiras/casinha.jpg" alt="Pingadeira Casinha">
    <h3>Pingadeira Casinha</h3>

    <select class="tamanho">
      <option value="1mx20cm">1m x 20cm</option>
      <option value="1mx23cm">1m x 23cm</option>
      <option value="1mx25cm">1m x 25cm</option>
      <option value="1mx30cm">1m x 30cm</option>
    </select>

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this, 'Pingadeira Casinha')">
      Adicionar ao carrinho
    </button>
  </div>


  <!-- MODELO RETA -->
  <h2>Modelo Reta</h2>

  <div class="card">
    <img src="img/pingadeiras/reta.jpg" alt="Pingadeira Reta">
    <h3>Pingadeira Reta</h3>

    <select class="tamanho">
      <option value="1mx20cm">1m x 20cm</option>
      <option value="1mx23cm">1m x 23cm</option>
      <option value="1mx25cm">1m x 25cm</option>
      <option value="1mx30cm">1m x 30cm</option>
      <option value="1mx40cm">1m x 40cm</option>
    </select>

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this, 'Pingadeira Reta')">
      Adicionar ao carrinho
    </button>
  </div>


  <!-- MODELO DEGRAU -->
  <h2>Modelo Degrau</h2>

  <div class="card">
    <img src="img/pingadeiras/degrau.jpg" alt="Pingadeira Degrau">
    <h3>Pingadeira Degrau</h3>

    <select class="tamanho">
      <option value="1mx20cm">1m x 20cm</option>
    </select>

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this, 'Pingadeira Degrau')">
      Adicionar ao carrinho
    </button>
  </div>

</div>

<script>
function mais(botao){
  const qtd = botao.parentElement.querySelector(".qtd");
  qtd.innerText = parseInt(qtd.innerText) + 1;
}

function menos(botao){
  const qtd = botao.parentElement.querySelector(".qtd");
  if(parseInt(qtd.innerText) > 1){
    qtd.innerText = parseInt(qtd.innerText) - 1;
  }
}

function adicionarCarrinho(botao, nomeModelo){
  const card = botao.closest(".card");
  const tamanho = card.querySelector(".tamanho").value;
  const qtd = card.querySelector(".qtd").innerText;

  const nomeCompleto = nomeModelo + " " + tamanho;

  let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
  carrinho.push({ nome: nomeCompleto, qtd });
  localStorage.setItem("carrinho", JSON.stringify(carrinho));

  alert("Produto adicionado ao carrinho!");
}
</script>

</body>
</html>
