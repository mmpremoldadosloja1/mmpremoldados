<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meio-Fio | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/carrinho.css">

<style>

/* BASE */
body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family:'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left,
.nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TITULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:30px;
  color:#e63946;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:25px;
  padding:0 20px 40px;
}

@media (min-width:768px){

  .grid{
    grid-template-columns:repeat(3, 1fr);
  }

}

@media (min-width:1200px){

  .grid{
    max-width:1100px;
    margin:0 auto;
  }

}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  transition:0.3s;

  position:relative;
  z-index:2;
}

.card:hover{
  transform:translateY(-5px);
}

/* IMAGEM */
.card img{
  width:100%;
  height:140px;
  object-fit:contain;
  margin-bottom:10px;
}

/* TITULO CARD */
.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin:10px 0;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;

  touch-action:manipulation;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;

  position:relative;
  z-index:9999;

  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

/* MOBILE */
.btn-carrinho{
  display:flex;
}

@media(min-width:900px){

  .btn-carrinho{
    display:none !important;
  }

}

</style>
</head>

<body>

<header>

  <nav class="nav-left">

    <a href="index.html" class="nav-item">

      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>

      </svg>

      Início

    </a>

  </nav>

  <nav class="nav-right">

    <a href="#"
       class="nav-item btn-carrinho"
       onclick="abrirCarrinho(); return false;">

      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>

      </svg>

      Carrinho

    </a>

  </nav>

</header>

<!-- CARRINHO -->

<div class="carrinho-lateral" id="carrinho">

  <h3>Seu Carrinho</h3>

  <div class="lista-carrinho" id="lista"></div>

  <button
    class="btn-finalizar"
    onclick="enviarWhatsApp()"
  >

    Finalizar

  </button>

</div>

<div
  class="overlay"
  id="overlay"
  onclick="fecharCarrinho()"
></div>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid">

  <!-- PRODUTO -->

  <div class="card">

    <img src="img/meiofio/arredondado.jpg">

    <h3>Meio-Fio Arredondado 80x25x8cm</h3>

    <div class="contador">

      <button onclick="diminuir(this)">−</button>

      <input
        type="number"
        class="qtd"
        value="1"
        min="1"
      >

      <button onclick="aumentar(this)">+</button>

    </div>

    <button
      class="btn"
      onclick="adicionarCarrinho(this)"
    >

      Adicionar

    </button>

  </div>

  <!-- PRODUTO -->

  <div class="card">

    <img src="img/meiofio/cordao.jpg">

    <h3>Meio-Fio Cordão 80x25x4cm</h3>

    <div class="contador">

      <button onclick="diminuir(this)">−</button>

      <input
        type="number"
        class="qtd"
        value="1"
        min="1"
      >

      <button onclick="aumentar(this)">+</button>

    </div>

    <button
      class="btn"
      onclick="adicionarCarrinho(this)"
    >

      Adicionar

    </button>

  </div>

  <!-- PRODUTO -->

  <div class="card">

    <img src="img/meiofio/ondulado.jpg">

    <h3>Guia de Jardim Ondulado 80x20x4cm</h3>

    <div class="contador">

      <button onclick="diminuir(this)">−</button>

      <input
        type="number"
        class="qtd"
        value="1"
        min="1"
      >

      <button onclick="aumentar(this)">+</button>

    </div>

    <button
      class="btn"
      onclick="adicionarCarrinho(this)"
    >

      Adicionar

    </button>

  </div>

</div>

<script>

/* =========================
   CONTADOR
========================= */

function aumentar(btn){

  const input =
    btn.parentElement.querySelector('.qtd');

  input.value =
    parseInt(input.value) + 1;
}

function diminuir(btn){

  const input =
    btn.parentElement.querySelector('.qtd');

  input.value =
    Math.max(
      1,
      parseInt(input.value) - 1
    );
}

/* =========================
   FIX CHROME MOBILE
========================= */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    const botoes =
      document.querySelectorAll(".btn");

    botoes.forEach(botao=>{

      function clicar(e){

        e.preventDefault();
        e.stopPropagation();

        adicionarCarrinho(botao);
      }

      /* CLICK */

      botao.addEventListener(
        "click",
        clicar
      );

      /* TOUCH */

      botao.addEventListener(
        "touchstart",
        clicar,
        { passive:false }
      );

    });

    /* BOTÃO CARRINHO */

    const btnCarrinho =
      document.querySelector(".btn-carrinho");

    if(btnCarrinho){

      btnCarrinho.addEventListener(
        "touchstart",
        function(e){

          e.preventDefault();

          abrirCarrinho();

        },
        { passive:false }
      );

    }

  }
);

</script>

<script src="js/carrinho.js"></script>

</body>
</html>
