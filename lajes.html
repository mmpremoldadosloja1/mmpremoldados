<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lajes Pré-Moldadas | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#ddd;
  color:#000;
  font-family: 'Montserrat', sans-serif;
  padding-top:70px;
  margin:0;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  position:fixed;
  top:0;
  z-index:999;
  background:#ddd;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

h1{
  text-align:center;
  text-transform:uppercase;
  font-size:32px;
  margin-bottom:30px;
  color:#e63946;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}

h2{
  text-align:left;
  margin-top:20px;
  margin-bottom:10px;
  padding-left:10px;
  font-size:20px;
}

/* GRID PARA CARDS */
.grid{
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:0 10px 50px 10px;
}

/* CARD ESTILO COBOGÓ, OCUPANDO LARGURA TOTAL */
.card{
  background:transparent;
  padding:15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

/* INPUT E SELECT */
select, input{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  margin-top:10px;
  width:100%;
  box-sizing:border-box;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

.contador button{
  padding:3px 8px;
  margin:0 5px;
  font-size:16px;
  cursor:pointer;
}

/* BOTÃO ADICIONAR */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.03);
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="nav-item">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M3 10L12 3l9 7"></path>
      <path d="M5 10v10h14V10"></path>
    </svg>
    Início
  </a>

  <a href="#" class="nav-item" style="position:relative;">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="9" cy="20" r="1"></circle>
      <circle cx="18" cy="20" r="1"></circle>
      <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
    </svg>
    Carrinho
  </a>
</header>

<h1>Lajes Pré-Moldadas</h1>

<div class="grid" id="gridProdutos"></div>

<script>
const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText)+1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText)-1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const qtd = parseInt(card.querySelector('.qtd').innerText);
  const nomeFinal = variacao ? nome + " - " + variacao : nome;

  const existente = carrinho.find(item => item.nome===nomeFinal);
  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({nome: nomeFinal, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado ao carrinho!");
}

function criarProduto(nome, opcoes=null){
  grid.innerHTML += `
  <div class="card">
    <h3>${nome}</h3>
    ${opcoes ? `<select>${opcoes.map(op=>`<option>${op}</option>`).join('')}</select>` : ''}
    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>
    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
  </div>`;
}

/* ===== Lajes Teto H8 ===== */
criarProduto("Laje Teto H8", ["7,5cm x 33cm","7,5cm x 40cm"]);

/* ===== Lajes Piso H10 ===== */
criarProduto("Laje Piso H10", ["9cm x 33cm","9cm x 40cm"]);

/* ===== Viga por Unidade ===== */
criarProduto("Viga por Unidade", ["H8","H10"]);
</script>

</body>
</html>
