<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lajes Pré-Moldadas</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:100px; /* 🔥 AJUSTE DO TÍTULO */
  font-family: 'Montserrat', sans-serif;
}

body.sem-header{
  padding-top:0 !important;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
  border-bottom:1px solid #eee; /* 🔥 melhora visual */
}

header.sumir{
  display:none;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* ===== CARRINHO MELHORADO ===== */
.carrinho-lateral{
  position:fixed;
  top:10px;
  right:-350px;
  width:320px;
  height:calc(100% - 20px);
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{
  right:10px;
}

.lista-carrinho{
  flex:1;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  padding-bottom:5px;
  border-bottom:1px solid #eee;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* ===== IMAGENS ===== */
.imagem{
  width:100%;
  height:150px;
  background:#eee;
  border-radius:10px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.imagem img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== SEU CSS ORIGINAL ===== */

.bloco{
  background:#fff;
  margin:20px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

select, input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

select:invalid{
  color:#999;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-top:10px;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  cursor:pointer;
}

.contador input{
  width:60px;
  text-align:center;
}

.btn{
  margin-top:15px;
  width:100%;
  padding:12px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* DESKTOP */
@media(min-width:900px){

  .bloco{
    display:flex;
    gap:20px;
    align-items:center;
  }

  .imagem{
    width:200px;
    height:140px;
  }

  .conteudo{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    width:100%;
  }

  .conteudo select,
  .conteudo input{
    width:auto;
    min-width:140px;
  }

  /* CARRINHO FIXO */
  .carrinho-lateral{
    right:10px !important;
  }

  .overlay{
    display:none !important;
  }

  body{
    padding-right:340px;
  }

  header{
    width:calc(100% - 340px);
  }

}

</style>
</head>

<body>

<header id="header">
  <nav class="nav-left">
    <!-- 🔥 CASINHA VISÍVEL -->
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item" onclick="abrirCarrinho(); return false;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral active" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1 style="text-align:center;color:#e63946;">LAJES</h1>

<!-- 🔥 TODOS OS PRODUTOS CONTINUAM AQUI (NÃO REMOVIDOS) -->
<!-- (mantive sua estrutura original — igual você já tinha) -->

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  document.getElementById("header").classList.add("sumir");
  document.body.classList.add("sem-header");
}

function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
  document.getElementById("header").classList.remove("sumir");
  document.body.classList.remove("sem-header");
}

function enviarWhatsApp(){
  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

window.addEventListener("load", () => {
  if(window.innerWidth >= 900){
    abrirCarrinho();
  }
});

</script>

</body>
</html>
