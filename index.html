<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Pré-Moldados</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  overflow-x:hidden;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:transparent;
}

.logo img{
  height:60px;
}

/* NAV */
nav{
  display:flex;
  gap:20px;
}

nav a{
  text-decoration:none;
  color:#fff;
  font-weight:600;
  font-size:15px;
  transition:0.3s;
}

nav a:hover{
  color:#e63946;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 20px;
  background:linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
  url('https://i.pinimg.com/1200x/cb/4c/85/cb4c850ed59a0fe32a921cc8f11d0139.jpg');
  background-size:cover;
  background-position:center;
  color:#fff;
}

/* ANIMAÇÃO HERO */
.hero-content{
  opacity:0;
  transform:translateY(40px);
  animation:fadeUp 1s ease forwards;
}

.hero-content h1{
  animation-delay:0.2s;
}

.hero-content p{
  animation-delay:0.4s;
}

.hero-content .btn-produtos{
  animation-delay:0.6s;
}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  font-size:17px;
  margin-bottom:25px;
}

.btn-produtos{
  padding:15px 32px;
  border:none;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  border-radius:8px;
  transition:0.3s;
}

.btn-produtos:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

/* MENU LATERAL */
.menu-categorias{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  backdrop-filter:blur(12px);
  background:rgba(0,0,0,0.88);
  padding:90px 20px;
  transition:0.4s ease;
  z-index:998;
}

.menu-categorias.active{
  left:0;
}

.menu-categorias a{
  display:block;
  color:#fff;
  text-decoration:none;
  margin:18px 0;
  font-size:15px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding-bottom:10px;
  transition:0.3s;
}

.menu-categorias a:hover{
  color:#e63946;
  padding-left:8px;
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* MOBILE AJUSTE */
@media(max-width:768px){

  header{
    padding:12px 15px;
  }

  nav{
    gap:12px;
  }

  nav a{
    font-size:13px;
  }

  .hero h1{
    font-size:24px;
  }

  .hero p{
    font-size:14px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="img/logo.png" alt="MM Pré-Moldados">
  </div>

  <nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Qualidade, Economia e Confiança</h1>
    <p>Lajes, blocos, manilhas, cobogós, pisos, revestimentos e muito mais</p>
    <button class="btn-produtos" onclick="abrirMenu()">Ver produtos</button>
  </div>
</section>

<div class="menu-categorias" id="menuCategorias">
  <a href="blocos.html">Blocos e Canaletas</a>
  <a href="manilhas.html">Manilhas</a>
  <a href="lajes.html">Lajes</a>
  <a href="cobogos.html">Cobogós</a>
  <a href="pingadeiras.html">Pingadeiras</a>
  <a href="caixas.html">Caixas</a>
  <a href="pisos.html">Pisos</a>
  <a href="meio-fio.html">Meio-fio</a>
  <a href="revestimento-parede.html">Revestimentos</a>
</div>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>

<script>
const menu = document.getElementById("menuCategorias");
const overlay = document.getElementById("overlay");

function abrirMenu(){
  menu.classList.add("active");
  overlay.classList.add("active");
}

function fecharMenu(){
  menu.classList.remove("active");
  overlay.classList.remove("active");
}
</script>

</body>
</html>
