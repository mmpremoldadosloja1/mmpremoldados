<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cobogós | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#111;
  color:#fff;
}

/* HEADER IGUAL HOME */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(8px);
}

.logo img{
  height:55px;
}

nav{
  display:flex;
  gap:20px;
}

nav a{
  text-decoration:none;
  color:#fff;
  font-weight:600;
  font-size:15px;
  transition:0.3s;
}

nav a:hover{
  color:#e63946;
}

/* CONTEÚDO */
.container{
  padding:120px 40px 60px;
}

.titulo-principal{
  text-align:center;
  font-size:36px;
  margin-bottom:40px;
}

.subtitulo{
  margin:50px 0 20px;
  font-size:22px;
  border-left:4px solid #e63946;
  padding-left:12px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

/* CARD PREMIUM */
.card{
  background:#1c1c1c;
  border-radius:14px;
  overflow:hidden;
  transition:0.3s;
  border:1px solid rgba(255,255,255,0.05);
}

.card:hover{
  transform:translateY(-6px);
  border-color:#e63946;
}

.card img{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#fff;
}

.card-content{
  padding:18px;
  text-align:center;
}

.card h3{
  margin-bottom:15px;
  font-size:16px;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}

.contador button{
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#2a2a2a;
  color:#fff;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

.contador button:hover{
  background:#e63946;
}

.qtd{
  font-weight:bold;
  font-size:16px;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px;
  border:none;
  background:#e63946;
  color:#fff;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
}

/* MOBILE */
@media(max-width:768px){

  .container{
    padding:110px 20px 40px;
  }

  .titulo-principal{
    font-size:24px;
  }

  .subtitulo{
    font-size:18px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="img/logo.png" alt="MM Pré-Moldados">
  </div>

  <nav>
    <a href="index.html">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
  </nav>
</header>

<div class="container">

  <h1 class="titulo-principal">Cobogós</h1>

  <!-- 40x40 -->
  <h2 class="subtitulo">Cobogós 40x40</h2>
  <div class="grid">

    <div class="card">
      <img src="img/cobogo-16-furos-40.jpg">
      <div class="card-content">
        <h3>16 Furos 40x40</h3>
        <div class="contador">
          <button onclick="alterarQtd(this,-1)">−</button>
          <span class="qtd">1</span>
          <button onclick="alterarQtd(this,1)">+</button>
        </div>
        <button class="btn" onclick="adicionarCarrinho(this)">Adicionar ao carrinho</button>
      </div>
    </div>

  </div>

</div>

<script>
function alterarQtd(botao, valor) {
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao) {
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);
  if (existente) {
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert('Produto adicionado ao carrinho');
}
</script>

</body>
</html>
