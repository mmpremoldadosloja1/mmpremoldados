<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Pré-Moldados</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter', Arial, sans-serif;
  background:#f5f5f5;
}

header{
  background:#000;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  position:relative;
}

.menu-btn{
  background:#222;
  color:#fff;
  border:none;
  font-size:22px;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.logo img{
  height:70px;
}

.search-box{
  flex:1;
}

.search-box input{
  width:80%;
  padding:12px;
  border-radius:6px;
  border:none;
  font-size:15px;
}

.cart{
  font-size:22px;
  color:#fff;
}

.menu{
  display:none;
  position:absolute;
  top:65px;
  left:10px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 6px 16px rgba(0,0,0,0.2);
  overflow:hidden;
  z-index:999;
}

.menu a{
  display:block;
  padding:12px 16px;
  color:#333;
  text-decoration:none;
  border-bottom:1px solid #eee;
}

.menu a:hover{
  background:#f0f0f0;
}

section{
  padding:20px;
}

h2{
  margin-bottom:5px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 8px rgba(0,0,0,0.08);
  text-align:center;
  transition:0.3s;
  text-decoration:none;
  color:inherit;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

.card img{
  width:100%;
  height:260px;
  object-fit:contain;
  background:#fff;
}

.card h3{
  font-size:15px;
  padding:12px;
  margin:0;
}

@media(max-width:768px){
  .logo img{
    height:50px;
  }
  .card img{
    height:150px;
  }
}
</style>
</head>

<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="logo">
    <img src="img/logo.png" alt="MM Pré-Moldados">
  </div>

  <div class="search-box">
    <input type="text" placeholder="Buscar produtos">
  </div>

  <div class="cart">🛒</div>

  <div class="menu" id="menu">
    <a href="produtos.html?categoria=pingadeiras">Pingadeiras</a>
    <a href="produtos.html?categoria=meio_fio_jardim">Meio-Fio de Jardim</a>
    <a href="produtos.html?categoria=revestimento_parede">Revestimento de Parede</a>
    <a href="produtos.html?categoria=lajes">Lajes Pré-Moldadas</a>
  </div>
</header>

<section>
  <h2>🔥 Produtos</h2>
  <div class="grid" id="produtosHome"></div>
</section>

<script src="js/produtos.js"></script>

<script>
// MENU
function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

document.addEventListener("click", function(e){
  if(!e.target.closest("header")){
    document.getElementById("menu").style.display = "none";
  }
});

// ===============================
// HOME AUTOMÁTICA
// ===============================

const homeContainer = document.getElementById("produtosHome");

Object.keys(PRODUTOS).forEach(categoria => {

  PRODUTOS[categoria].forEach(produto => {

    if(produto.imagem){

      const card = document.createElement("a");
      card.className = "card";
      card.href = `produtos.html?categoria=${categoria}`;

      card.innerHTML = `
        <img src="${produto.imagem}">
        <h3>${produto.nome}</h3>
      `;

      homeContainer.appendChild(card);
    }

  });

});
</script>

</body>
</html>
