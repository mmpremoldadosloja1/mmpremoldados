<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCOS E CANALETAS | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<h1>BLOCOS E CANALETAS</h1>

<h2>Bloco de vedação</h2>
<div class="grid" id="grid1"></div>

<h2>Canaleta de vedação</h2>
<div class="grid" id="grid2"></div>

<h2>Bloco para fechamento de coluna C/segmento</h2>
<div class="grid" id="grid3"></div>

<h2>Bloco para fechamento de coluna isolada</h2>
<div class="grid" id="grid4"></div>

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function alterarQtd(botao, valor){
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado");
}

/* CRIA CARD SEM PISCAR */
function criar(gridId, nome){

  const grid = document.getElementById(gridId);

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="img/blocos/padrao.jpg" alt="${nome}">
    <h3>${nome}</h3>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <span class="qtd">1</span>
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>
  `;

  grid.appendChild(card);
}

/* PRODUTOS */

[
"Bloco c/fundo 09x19x39cm",
"Bloco vazado 14x19x39cm"
].forEach(p => criar("grid1", p));

[
"Canaleta de 09x19x39cm",
"Canaleta de 14x19x39cm"
].forEach(p => criar("grid2", p));

[
"Bloco de pilar 09x19x39cm",
"Bloco de pilar 14x19x39cm"
].forEach(p => criar("grid3", p));

[
"Quadrado de pilar de 19x19x19cm",
"Quadrado de pilar de 25x25x19cm"
].forEach(p => criar("grid4", p));

</script>

</body>
</html>
