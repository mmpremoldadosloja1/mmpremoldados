<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCOS E CANAETAS | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* ===== CARRINHO PADRÃO ===== */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.25); /* 🔥 sombra melhor */
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;

  border-top-left-radius:50px;   /* 🔥 acabamento */
  border-bottom-left-radius:50px;
}

.carrinho-lateral.active{
  right:0;
}

.lista-carrinho{
  flex:1;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* OVERLAY (SÓ MOBILE USA) */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* TITULOS */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}
  
/* botão aparece só no mobile */
.btn-carrinho{
  display:flex;
}
  
/* 🔥 DESKTOP APENAS */
@media(min-width:900px){
.btn-carrinho{
  display:none !important;
}
  .carrinho-lateral{
    right:0 !important;
  }

  .overlay{
    display:none !important;
  }

  body{
    padding-right:320px;
  }

  header{
    width:calc(100% - 320px);
  }

}

</style>
</head>


<body>

<header id="header">
<nav class="nav-left">
<a href="index.html" class="nav-item">
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 10L12 3l9 7"></path>
<path d="M5 10v10h14V10"></path>
</svg>
Início
</a>
</nav>

<nav class="nav-right">
<a href="#" class="nav-item" onclick="abrirCarrinho(); return false;">
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<circle cx="9" cy="20" r="1"></circle>
<circle cx="18" cy="20" r="1"></circle>
<path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
</svg>
Carrinho
</a>
</nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>BLOCOS E CANALETAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* CONTADOR */
function alterarQtd(btn, valor){
  const input = btn.parentElement.querySelector('.qtd-input');
  let qtd = parseInt(input.value) || 1;
  qtd = Math.max(1, qtd + valor);
  input.value = qtd;
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd-input').value) || 1;

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado");
}

/* 🔥 ABRIR */
function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");

  document.getElementById("header").style.display = "none";
  document.body.classList.add("sem-header");

  renderizar();
}

/* 🔥 FECHAR */
function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");

  document.getElementById("header").style.display = "flex";
  document.body.classList.remove("sem-header");
}

/* RENDER */
function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if(carrinho.length === 0){
    lista.innerHTML = "Carrinho vazio";
    return;
  }

  carrinho.forEach((item, i)=>{
    lista.innerHTML += `
      <div class="item">
        ${item.nome} (x${item.qtd})
        <button class="remover" onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

/* REMOVER */
function remover(i){
  carrinho.splice(i,1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  renderizar();
}

/* WHATS */
function enviarWhatsApp(){
  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

/* PRODUTOS */
function criar(nome){
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="img/blocos/padrao.jpg">
    <h3>${nome}</h3>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <input type="number" class="qtd-input" value="1" min="1">
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>
  `;

  grid.appendChild(card);
}

function titulo(texto){
  const div = document.createElement("div");
  div.style.gridColumn = "1/-1";
  div.innerHTML = `<h2>${texto}</h2>`;
  grid.appendChild(div);
}

/* LISTA COMPLETA */
titulo("Bloco de vedação");
[
"Bloco c/fundo 09x19x39cm",
"Bloco vazado 14x19x39cm"
].forEach(criar);

titulo("Canaleta de vedação");
[
"Canaleta de 09x19x39cm",
"Canaleta de 14x19x39cm"
].forEach(criar);

titulo("Bloco para fechamento de coluna C/segmento");
[
"Bloco de pilar 09x19x39cm",
"Bloco de pilar 14x19x39cm"
].forEach(criar);

titulo("Bloco para fechamento de coluna isolada");
[
"Quadrado de pilar de 19x19x19cm",
"Quadrado de pilar de 25x25x19cm"
].forEach(criar);

</script>

</body>
</html>
