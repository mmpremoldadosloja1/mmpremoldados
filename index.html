<!DOCTYPE html>

    header {
      background: #1f1f1f;
      color: #fff;

    .card.img-24 img {

    }

    .card h3 {
      font-size: 16px;
      margin: 12px 0 10px;
    }

    .whatsapp {
      display: inline-block;
      background: #25D366;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .whatsapp:hover {
      background: #1ebe5d;
    }

    footer {
      background: #1f1f1f;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-size: 14px;
