<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produtos em Destaque | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial, sans-serif;
}

h1{
  text-align:center;
  margin:25px 0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  text-align:center;
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card h3{
  margin:12px 0;
  font-size:16px;
}

.btn{
  display:inline-block;
  margin-bottom:15px;
  padding:10px 18px;
  background:#25d366;
  color:#fff;
  text-decoration:none;
  border-radius:5px;
  font-weight:bold;
}

/* BOTÃO VOLTAR */
.voltar{
  position:fixed;
  top:15px;
  left:15px;
  width:46px;
  height:46px;
  background:#111;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.voltar svg{
  width:22px;
  height:22px;
  stroke:#fff;
  stroke-width:2.5;
  fill:none;
}
</style>
</head>

<body>

<a href="index.html" class="voltar">
  <svg viewBox="0 0 24 24">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</a>

<h1>🔥 Produtos em Destaque</h1>

  <div class="grid">

  <div class="card">
    <img src="img/cobogo-anti-chuva-40.jpg" alt="Cobogó Anti-Chuva 40x40">
    <h3>Cobogó Anti-Chuva 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/cobogo-16-furos-40.jpg" alt="Cobogó 16 Furos 40x40">
    <h3>Cobogó 16 Furos 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/manilhas/manilha-90x50.jpg" alt="Manilha 90cm x 50cm em concreto">
    <h3>Manilha 90cm x 50cm</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

</div>

</body>
</html>
