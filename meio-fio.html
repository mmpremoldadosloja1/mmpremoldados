<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Meio-Fio de Jardim | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>

/* 🔥 REMOVE LINHA BRANCA */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  overflow-x:hidden;
}

/* FUNDO PADRÃO */
body{
  background: linear-gradient(to bottom, #ddd, #ccc);
  font-family: 'Montserrat', sans-serif;
  padding-top:90px;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:transparent;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TÍTULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:30px;
  color:#e63946;
  text-shadow:2px 2px 4px rgba(0,0,0,.3);
}

/* GRID MOBILE */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  padding:0 20px 40px;
}

/* GRID PC */
@media(min-width:768px){
  .grid{
    grid-template-columns:repeat(3,1fr);
    max-width:1100px;
    margin:auto;
  }
}

/* CARD */
.card img{
  width:100%;
  height:110px;
  object-fit:contain;
  margin-bottom:10px;
  background:transparent;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:8px;
}

.contador button{
  padding:3px 8px;
  margin:0 5px;
  font-size:16px;
  cursor:pointer;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:8px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid" id="gridProdutos"></div>

<script>
const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText) + 1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText) - 1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome: nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado!");
}

function criarProduto(nome, img){
  grid.innerHTML += `
  <div class="card">

    <img src="${img}" alt="${nome}">

    <h3>${nome}</h3>

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>

  </div>`;
}

/* PRODUTOS */
criarProduto("Meio-Fio Arredondado 80x25x8cm", "img/meiofio/arredondado.jpg");
criarProduto("Meio-Fio Cordão 80x25x4cm", "img/meiofio/cordao.jpg");
criarProduto("Guia de Jardim Ondulado 80x20x4cm", "img/meiofio/ondulado.jpg");

</script>

</body>
</html>
