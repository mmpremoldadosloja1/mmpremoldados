      margin: 0;

      margin: auto;

    h2 {
      margin-top: 40px;

      border-left: 6px solid #c9a24d;

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;

      text-align: center;

    /* PADRÃO PARA A MAIORIA DOS PRODUTOS */
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card.img-24 img {
      height: 160px;
    }

    .card h3 {
      font-size: 16px;
      margin: 12px 0 5px;
    }
