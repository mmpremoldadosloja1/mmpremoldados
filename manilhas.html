<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Manilhas | MM Pré-Moldados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin: 25px 0 10px;
    }

    h2 {
      margin: 30px 20px 10px;
      border-left: 5px solid #c9a24d;
      padding-left: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .btn {
      display: inline-block;
      margin-bottom: 15px;
      padding: 10px 18px;
      background: #111;
      color: #fff;
      border-radius: 5px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .contador {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
    }

    .contador button {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f0f0f0;
      font-size: 18px;
      cursor: pointer;
    }

    .contador .qtd {
      min-width: 28px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }

    .voltar {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 46px;
      height: 46px;
      background: #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .voltar svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
    }
  </style>
</head>

<body>

<a href="index.html" class="voltar">
  <svg viewBox="0 0 24 24">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</a>

<h1>Manilhas e Tampas</h1>

<!-- ===== MANILHAS ===== -->
<h2>Manilhas</h2>

<div class="grid">

  <div class="card">
    <img src="img/manilhas/manilha-90x50.jpg" alt="Manilha 90cm x 50cm">
    <h3>Manilha 90cm x 50cm</h3>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <span class="qtd">1</span>
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar ao carrinho
    </button>
  </div>

  <div class="card">
    <img src="img/manilhas/manilha-110x50.jpg" alt="Manilha 1,10m x 50cm">
    <h3>Manilha 1,10m x 50cm</h3>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <span class="qtd">1</span>
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar ao carrinho
    </button>
  </div>

</div>

<!-- ===== TAMPAS DE MANILHA ===== -->
<h2>Tampas de Manilha</h2>

<div class="grid">

<script>
const tampas = [
"Tampa 90cm (F)",
"Tampa 90cm (A)",
"Tampa de 1m (F)",
"Tampa 1,10cm (F)",
"Tampa 1,10cm (A)",
"Tampa 1,20cm (F)",
"Tampa 1,20cm (A)",
"Tampa de manilha 40x40cm"
];

document.write(
tampas.map(nome => `
<div class="card">
  <img src="img/manilhas/tampa-padrao.jpg" alt="${nome}">
  <h3>${nome}</h3>

  <div class="contador">
    <button onclick="alterarQtd(this,-1)">−</button>
    <span class="qtd">1</span>
    <button onclick="alterarQtd(this,1)">+</button>
  </div>

  <button class="btn" onclick="adicionarCarrinho(this)">
    Adicionar ao carrinho
  </button>
</div>
`).join('')
);
</script>

</div>

<script>
function alterarQtd(botao, valor) {
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao) {
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if (existente) existente.qtd += qtd;
  else carrinho.push({ nome, qtd });

  localStorage.setItem('carrinho', JSON.stringify(carrinho));

  alert('Produto adicionado ao carrinho');
}
</script>

</body>
</html>
