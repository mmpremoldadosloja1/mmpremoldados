<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lajes | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* BASE */
body{
  background:#fff;
  font-family:'Montserrat', sans-serif;
  padding-top:90px;
}

/* HEADER IGUAL COBOGÓ */
body.sem-header{ padding-top:0 !important; }

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

header.sumir{ display:none; }

nav{
  display:flex;
  gap:25px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
}

/* ===== CARRINHO ===== */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  padding:20px;
  transition:.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{ right:0; }

.lista-carrinho{ flex:1; overflow:auto; }

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* TITULO */
h1{
  text-align:center;
  color:#e63946;
  margin-bottom:30px;
}

/* ===== LAYOUT ===== */

/* MOBILE = FOLHA */
.container{
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:20px;
}

/* DESKTOP = LINHA */
@media(min-width:900px){
  .container{
    flex-direction:row;
    justify-content:center;
    align-items:flex-start;
  }
}

/* BLOCO */
.bloco{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
  width:100%;
  max-width:350px;
}

/* IMAGEM */
.img-box{
  height:120px;
  background:#f5f5f5;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

/* INPUTS */
select,input{
  width:100%;
  padding:8px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* LABEL DESABILITADO */
.select-label{
  color:#999;
  font-size:13px;
  margin-top:10px;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin:10px 0;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  border-radius:5px;
}

.contador input{
  width:50px;
  text-align:center;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<header id="header">
  <nav>
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav>
    <a href="#" class="nav-item" onclick="abrirCarrinho();return false;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div id="lista" class="lista-carrinho"></div>
  <button class="btn" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>LAJES</h1>

<div class="container">

<!-- LAJES -->
<div class="bloco">
  <div class="img-box">Imagem</div>

  <div class="select-label">Selecione a laje</div>
  <select id="tipoLaje" onchange="atualizarIsopor()">
    <option value="">Selecione</option>
    <option value="H8">Laje Teto H8</option>
    <option value="H10">Laje Piso H10</option>
  </select>

  <select id="isopor"></select>

  <input type="number" id="comprimento" placeholder="Comprimento (m)">
  <input type="number" id="largura" placeholder="Largura (m)">

  <input type="text" id="area" placeholder="m²" readonly>

  <button class="btn" onclick="addLaje()">Adicionar</button>
</div>

<!-- VIGAS -->
<div class="bloco">
  <div class="img-box">Imagem</div>

  <select id="tipoViga">
    <option>H8 Teto</option>
    <option>H10 Piso</option>
  </select>

  <input list="listaVigas" placeholder="Tamanho">
  <datalist id="listaVigas"></datalist>

  <div class="contador">
    <button onclick="diminuir(this)">−</button>
    <input type="number" class="qtd" value="1">
    <button onclick="aumentar(this)">+</button>
  </div>

  <button class="btn" onclick="addViga()">Adicionar</button>
</div>

<!-- ISOPOR -->
<div class="bloco">
  <div class="img-box">Imagem</div>

  <select id="tipoIso">
    <option>7,5x33cm</option>
    <option>7,5x40cm</option>
    <option>9x33cm</option>
    <option>9x40cm</option>
  </select>

  <div class="contador">
    <button onclick="diminuir(this)">−</button>
    <input type="number" class="qtd" value="1">
    <button onclick="aumentar(this)">+</button>
  </div>

  <button class="btn" onclick="addIso()">Adicionar</button>
</div>

</div>

<script>

/* GERAR TAMANHOS VIGA */
for(let i=80;i<=600;i+=10){
  listaVigas.innerHTML += `<option value="${i}cm">`;
}

/* ISOPOR DINÂMICO */
function atualizarIsopor(){
  const tipo = document.getElementById("tipoLaje").value;
  const iso = document.getElementById("isopor");

  iso.innerHTML = "";

  if(tipo==="H8"){
    iso.innerHTML = `<option>7,5x33cm</option><option>7,5x40cm</option>`;
  }

  if(tipo==="H10"){
    iso.innerHTML = `<option>9x33cm</option><option>9x40cm</option>`;
  }
}

/* AREA */
document.getElementById("comprimento").oninput = calc;
document.getElementById("largura").oninput = calc;

function calc(){
  const c = comprimento.value;
  const l = largura.value;
  if(c && l){
    area.value = (c*l).toFixed(2)+" m²";
  }
}

/* CONTADOR */
function aumentar(btn){
  const input = btn.parentElement.querySelector('input');
  input.value++;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('input');
  input.value = Math.max(1,input.value-1);
}

/* CARRINHO */
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function salvar(){
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
}

function addLaje(){
  const tipo = tipoLaje.value;
  const iso = isopor.value;
  const m2 = area.value;

  carrinho.push({nome:`${tipo} - ${iso} (${m2})`,qtd:1});
  salvar(); alert("Adicionado");
}

function addViga(){
  const tipo = tipoViga.value;
  const tam = document.querySelector('#tipoViga + input').value;
  const qtd = document.querySelector('#tipoViga ~ .contador input').value;

  carrinho.push({nome:`Viga ${tipo} ${tam}`,qtd});
  salvar(); alert("Adicionado");
}

function addIso(){
  const tipo = tipoIso.value;
  const qtd = document.querySelector('#tipoIso ~ .contador input').value;

  carrinho.push({nome:`Isopor ${tipo}`,qtd});
  salvar(); alert("Adicionado");
}

/* CARRINHO UI */
function abrirCarrinho(){
  carrinhoDiv.classList.add("active");
  overlay.classList.add("active");
  header.classList.add("sumir");
  document.body.classList.add("sem-header");
  render();
}

function fecharCarrinho(){
  carrinhoDiv.classList.remove("active");
  overlay.classList.remove("active");
  header.classList.remove("sumir");
  document.body.classList.remove("sem-header");
}

const carrinhoDiv = document.getElementById("carrinho");
const overlay = document.getElementById("overlay");
const header = document.getElementById("header");

function render(){
  lista.innerHTML="";
  carrinho.forEach((item,i)=>{
    lista.innerHTML+=`
    <div class="item">
      ${item.nome} (x${item.qtd})
      <button onclick="remover(${i})">X</button>
    </div>`;
  });
}

function remover(i){
  carrinho.splice(i,1);
  salvar();
  render();
}

function enviarWhatsApp(){
  let msg="Pedido:%0A";
  carrinho.forEach(i=>{
    msg+=`${i.nome} - ${i.qtd}%0A`;
  });
  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

</script>

</body>
</html>
