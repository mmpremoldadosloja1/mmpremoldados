<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós - MM Pré-Moldados</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#f4f4f4;
  padding-top:90px;
}

/* HEADER (IGUAL INDEX) */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:transparent;
}

.logo img{
  height:60px;
}

/* NAV */
nav{
  display:flex;
  gap:20px;
  align-items:center;
}

nav a{
  text-decoration:none;
  color:#fff;
  font-weight:600;
  font-size:15px;
  transition:0.3s;
  display:flex;
  align-items:center;
}

nav a:hover{
  color:#e63946;
}

nav svg{
  width:22px;
  height:22px;
  fill:#fff;
  transition:0.3s;
}

nav a:hover svg{
  fill:#e63946;
}

/* HERO TOPO */
.topo-categoria{
  height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  position:relative;
  background:linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
  url('https://i.pinimg.com/1200x/cb/4c/85/cb4c850ed59a0fe32a921cc8f11d0139.jpg');
  background-size:cover;
  background-position:center;
}

.topo-categoria h1{
  font-size:32px;
}

/* PRODUTOS */
.produtos{
  padding:60px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:30px;
}

.card{
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(10px);
  border-radius:16px;
  padding:20px;
  text-align:center;
  transition:0.4s;
  opacity:0;
  transform:translateY(40px);
  animation:fadeUp 0.8s ease forwards;
}

.card:nth-child(1){animation-delay:0.1s;}
.card:nth-child(2){animation-delay:0.2s;}
.card:nth-child(3){animation-delay:0.3s;}
.card:nth-child(4){animation-delay:0.4s;}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card img{
  width:120px;
  margin-bottom:15px;
}

.card h3{
  font-size:16px;
  margin-bottom:8px;
}

.card p{
  font-size:14px;
  color:#555;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="img/logos/logo.png" alt="MM Pré-Moldados">
  </div>

  <nav>
    <!-- ÍCONE HOME -->
    <a href="index.html">
      <svg viewBox="0 0 24 24">
        <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/>
      </svg>
    </a>

    <!-- ÍCONE CARRINHO -->
    <a href="#">
      <svg viewBox="0 0 24 24">
        <path d="M7 4h-2l-1 2h2l3.6 7.59-1.35 2.44C7.52 17.37 8.48 19 10 19h9v-2h-9l1.1-2h6.45c.75 0 1.41-.41 1.75-1.03L23 6H6zM7 21a2 2 0 1 0 .001-3.999A2 2 0 0 0 7 21zm10 0a2 2 0 1 0 .001-3.999A2 2 0 0 0 17 21z"/>
      </svg>
    </a>
  </nav>
</header>

<section class="topo-categoria">
  <h1>Cobogós</h1>
</section>

<section class="produtos">

  <div class="card">
    <img src="img/cobogo/cobogo-16x16.png">
    <h3>Cobogó 16x16</h3>
    <p>Modelo decorativo vazado</p>
  </div>

  <div class="card">
    <img src="img/cobogo/cobogo-19x19.png">
    <h3>Cobogó 19x19</h3>
    <p>Alta resistência</p>
  </div>

  <div class="card">
    <img src="img/cobogo/cobogo-24x24.png">
    <h3>Cobogó 24x24</h3>
    <p>Ideal para fachadas modernas</p>
  </div>

  <div class="card">
    <img src="img/cobogo/cobogo-ventilado.png">
    <h3>Cobogó Ventilado</h3>
    <p>Ventilação e iluminação natural</p>
  </div>

</section>

</body>
</html>
