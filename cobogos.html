<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER TRANSPARENTE */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:transparent; /* 👈 AGORA TRANSPARENTE */
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

/* ===== CARRINHO ===== */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{
  right:0;
}

.lista-carrinho{
  flex:1;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* ===== SEU CSS ORIGINAL ===== */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  border:none;
  border-radius:5px;
  background:#eee;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <div class="nav-item" onclick="abrirCarrinho()">
      🛒 Carrinho
    </div>
  </nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>COBOGÓS</h1>

<!-- 🔥 TODOS OS SEUS PRODUTOS CONTINUAM AQUI (NÃO REMOVA NADA) -->

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  renderizar();
}

function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if(carrinho.length === 0){
    lista.innerHTML = "Carrinho vazio";
    return;
  }

  carrinho.forEach((item, i)=>{
    lista.innerHTML += `
      <div class="item">
        ${item.nome} (x${item.qtd})
        <button class="remover" onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

function remover(i){
  carrinho.splice(i,1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  renderizar();
}

function enviarWhatsApp(){
  if(carrinho.length === 0){
    alert("Carrinho vazio");
    return;
  }

  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

/* FUNÇÕES ORIGINAIS */
function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value++;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, input.value - 1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert('Produto adicionado');
}

</script>

</body>
</html>
