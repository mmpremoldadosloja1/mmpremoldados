<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lajes Pré-Moldadas | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:'Montserrat', sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

/* TÍTULO */
h1{
  text-align:center;
  color:#e63946;
  margin-bottom:30px;
}

/* CAIXA PRINCIPAL */
.container{
  max-width:600px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* CAMPOS */
select, input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

/* BOTÕES */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.add{
  background:#e63946;
  color:#fff;
}

.finalizar{
  background:#25D366;
  color:#fff;
}

/* LISTA */
.lista{
  margin-top:20px;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:8px;
  border-bottom:1px solid #ddd;
}

.remover{
  background:red;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:5px;
  cursor:pointer;
}

</style>
</head>

<body>

<h1>LAJES PRÉ-MOLDADAS</h1>

<div class="container">

  <!-- SELEÇÃO -->
  <label>Tipo de Laje</label>
  <select id="tipo">
    <option>Laje Teto H8</option>
    <option>Laje Piso H10</option>
    <option>Viga</option>
  </select>

  <label>Medida</label>
  <select id="medida">
    <option>7,5cm x 33cm</option>
    <option>7,5cm x 40cm</option>
    <option>9cm x 33cm</option>
    <option>9cm x 40cm</option>
  </select>

  <label>Quantidade</label>
  <input type="number" id="qtd" value="1" min="1">

  <button class="btn add" onclick="adicionar()">Adicionar ao pedido</button>

  <!-- LISTA -->
  <div class="lista" id="lista"></div>

  <button class="btn finalizar" onclick="enviar()">Finalizar no WhatsApp</button>

</div>

<script>

let carrinho = [];

function adicionar(){
  const tipo = document.getElementById("tipo").value;
  const medida = document.getElementById("medida").value;
  const qtd = document.getElementById("qtd").value;

  const nome = tipo + " - " + medida;

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += parseInt(qtd);
  } else {
    carrinho.push({nome, qtd: parseInt(qtd)});
  }

  renderizar();
}

function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  carrinho.forEach((item, i)=>{
    lista.innerHTML += `
      <div class="item">
        ${item.nome} (x${item.qtd})
        <button class="remover" onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

function remover(i){
  carrinho.splice(i,1);
  renderizar();
}

function enviar(){
  if(carrinho.length === 0){
    alert("Adicione itens!");
    return;
  }

  let msg = "Pedido de Lajes:%0A";

  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

</script>

</body>
</html>
