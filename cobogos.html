<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

.nav-item:hover{
  color:#e63946;
}

h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
  margin-bottom:10px;
}

.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  margin:0 5px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">Carrinho</a>
  </nav>
</header>

<h1>COBOGÓS</h1>

<div class="grid">

<div class="card">
<img src="img/cobogo/cobogo-16-furos-40.jpg">
<h3>16 Furos 40x40</h3>
<div class="contador">
<button>−</button>
<span class="qtd">1</span>
<button>+</button>
</div>
<button class="btn">Adicionar</button>
</div>

<div class="card">
<img src="img/cobogo/cobogo-4-pontas-40.jpg">
<h3>4 Pontas 40x40</h3>
<div class="contador">
<button>−</button>
<span class="qtd">1</span>
<button>+</button>
</div>
<button class="btn">Adicionar</button>
</div>

</div>

<script>

/* ===== CONTADOR COM ACELERAÇÃO ===== */
function iniciarPressao(btn, valor){

  alterarQtd(btn, valor);

  let velocidade = 300;
  let intervalo;

  function acelerar(){
    intervalo = setInterval(() => {
      alterarQtd(btn, valor);

      velocidade = Math.max(50, velocidade - 40);

      clearInterval(intervalo);
      acelerar();
    }, velocidade);
  }

  btn._intervalo = intervalo;
  btn._acelerar = acelerar;

  acelerar();
}

function pararPressao(btn){
  clearInterval(btn._intervalo);
}

function alterarQtd(botao, valor){
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

/* ===== ATIVA BOTÕES ===== */
document.querySelectorAll('.contador button').forEach(btn => {

  const valor = btn.innerText.trim() === '+' ? 1 : -1;

  btn.onclick = () => alterarQtd(btn, valor);

  btn.onmousedown = () => iniciarPressao(btn, valor);
  btn.onmouseup = () => pararPressao(btn);
  btn.onmouseleave = () => pararPressao(btn);

  btn.ontouchstart = (e) => {
    e.preventDefault();
    iniciarPressao(btn, valor);
  };

  btn.ontouchend = () => pararPressao(btn);
});

/* ===== SEGURANÇA ===== */
document.addEventListener('mouseup', () => {
  document.querySelectorAll('.contador button').forEach(pararPressao);
});

document.addEventListener('touchend', () => {
  document.querySelectorAll('.contador button').forEach(pararPressao);
});

</script>

</body>
</html>
