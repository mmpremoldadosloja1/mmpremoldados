<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MANILHAS E TAMPAS | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* ===== CARRINHO ===== */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.25);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
  border-top-left-radius:50px;
  border-bottom-left-radius:50px;
}

.carrinho-lateral.active{
  right:0;
}

.lista-carrinho{
  flex:1;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.contador{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  border-radius:5px;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
}

.btn{
  width:100%;
  padding:10px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

.btn-carrinho{
  display:flex;
}

@media(min-width:900px){
  .btn-carrinho{display:none;}
  .carrinho-lateral{right:0 !important;}
  .overlay{display:none;}
  body{padding-right:320px;}
  header{width:calc(100% - 320px);}
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item btn-carrinho" onclick="abrirCarrinho(); return false;">
      <svg viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1 style="text-align:center;color:#e63946;">MANILHAS E TAMPAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");

function titulo(texto){
  grid.innerHTML += `<div style="grid-column:1/-1"><h2>${texto}</h2></div>`;
}

function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = parseInt(input.value)+1;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, parseInt(input.value)-1);
}

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const qtd = parseInt(card.querySelector('.qtd').value);

  const nomeFinal = variacao ? nome+" - "+variacao : nome;

  const existente = carrinho.find(i=>i.nome===nomeFinal);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome:nomeFinal,qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  renderizar();
}

function criarProduto(nome, opcoes=null){
  grid.innerHTML += `
  <div class="card">
    <div style="height:110px;display:flex;align-items:center;justify-content:center;background:#f3f3f3;border-radius:8px;margin-bottom:10px;">
      IMG
    </div>

    <h3>${nome}</h3>

    ${opcoes ? `
      <select style="margin:10px 0;padding:6px;width:100%;">
        ${opcoes.map(op=>`<option>${op}</option>`).join('')}
      </select>` : ''}

    <div class="contador">
      <button onclick="diminuir(this)">−</button>
      <input type="number" class="qtd" value="1" min="1">
      <button onclick="aumentar(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
  </div>`;
}

/* PRODUTOS */
titulo("Manilhas");
["Manilha 90cm x 50cm","Manilha 1,10m x 50cm"]
.forEach(n=>criarProduto(n));

titulo("Tampas de Manilha");
criarProduto("Tampa 90cm",["Aberta","Fechada"]);
criarProduto("Tampa 1m",["Aberta","Fechada"]);
criarProduto("Tampa 1,10cm",["Aberta","Fechada"]);
criarProduto("Tampa 1,20cm",["Aberta","Fechada"]);

/* CARRINHO */
function abrirCarrinho(){
  carrinhoEl.classList.add("active");
  overlay.classList.add("active");
  renderizar();
}

function fecharCarrinho(){
  carrinhoEl.classList.remove("active");
  overlay.classList.remove("active");
}

function renderizar(){
  lista.innerHTML="";
  carrinho.forEach((item,i)=>{
    lista.innerHTML+=`
    <div class="item">
      ${item.nome} (x${item.qtd})
      <button class="remover" onclick="remover(${i})">X</button>
    </div>`;
  });
}

function remover(i){
  carrinho.splice(i,1);
  localStorage.setItem('carrinho',JSON.stringify(carrinho));
  renderizar();
}

function enviarWhatsApp(){
  let msg="Pedido:%0A";
  carrinho.forEach(i=>{
    msg+=`${i.nome} - ${i.qtd}%0A`;
  });
  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

const carrinhoEl=document.getElementById("carrinho");
const overlay=document.getElementById("overlay");
const lista=document.getElementById("lista");

window.addEventListener("load",()=>{
  if(window.innerWidth>=900){
    carrinhoEl.classList.add("active");
    renderizar();
  }
});

</script>

</body>
</html>
