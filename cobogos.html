<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>
/* HEADER IGUAL AO INDEX */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:transparent;
}

.logo img{
  height:60px;
}

/* MENU COM ÍCONES */
nav{
  display:flex;
  gap:35px;
}

/* BOTÃO COM ÍCONE + TEXTO */
.nav-icon{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#111;
  font-size:12px;
  font-weight:600;
  transition:.3s;
}

.nav-icon svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

.nav-icon:hover{
  color:#e63946;
}

/* espaço para não cobrir os produtos */
body{
  padding-top:95px;
}

/* ANIMAÇÃO DE ENTRADA */
.card{
  opacity:0;
  transform:translateY(30px);
  animation:fadeUp 0.6s ease forwards;
}

.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.2s}
.card:nth-child(4){animation-delay:.3s}
.card:nth-child(5){animation-delay:.4s}
.card:nth-child(6){animation-delay:.5s}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* IMAGENS TRANSPARENTES */
.card img{
  width:100%;
  height:110px;
  object-fit:contain;
  margin-bottom:10px;
  background:transparent;
  border:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="img/logos/logo.png" alt="MM Pré-Moldados">
  </div>

  <nav>

    <!-- CASA -->
    <a href="index.html" class="nav-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 10L12 3L21 10"></path>
        <path d="M5 10V21H19V10"></path>
      </svg>
      Início
    </a>

    <!-- CARRINHO -->
    <a href="#" class="nav-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1H5L7.7 14.4A2 2 0 009.6 16H19A2 2 0 0021 14.4L23 6H6"></path>
      </svg>
      Carrinho
    </a>

  </nav>
</header>

<h1>Cobogós</h1>
