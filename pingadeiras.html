<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Pingadeiras</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
}

/* BOTÃO VOLTAR PADRÃO */
.botao-voltar {
    display: inline-block;
    padding: 12px 28px;
    background-color: #000;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.3s ease;
    margin-bottom: 50px;
}

.botao-voltar:hover {
    background-color: #333;
    transform: translateX(-5px);
}

/* TÍTULO */
h1 {
    text-align: center;
    margin-bottom: 60px;
    letter-spacing: 2px;
}

/* SEÇÃO MODELO */
.modelo {
    margin-bottom: 80px;
}

.modelo h2 {
    margin-bottom: 25px;
}

/* ESPAÇO IMAGEM */
.imagem-centro {
    width: 350px;
    height: 220px;
    margin: 0 auto 25px auto;
    background-color: #f2f2f2;
    border: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 14px;
}

/* BLOCO PRODUTO */
.produto {
    text-align: center;
}

.produto h3 {
    margin-bottom: 15px;
}

/* SELECT E BOTÕES */
select {
    padding: 8px;
    font-size: 14px;
    margin-bottom: 15px;
}

.quantidade {
    margin: 10px 0 20px 0;
}

.quantidade button {
    padding: 6px 12px;
    font-size: 14px;
}

button {
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>

<body>

<a href="index.html" class="botao-voltar">← Voltar</a>

<h1>PINGADEIRAS</h1>

<!-- MODELO CASINHA -->
<div class="modelo">
    <h2>Modelo Casinha</h2>

    <div class="imagem-centro">
        Imagem será adicionada aqui
    </div>

    <div class="produto">
        <h3>Pingadeira Casinha</h3>

        <select>
            <option>1m x 20cm</option>
            <option>1m x 23cm</option>
            <option>1m x 25cm</option>
            <option>1m x 30cm</option>
        </select>

        <div class="quantidade">
            <button>-</button>
            1
            <button>+</button>
        </div>

        <button>Adicionar ao carrinho</button>
    </div>
</div>

<!-- MODELO RETA -->
<div class="modelo">
    <h2>Modelo Reta</h2>

    <div class="imagem-centro">
        Imagem será adicionada aqui
    </div>

    <div class="produto">
        <h3>Pingadeira Reta</h3>

        <select>
            <option>1m x 20cm</option>
            <option>1m x 23cm</option>
            <option>1m x 25cm</option>
            <option>1m x 30cm</option>
            <option>1m x 40cm</option>
        </select>

        <div class="quantidade">
            <button>-</button>
            1
            <button>+</button>
        </div>

        <button>Adicionar ao carrinho</button>
    </div>
</div>

<!-- MODELO DEGRAU -->
<div class="modelo">
    <h2>Modelo Degrau</h2>

    <div class="imagem-centro">
        Imagem será adicionada aqui
    </div>

    <div class="produto">
        <h3>Pingadeira Degrau</h3>

        <select>
            <option>1m x 20cm</option>
        </select>

        <div class="quantidade">
            <button>-</button>
            1
            <button>+</button>
        </div>

        <button>Adicionar ao carrinho</button>
    </div>
</div>

</body>
</html>
