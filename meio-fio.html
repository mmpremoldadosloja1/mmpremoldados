<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEIO-FIO | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* CONTADOR */
function alterarQtd(botao, valor){
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado");
}

/* PRODUTOS */
const produtos = [
  {
    nome: "Meio-Fio Arredondado 80x25x8cm",
    img: "img/meiofio/arredondado.jpg"
  },
  {
    nome: "Meio-Fio Cordão 80x25x4cm",
    img: "img/meiofio/cordao.jpg"
  },
  {
    nome: "Guia de Jardim Ondulado 80x20x4cm",
    img: "img/meiofio/ondulado.jpg"
  }
];

/* CRIAR */
function criar(produto){
  grid.innerHTML += `
  <div class="card">

    <img src="${produto.img}" alt="${produto.nome}">

    <h3>${produto.nome}</h3>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <span class="qtd">1</span>
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>

  </div>`;
}

produtos.forEach(criar);

</script>

</body>
</html>
