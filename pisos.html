<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PISOS | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/carrinho.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family:'Montserrat', sans-serif;
}

/* HEADER */

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left,
.nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TITULOS */

h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,2fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

/* CARD */

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

/* SELECT */

.card select{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

/* CONTADOR */

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

/* BOTÃO */

.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

/* MOBILE */

.btn-carrinho{
  display:flex;
}

@media(min-width:900px){

  .btn-carrinho{
    display:none !important;
  }

}

</style>
</head>

<body>

<header>

  <nav class="nav-left">

    <a href="index.html" class="nav-item">

      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>

      Início

    </a>

  </nav>

  <nav class="nav-right">

    <a href="#"
       class="nav-item btn-carrinho"
       onclick="abrirCarrinho(); return false;">

      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>

      Carrinho

    </a>

  </nav>

</header>

<!-- CARRINHO -->

<div class="carrinho-lateral" id="carrinho">

  <h3>Seu Carrinho</h3>

  <div class="lista-carrinho" id="lista"></div>

  <button class="btn-finalizar" onclick="enviarWhatsApp()">
    Finalizar
  </button>

</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>PISOS E PISADEIRAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

/* TITULOS */

function titulo(texto){

  grid.innerHTML += `

    <div style="grid-column:1/-1">

      <h2>${texto}</h2>

    </div>

  `;
}

/* CONTADOR */

function aumentar(btn){

  const input =
    btn.parentElement.querySelector('.qtd');

  input.value =
    parseInt(input.value) + 1;
}

function diminuir(btn){

  const input =
    btn.parentElement.querySelector('.qtd');

  input.value =
    Math.max(
      1,
      parseInt(input.value) - 1
    );
}

/* GRID */

const grid =
  document.getElementById("gridProdutos");

/* PRODUTOS */

titulo("Pisos");

criarProduto(
  "Piso Quadrado Liso",
  "img/pisos/piso-quadrado.jpg",
  ["40x40cm","50x50cm","60x60cm"]
);

criarProduto(
  "Piso Copacabana 50x50cm",
  "img/pisos/piso-copacabana.jpg"
);

criarProduto(
  "Piso Trabalhado em Flor 45x45cm",
  "img/pisos/piso-flor.jpg"
);

criarProduto(
  "Piso em X 45x45cm",
  "img/pisos/piso-em-x.jpg"
);

titulo("Pisadeiras");

criarProduto(
  "Pezão de Jardim 50cm",
  "img/pisos/pezao.jpg"
);

criarProduto(
  "Círculo Estelar 50cm",
  "img/pisos/circulo-estelar.jpg"
);

criarProduto(
  "Pisadeira Xis 50cm",
  "img/pisos/pisadeira-x.jpg"
);

titulo("Conjuntos");

criarProduto(
  "Conjunto Trevo Oriente 60x60cm",
  "img/pisos/trevo-oriente.jpg"
);

criarProduto(
  "Conjunto Passarela Estrelado 70x70cm",
  "img/pisos/passarela.jpg"
);

criarProduto(
  "Conjunto Circulo Quadrado 140x140cm",
  "img/pisos/conjunto-circulo-quadrado.jpg"
);

/* CRIAR PRODUTO */

function criarProduto(
  nome,
  img,
  opcoes = null
){

  grid.innerHTML += `

  <div class="card">

    <img src="${img}">

    <h3>${nome}</h3>

    ${
      opcoes
      ?
      `
      <select>

        ${opcoes.map(
          o => `<option>${o}</option>`
        ).join('')}

      </select>
      `
      :
      ''
    }

    <div class="contador">

      <button onclick="diminuir(this)">
        −
      </button>

      <input
        type="number"
        class="qtd"
        value="1"
        min="1"
      >

      <button onclick="aumentar(this)">
        +
      </button>

    </div>

    <button
      class="btn"
      onclick="adicionarCarrinho(this)"
    >

      Adicionar

    </button>

  </div>

  `;
}

</script>

<script src="js/carrinho.js"></script>

</body>
</html>
