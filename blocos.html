<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCOS E CANALETAS | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

/* NAV COM EFEITO */
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TITULOS */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  transition:0.3s;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  opacity:0;
  transform:translateY(30px);
  animation:fadeUp 0.6s ease forwards;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 25px rgba(0,0,0,0.12);
}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
  margin-bottom:10px;
}

.card h3{
  font-size:14px;
  margin:10px 0;
  min-height:40px;
}

/* CONTADOR COMPLETO */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:10px 0;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.qtd-input{
  width:60px;
  padding:6px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:6px;
  font-weight:bold;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

</style>
</head>

<body>

<header>
<nav class="nav-left">
<a href="index.html" class="nav-item">
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 10L12 3l9 7"></path>
<path d="M5 10v10h14V10"></path>
</svg>
Início
</a>
</nav>

<nav class="nav-right">
<a href="#" class="nav-item">
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<circle cx="9" cy="20" r="1"></circle>
<circle cx="18" cy="20" r="1"></circle>
<path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
</svg>
Carrinho
</a>
</nav>
</header>

<h1>BLOCOS E CANALETAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* CONTADOR */
function alterarQtd(btn, valor){
  const input = btn.parentElement.querySelector('.qtd-input');
  let qtd = parseInt(input.value) || 1;
  qtd = Math.max(1, qtd + valor);
  input.value = qtd;
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd-input').value) || 1;

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado");
}

/* CRIAR CARD */
function criar(nome){
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="img/blocos/padrao.jpg">
    <h3>${nome}</h3>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <input type="number" class="qtd-input" value="1" min="1">
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>
  `;

  grid.appendChild(card);
}

function titulo(texto){
  const div = document.createElement("div");
  div.style.gridColumn = "1/-1";
  div.innerHTML = `<h2>${texto}</h2>`;
  grid.appendChild(div);
}

/* PRODUTOS (TODOS MANTIDOS) */
titulo("Bloco de vedação");
[
"Bloco c/fundo 09x19x39cm",
"Bloco vazado 14x19x39cm"
].forEach(criar);

titulo("Canaleta de vedação");
[
"Canaleta de 09x19x39cm",
"Canaleta de 14x19x39cm"
].forEach(criar);

titulo("Bloco para fechamento de coluna C/segmento");
[
"Bloco de pilar 09x19x39cm",
"Bloco de pilar 14x19x39cm"
].forEach(criar);

titulo("Bloco para fechamento de coluna isolada");
[
"Quadrado de pilar de 19x19x19cm",
"Quadrado de pilar de 25x25x19cm"
].forEach(criar);

</script>

</body>
</html>
