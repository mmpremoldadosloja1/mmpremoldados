<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Pingadeiras</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
}

/* BOTÃO VOLTAR */
.botao-voltar {
    display: inline-block;
    margin-bottom: 30px;
    padding: 8px 15px;
    background-color: #333;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    transition: 0.3s;
}

.botao-voltar:hover {
    background-color: #555;
    transform: translateX(-5px);
}

/* TÍTULO */
h1 {
    text-align: center;
    margin-bottom: 50px;
}

/* MODELOS */
.modelo {
    margin-bottom: 60px;
}

.modelo h2 {
    text-align: left;
    margin-bottom: 20px;
}

/* ESPAÇO DA IMAGEM */
.imagem-centro {
    width: 300px;
    height: 200px;
    margin: 0 auto 20px auto;
    background-color: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 14px;
    border: 1px solid #ddd;
}

/* PRODUTO */
.produto {
    text-align: center;
}

select, button {
    padding: 6px;
    margin-top: 8px;
}

.quantidade {
    margin: 10px 0;
}
</style>
</head>

<body>

<a href="index.html" class="botao-voltar">← Voltar</a>

<h1>PINGADEIRAS</h1>

<!-- MODELO CASINHA -->
<div class="modelo">
    <h2>Modelo Casinha</h2>

    <div class="imagem-centro">
        Imagem será adicionada aqui
    </div>

    <div class="produto">
        <h3>Pingadeira Casinha</h3>

        <select>
            <option>1m x 20cm</option>
            <option>1m x 23cm</option>
            <option>1m x 25cm</option>
            <option>1m x 30cm</option>
        </select>

        <div class="quantidade">
            <button>-</button>
            1
            <button>+</button>
        </div>

        <button>Adicionar ao carrinho</button>
    </div>
</div>

<!-- MODELO RETA -->
<div class="modelo">
    <h2>Modelo Reta</h2>

    <div class="imagem-centro">
        Imagem será adicionada aqui
    </div>

    <div class="produto">
        <h3>Pingadeira Reta</h3>

        <select>
            <option>1m x 20cm</option>
            <option>1m x 23cm</option>
            <option>1m x 25cm</option>
            <option>1m x 30cm</option>
            <option>1m x 40cm</option>
        </select>

        <div class="quantidade">
            <button>-</button>
            1
            <button>+</button>
        </div>

        <button>Adicionar ao carrinho</button>
    </div>
</div>

<!-- MODELO DEGRAU -->
<div class="modelo">
    <h2>Modelo Degrau</h2>

    <div class="imagem-centro">
        Imagem será adicionada aqui
    </div>

    <div class="produto">
        <h3>Pingadeira Degrau</h3>

        <select>
            <option>1m x 20cm</option>
        </select>

        <div class="quantidade">
            <button>-</button>
            1
            <button>+</button>
        </div>

        <button>Adicionar ao carrinho</button>
    </div>
</div>

</body>
</html>
