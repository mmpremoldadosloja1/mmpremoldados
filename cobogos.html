<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family:'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
}

/* CARRINHO */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.25);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
  border-top-left-radius:15px;
  border-bottom-left-radius:15px;
}

.carrinho-lateral.active{ right:0; }

.lista-carrinho{ flex:1; overflow-y:auto; }

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* TITULOS */
h1{
  text-align:center;
  color:#e63946;
}

h2{
  padding-left:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.contador{
  display:flex;
  justify-content:center;
  gap:5px;
  margin:10px 0;
}

.contador input{ width:50px; text-align:center; }

.btn{
  width:100%;
  padding:10px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* DESKTOP */
@media(min-width:900px){
  .carrinho-lateral{ right:0 !important; }
  .overlay{ display:none !important; }
  body{ padding-right:320px; }
  header{ width:calc(100% - 320px); }
}

</style>
</head>

<body>

<header>
  <nav>
    <a href="index.html" class="nav-item">Início</a>
    <a href="#" class="nav-item" onclick="abrirCarrinho();return false;">Carrinho</a>
  </nav>
</header>

<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>COBOGÓS</h1>

<h2>40x40</h2>
<div class="grid">

<div class="card"><img src="img/cobogo/cobogo-16-furos-40.jpg"><h3>16 Furos 40x40</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-4-pontas-40.jpg"><h3>4 Pontas 40x40</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-anti-chuva-40.jpg"><h3>Anti-Chuva 40x40</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-arabe-40.jpg"><h3>Árabe 40x40</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-flor-40.jpg"><h3>Flor 40x40</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-taco-chines-40.jpg"><h3>Taco Chinês 40x40</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

</div>

<h2>30x30</h2>
<div class="grid">

<div class="card"><img src="img/cobogo/cobogo-estrela-30.jpg"><h3>Estrela 30x30</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-estrela-dos-ventos-30.jpg"><h3>Estrela dos Ventos 30x30</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-fenestra-30.jpg"><h3>Fenestra 30x30</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-petala-30.jpg"><h3>Pétala 30x30</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-quadrado-cruz-30.jpg"><h3>Quadrado Cruz 30x30</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

<div class="card"><img src="img/cobogo/cobogo-xis-30.jpg"><h3>Xis 30x30</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

</div>

<h2>24x24</h2>
<div class="grid">

<div class="card"><img src="img/cobogo/cobogo-4-furos-24.jpg"><h3>4 Furos 24x24</h3><div class="contador"><button onclick="dim(this)">-</button><input class="qtd" value="1"><button onclick="mais(this)">+</button></div><button class="btn" onclick="add(this)">Adicionar</button></div>

</div>

<script>

/* BASE */
function getC(){ return JSON.parse(localStorage.getItem('carrinho')) || []; }
function setC(c){ localStorage.setItem('carrinho', JSON.stringify(c)); }

/* CONTADOR */
function mais(btn){ let i=btn.parentElement.querySelector('.qtd'); i.value++; }
function dim(btn){ let i=btn.parentElement.querySelector('.qtd'); i.value=Math.max(1,i.value-1); }

/* ADD */
function add(btn){
  let c = getC();

  let card = btn.closest('.card');
  let nome = card.querySelector('h3').innerText;
  let qtd = parseInt(card.querySelector('.qtd').value);

  let ex = c.find(i=>i.nome===nome);

  if(ex){ ex.qtd+=qtd; } else { c.push({nome,qtd}); }

  setC(c);
  render();
}

/* RENDER */
function render(){
  let lista = document.getElementById("lista");
  let c = getC();
  lista.innerHTML="";

  if(c.length===0){ lista.innerHTML="Carrinho vazio"; return; }

  c.forEach((i,x)=>{
    lista.innerHTML+=`<div class="item">${i.nome} (x${i.qtd}) <button class="remover" onclick="rem(${x})">X</button></div>`;
  });
}

function rem(i){
  let c=getC();
  c.splice(i,1);
  setC(c);
  render();
}

/* UI */
function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  render();
}

function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

function enviarWhatsApp(){
  let c=getC();
  let msg="Pedido:%0A";
  c.forEach(i=> msg+=`${i.nome} - ${i.qtd}%0A`);
  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

/* INIT */
window.onload = ()=>{ render(); };

</script>

</body>
</html>
