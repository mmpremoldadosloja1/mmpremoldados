<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lajes Pré-Moldadas</title>

<style>

body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background:#f5f5f5;
  padding-top:90px;
}

/* HEADER (COPIADO DO COBOGÓ) */
body.sem-header{
  padding-top:0 !important;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

header.sumir{
  display:none;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
}

/* CARRINHO */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{
  right:0;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* BLOCO */
.bloco{
  background:#fff;
  margin:20px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.imagem{
  width:100%;
  height:150px;
  background:#eee;
  border-radius:10px;
  margin-bottom:15px;
}

/* INPUTS */
select, input{
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* PLACEHOLDER */
select:invalid{
  color:#999;
}

/* CONTEUDO */
.conteudo{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

/* CONTADOR */
.contador{
  display:flex;
  align-items:center;
  gap:5px;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  cursor:pointer;
}

.contador input{
  width:60px;
  text-align:center;
}

/* BOTÃO */
.btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* DESKTOP */
@media(min-width:900px){
  .bloco{
    display:flex;
    gap:20px;
    align-items:center;
  }

  .imagem{
    width:200px;
    height:140px;
    flex-shrink:0;
  }
}

</style>
</head>

<body>

<!-- HEADER CORRETO -->
<header id="header">
  <div class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </div>

  <div class="nav-right">
    <a href="#" class="nav-item" onclick="abrirCarrinho();return false;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </div>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div id="lista"></div>
  <button class="btn" onclick="enviar()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1 style="text-align:center;color:#e63946;">LAJES</h1>

<!-- LAJES -->
<div class="bloco">
<div class="imagem"></div>

<div class="conteudo">

<select id="tipoLaje" required onchange="atualizarIsopor()">
<option value="" disabled selected>Selecione a laje</option>
<option value="H8">Laje de Teto H8</option>
<option value="H10">Laje de Piso H10</option>
</select>

<select id="isopor" required>
<option value="" disabled selected>Selecione o isopor</option>
</select>

<input type="number" id="c" placeholder="Comprimento">
<input type="number" id="l" placeholder="Largura">

<div id="m2">0 m²</div>

<button class="btn" onclick="addLaje()">Adicionar</button>

</div>
</div>

<!-- VIGAS -->
<div class="bloco">
<div class="imagem"></div>

<div class="conteudo">

<select id="tipoViga">
<option>H8 TETO</option>
<option>H10 PISO</option>
</select>

<input list="listaVigas" id="tamViga" placeholder="Tamanho">

<datalist id="listaVigas"></datalist>

<div class="contador">
<button onclick="dim('qv')">-</button>
<input id="qv" value="1">
<button onclick="mais('qv')">+</button>
</div>

<button class="btn" onclick="addViga()">Adicionar</button>

</div>
</div>

<!-- ISOPOR -->
<div class="bloco">
<div class="imagem"></div>

<div class="conteudo">

<select id="tipoIso">
<option>H8 - 7,5x33</option>
<option>H8 - 7,5x40</option>
<option>H10 - 9x33</option>
<option>H10 - 9x40</option>
</select>

<div class="contador">
<button onclick="dim('qi')">-</button>
<input id="qi" value="1">
<button onclick="mais('qi')">+</button>
</div>

<button class="btn" onclick="addIso()">Adicionar</button>

</div>
</div>

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* ISOPOR DINÂMICO */
function atualizarIsopor(){
  const tipo = document.getElementById("tipoLaje").value;
  const select = document.getElementById("isopor");

  select.innerHTML = `<option disabled selected>Selecione o isopor</option>`;

  if(tipo === "H8"){
    select.innerHTML += `<option>7,5x33</option>`;
    select.innerHTML += `<option>7,5x40</option>`;
  }

  if(tipo === "H10"){
    select.innerHTML += `<option>9x33</option>`;
    select.innerHTML += `<option>9x40</option>`;
  }
}

/* M2 */
c.oninput = l.oninput = ()=>{
  m2.innerText = ((c.value*l.value)||0).toFixed(2)+" m²";
};

/* CONTADOR */
function mais(id){
  let el = document.getElementById(id);
  el.value = parseInt(el.value||1)+1;
}

function dim(id){
  let el = document.getElementById(id);
  el.value = Math.max(1, parseInt(el.value||1)-1);
}

/* VIGAS */
for(let i=0.8;i<=6;i+=0.1){
  listaVigas.innerHTML += `<option value="${i.toFixed(1)}m">`;
}

/* ADD */
function addLaje(){ carrinho.push({nome:"Laje",qtd:1}); salvar(); }
function addViga(){ carrinho.push({nome:"Viga",qtd:1}); salvar(); }
function addIso(){ carrinho.push({nome:"Isopor",qtd:1}); salvar(); }

/* CARRINHO */
function salvar(){
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  render();
}

function abrirCarrinho(){
  carrinho.classList.add("active");
  overlay.classList.add("active");
  header.classList.add("sumir");
  document.body.classList.add("sem-header");
  render();
}

function fecharCarrinho(){
  carrinho.classList.remove("active");
  overlay.classList.remove("active");
  header.classList.remove("sumir");
  document.body.classList.remove("sem-header");
}

function render(){
  lista.innerHTML="";
  carrinho.forEach((i,index)=>{
    lista.innerHTML+=`${i.nome} (${i.qtd}) <br>`;
  });
}

function enviar(){
  let msg="Pedido:%0A";
  carrinho.forEach(i=> msg+=`${i.nome} - ${i.qtd}%0A`);
  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

</script>

</body>
</html>
