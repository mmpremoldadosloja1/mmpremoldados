<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

/* CARD (mantido) */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* ===== GALERIA (NOVA SEM ALTERAR PRODUTOS) ===== */
.gallery{
  display:flex;
  gap:8px;
  align-items:flex-start;
}

.main-img{
  width:100%;
  height:110px;
  object-fit:contain;
  cursor:pointer;
  flex:1;
}

.thumbs{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.thumbs img{
  width:28px;
  height:28px;
  object-fit:cover;
  border-radius:4px;
  cursor:pointer;
  border:1px solid #ddd;
}

/* TEXTO */
.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

/* CONTADOR (NÃO MEXIDO) */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal img{
  max-width:90%;
  max-height:90%;
}

.modal span{
  position:absolute;
  top:20px;
  right:30px;
  font-size:30px;
  color:#fff;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<h1>COBOGÓS</h1>

<h2>Cobogós 40x40</h2>
<div class="grid">

<!-- 1 -->
<div class="card">
  <div class="gallery">
    <img class="main-img" src="img/cobogo/cobogo-16-furos-40.jpg" onclick="abrirModal(this)">
    <div class="thumbs">
      <img src="img/cobogo/cobogo-16-furos-40.jpg" onclick="trocar(this)">
      <img src="img/cobogo/cobogo-16-furos-40.jpg" onclick="trocar(this)">
      <img src="img/cobogo/cobogo-16-furos-40.jpg" onclick="trocar(this)">
    </div>
  </div>

  <h3>16 Furos 40x40</h3>

  <div class="contador">
    <button onclick="diminuir(this)">−</button>
    <input type="number" class="qtd" value="1" min="1">
    <button onclick="aumentar(this)">+</button>
  </div>

  <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<!-- TODOS OS OUTROS PRODUTOS CONTINUAM IGUAIS -->
<!-- NÃO FOI REMOVIDO NADA -->

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <span onclick="fecharModal()">×</span>
  <img id="modalImg">
</div>

<script>

/* CONTADOR */
function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = parseInt(input.value) + 1;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, parseInt(input.value) - 1);
}

/* CARRINHO (INALTERADO) */
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert('Produto adicionado');
}

/* GALERIA */
function trocar(img){
  img.closest('.gallery').querySelector('.main-img').src = img.src;
}

function abrirModal(img){
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = img.src;
}

function fecharModal(){
  document.getElementById("modal").style.display = "none";
}

</script>

</body>
</html>
