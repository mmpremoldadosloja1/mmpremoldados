<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

/* ===== CABEÇALHO ===== */
header {
  background: #000;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* HAMBURGUER */
.hamburger {
  font-size: 22px;
  color: #fff;
  cursor: pointer;
}

/* LOGO */
.logo img {
  height: 60px;
}

/* BUSCA */
.search-box {
  flex: 1;
}

.search-box input {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: none;
  font-size: 15px;
}

/* CARRINHO */
.cart {
  font-size: 22px;
  color: #fff;
}

/* ===== SEÇÕES ===== */
section {
  padding: 20px;
}

section h2 {
  margin: 0 0 5px;
}

.ver-todos {
  font-size: 14px;
  color: #555;
  display: inline-block;
  margin-bottom: 15px;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

/* ===== CARD ===== */
.card {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: center;
}

/* 🔧 AJUSTE REAL DAS IMAGENS (DESKTOP) */
.card img {
  width: 100%;
  height: 150px;          /* 👈 AGORA SIM menor */
  object-fit: cover;
}

.card h3 {
  font-size: 15px;
  padding: 12px;
  margin: 0;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .logo img {
    height: 50px;
  }

  .card img {
    height: 160px;
  }
}
</style>
</head>

<body>

<header>
  <div class="hamburger">☰</div>

  <div class="logo">
    <img src="img/logo.png" alt="MM Pré-Moldados">
  </div>

  <div class="search-box">
    <input type="text" placeholder="Buscar produtos">
  </div>

  <div class="cart">🛒</div>
</header>

<section>
  <h2>🔥 Produtos em Destaque</h2>
  <span class="ver-todos">Ver todos</span>

  <div class="grid">
    <div class="card">
      <img src="img/cobogo-anti-chuva-40.jpg">
      <h3>Cobogó Anti-Chuva 40x40</h3>
    </div>

    <div class="card">
      <img src="img/cobogo-16-furos-40.jpg">
      <h3>Cobogó 16 Furos 40x40</h3>
    </div>

    <div class="card">
      <img src="img/manilhas/manilha-90x50.jpg">
      <h3>Manilha 90cm x 50cm</h3>
    </div>
  </div>
</section>

<section>
  <h2>✨ Novidades</h2>
  <span class="ver-todos">Ver todas</span>

  <div class="grid">
    <div class="card">
      <img src="img/cobogo-flor-40.jpg">
      <h3>Cobogó Flor 40x40</h3>
    </div>

    <div class="card">
      <img src="img/cobogo-estrela-30.jpg">
      <h3>Cobogó Estrela 30x30</h3>
    </div>
  </div>
</section>

</body>
</html>
