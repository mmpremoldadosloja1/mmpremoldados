<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Pré-Moldados</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter', Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
}

/* ===== HEADER ===== */
header{
  background:#000;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
}

.logo img{
  height:85px;
}

.search-box{
  flex:1;
  display:flex;
  justify-content:center;
}

.search-box input{
  width:100%;
  max-width:500px;
  padding:12px 15px;
  border-radius:30px;
  border:2px solid #1f1f1f;
  font-size:14px;
  background:#111;
  color:#fff;
  outline:none;
  transition:0.3s;
}

.search-box input:focus{
  border-color:#2d6cdf;
  box-shadow:0 0 12px rgba(45,108,223,0.4);
}

.cart{
  font-size:22px;
  color:#fff;
}

/* ===== MENU HANDLE ===== */
.menu-handle{
  position:fixed;
  top:50%;
  left:0;
  transform:translateY(-50%);
  width:24px;
  height:70px;
  background:#1c1c1c;
  border-top-right-radius:30px;
  border-bottom-right-radius:30px;
  z-index:2100;
  box-shadow:4px 0 15px rgba(0,0,0,0.8);
}

/* ===== MENU ===== */
.side-menu{
  position:fixed;
  top:0;
  left:-280px;
  width:260px;
  height:100%;
  background:#111;
  box-shadow:5px 0 25px rgba(0,0,0,0.8);
  padding-top:100px;
  transition:0.4s ease;
  z-index:2000;
}

.side-menu a{
  display:block;
  padding:15px 20px;
  color:#fff;
  text-decoration:none;
  border-bottom:1px solid #1a1a1a;
}

.side-menu.active{
  left:0;
}

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  z-index:1500;
}

.overlay.active{
  display:block;
}

/* ===== HOME VAZIA / INSTITUCIONAL ===== */
.home{
  display:flex;
  align-items:center;
  justify-content:center;
  height:70vh;
  text-align:center;
  padding:20px;
}

.home-content h1{
  font-size:32px;
  margin-bottom:15px;
}

.home-content p{
  font-size:16px;
  color:#aaa;
  max-width:500px;
  margin:0 auto 25px auto;
}

.btn-orcamento{
  background:#fff;
  color:#000;
  padding:12px 25px;
  border-radius:30px;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
  display:inline-block;
}

.btn-orcamento:hover{
  background:#ddd;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="img/logo.png" alt="MM Pré-Moldados">
  </div>

  <div class="search-box">
    <input type="text" placeholder="Buscar produtos">
  </div>

  <div class="cart">🛒</div>
</header>

<div class="menu-handle" onclick="toggleMenu()"></div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="side-menu" id="sideMenu">
  <a href="blocos.html">Blocos/Canaletas</a>
  <a href="manilhas.html">Manilhas</a>
  <a href="lajes.html">Lajes Pré-Moldadas</a>
  <a href="cobogos.html">Cobogós</a>
  <a href="pingadeiras.html">Pingadeiras</a>
  <a href="caixas.html">Caixas</a>
  <a href="pisos.html">Pisos e pisadeiras</a>
  <a href="meio-fio.html">Meio-fio de Jardim</a>
  <a href="revestimento-parede.html">Revestimento de Parede</a>
</div>

<section class="home">
  <div class="home-content">
    <h1>MM Pré-Moldados</h1>
    <p>Soluções em pré-moldados com qualidade, resistência e acabamento profissional.</p>
    <a href="#" class="btn-orcamento">Solicitar Orçamento</a>
  </div>
</section>

<script>
function toggleMenu(){
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");
  menu.classList.toggle("active");
  overlay.classList.toggle("active");
}
</script>

<script src="produtos.js"></script>

</body>
</html>
