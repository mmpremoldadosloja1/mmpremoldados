<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MM PRÉ-MOLDADOS – Catálogo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #333;
    }

    header {
      background: #1f1f1f;
      color: #fff;
      padding: 25px 15px;
      text-align: center;
    }

    header img {
      max-width: 180px;
      margin-bottom: 10px;
    }

    section {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 20px;
      border-left: 6px solid #c9a24d;
      padding-left: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card.img-24 img {
      height: 160px;
    }

    .card h3 {
      font-size: 16px;
      margin: 12px 0 10px;
    }

    .whatsapp {
      display: inline-block;
      background: #25D366;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    footer {
      background: #1f1f1f;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <!-- LOGO -->
  <img src="img/logo.png" alt="MM Pré-Moldados">
  <h1>MM PRÉ-MOLDADOS</h1>
  <p>Catálogo de Produtos</p>
</header>

<section>
  <h2>Cobogós 40x40</h2>
  <div class="grid">
    <div class="card">
      <img src="img/cobogo-16-furos-40.jpg">
      <h3>Cobogó 16 Furos 40x40</h3>
      <a class="whatsapp" target="_blank"
         href="https://wa.me/5561999385680">Chamar no WhatsApp</a>
    </div>
  </div>
</section>

<footer>
  © MM PRÉ-MOLDADOS – Catálogo de Produtos
</footer>

</body>
</html>
