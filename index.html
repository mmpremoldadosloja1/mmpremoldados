<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>MM Premoldados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #111;
      color: #fff;
    }

    /* HEADER */
    header {
      padding: 15px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      border-bottom: 1px solid #222;
    }

    .logo img {
      width: 140px;
      max-width: 100%;
    }

    /* HERO */
    .hero {
      padding: 50px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #1e88e5;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1565c0;
    }

    /* RESPONSIVO TABLET E DESKTOP */
    @media(min-width: 768px){

      .hero {
        padding: 80px 20px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 16px;
      }

      .logo img {
        width: 180px;
      }
    }

  </style>
</head>
<body>

  <header>
    <div class="logo">
      <!-- SUBSTITUA PELO CAMINHO DA SUA LOGO -->
      <img src="logo.png" alt="MM Premoldados">
    </div>
  </header>

  <section class="hero">
    <h1>Estrutura, resistência e qualidade em cada peça</h1>
    <p>
      Produzimos artefatos de concreto com alto padrão de acabamento e durabilidade para sua obra.
    </p>
    <a href="#" class="btn">Conhecer a Empresa</a>
  </section>

</body>
</html>
