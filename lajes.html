<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lajes | MM Pré-Moldados</title>

<style>
body{
  background:#fff;
  font-family:'Montserrat', sans-serif;
  padding-top:90px;
  margin:0;
}

/* HEADER IGUAL COBOGÓ */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

nav{
  display:flex;
  gap:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
}

/* CARRINHO */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  padding:20px;
  transition:.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{
  right:0;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* TITULO */
h1{
  text-align:center;
  color:#e63946;
}

/* ===== LAYOUT LINHA ===== */
.linha{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:10px 20px;
  align-items:center;
  border-bottom:1px solid #eee;
}

.linha img{
  width:60px;
  height:60px;
  object-fit:contain;
}

/* CAMPOS */
select, input{
  padding:6px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* CONTADOR IGUAL COBOGO */
.contador{
  display:flex;
  align-items:center;
  gap:5px;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  border-radius:5px;
  cursor:pointer;
}

.contador input{
  width:50px;
  text-align:center;
}

/* BOTÃO */
.btn{
  background:#e63946;
  color:#fff;
  border:none;
  padding:8px 15px;
  border-radius:6px;
  cursor:pointer;
}

/* MOBILE = FOLHA */
@media(max-width:768px){
  .linha{
    flex-direction:column;
    align-items:stretch;
  }
}
</style>
</head>

<body>

<header>
<nav>
<a href="index.html" class="nav-item">🏠 Início</a>
</nav>

<nav>
<a href="#" class="nav-item" onclick="abrirCarrinho()">🛒 Carrinho</a>
</nav>
</header>

<div class="carrinho-lateral" id="carrinho">
<h3>Carrinho</h3>
<div id="lista"></div>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>LAJES</h1>

<!-- LAJES -->
<div class="linha">
<img src="img/laje.jpg">

<select id="tipoLaje" onchange="atualizarIsopor()">
<option disabled selected>Selecione a laje</option>
<option value="H8">Laje Teto H8</option>
<option value="H10">Laje Piso H10</option>
</select>

<select id="isopor">
<option disabled selected>Escolha o isopor</option>
</select>

<input type="number" id="comprimento" placeholder="Comprimento (m)">
<input type="number" id="largura" placeholder="Largura (m)">

<input type="text" id="m2" placeholder="m²" readonly>

<button class="btn" onclick="addLaje()">Adicionar</button>
</div>

<!-- VIGAS -->
<div class="linha">
<img src="img/viga.jpg">

<select id="tipoViga">
<option>H8 TETO</option>
<option>H10 PISO</option>
</select>

<input list="medidasViga" id="medidaViga" placeholder="Tamanho">

<datalist id="medidasViga"></datalist>

<div class="contador">
<button onclick="diminuir(this)">−</button>
<input type="number" class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>

<button class="btn" onclick="addViga(this)">Adicionar</button>
</div>

<!-- ISOPOR -->
<div class="linha">
<img src="img/isopor.jpg">

<select id="isoporUnit">
<option>H8 7,5x33</option>
<option>H8 7,5x40</option>
<option>H10 9x33</option>
<option>H10 9x40</option>
</select>

<div class="contador">
<button onclick="diminuir(this)">−</button>
<input type="number" class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>

<button class="btn" onclick="addIsopor(this)">Adicionar</button>
</div>

<script>

/* GERAR TAMANHO VIGA */
const lista = document.getElementById("medidasViga");
for(let i=0.8;i<=6;i+=0.1){
  let op = document.createElement("option");
  op.value = i.toFixed(1)+"m";
  lista.appendChild(op);
}

/* ISOPOR DINÂMICO */
function atualizarIsopor(){
  const tipo = document.getElementById("tipoLaje").value;
  const select = document.getElementById("isopor");

  select.innerHTML = "<option disabled selected>Escolha o isopor</option>";

  if(tipo === "H8"){
    select.innerHTML += "<option>7,5x33</option><option>7,5x40</option>";
  } else {
    select.innerHTML += "<option>9x33</option><option>9x40</option>";
  }
}

/* CALCULO M2 */
document.getElementById("comprimento").oninput =
document.getElementById("largura").oninput = function(){
  let c = document.getElementById("comprimento").value;
  let l = document.getElementById("largura").value;
  document.getElementById("m2").value = (c*l || 0).toFixed(2);
}

/* CONTADOR */
function aumentar(btn){
  let input = btn.parentElement.querySelector("input");
  input.value = parseInt(input.value)+1;
}

function diminuir(btn){
  let input = btn.parentElement.querySelector("input");
  input.value = Math.max(1, input.value-1);
}

/* CARRINHO */
let carrinho = [];

function addLaje(){
  let tipo = tipoLaje.value;
  let iso = isopor.value;
  let m2 = document.getElementById("m2").value;

  carrinho.push({nome:`${tipo} ${iso} (${m2}m²)`});
  render();
}

function addViga(btn){
  let tipo = tipoViga.value;
  let tam = medidaViga.value;
  let qtd = btn.parentElement.querySelector("input").value;

  carrinho.push({nome:`Viga ${tipo} ${tam} x${qtd}`});
  render();
}

function addIsopor(btn){
  let tipo = isoporUnit.value;
  let qtd = btn.parentElement.querySelector("input").value;

  carrinho.push({nome:`Isopor ${tipo} x${qtd}`});
  render();
}

function abrirCarrinho(){
  carrinhoBox.classList.add("active");
  overlay.classList.add("active");
}

function fecharCarrinho(){
  carrinhoBox.classList.remove("active");
  overlay.classList.remove("active");
}

const carrinhoBox = document.getElementById("carrinho");
const overlay = document.getElementById("overlay");

function render(){
  let lista = document.getElementById("lista");
  lista.innerHTML = carrinho.map(i=>`<div>${i.nome}</div>`).join("");
}

</script>

</body>
</html>
