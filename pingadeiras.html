<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pingadeiras | MM Pré-Moldados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin: 30px 0 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 20px 60px 60px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 25px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    /* ESPAÇO PARA IMAGEM */
    .imagem-centro {
      width: 100%;
      height: 180px;
      margin-bottom: 20px;
      background: #f2f2f2;
      border-radius: 8px;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 14px;
    }

    select {
      padding: 8px 10px;
      margin-bottom: 15px;
      width: 70%;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .contador {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .contador button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #e0e0e0;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .contador button:hover {
      background: #d5d5d5;
    }

    .contador button:active {
      transform: scale(0.9);
    }

    .qtd {
      font-size: 18px;
      font-weight: bold;
      min-width: 25px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      padding: 10px 22px;
      background: #111;
      color: #fff;
      border-radius: 6px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #333;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* BOTÃO VOLTAR */
    .voltar {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      background: #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .voltar:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    .voltar:active {
      transform: scale(0.92);
    }

    .voltar svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
    }
  </style>
</head>

<body>

<a href="index.html" class="voltar" aria-label="Voltar">
  <svg viewBox="0 0 24 24">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</a>

<h1>Pingadeiras</h1>

<div class="grid">

  <!-- MODELO CASINHA -->
  <div class="card">
    <div class="imagem-centro">Imagem será adicionada aqui</div>
    <h3>Estilo Casinha</h3>

    <select>
      <option>1m x 20cm</option>
      <option>1m x 23cm</option>
      <option>1m x 25cm</option>
      <option>1m x 30cm</option>
    </select>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <span class="qtd">1</span>
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar ao carrinho</button>
  </div>

  <!-- MODELO RETA -->
  <div class="card">
    <div class="imagem-centro">Imagem será adicionada aqui</div>
    <h3>Estilo Reta</h3>

    <select>
      <option>1m x 20cm</option>
      <option>1m x 23cm</option>
      <option>1m x 25cm</option>
      <option>1m x 30cm</option>
      <option>1m x 40cm</option>
    </select>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <span class="qtd">1</span>
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar ao carrinho</button>
  </div>

  <!-- MODELO DEGRAU -->
  <div class="card">
    <div class="imagem-centro">Imagem será adicionada aqui</div>
    <h3>Estilo Degraus</h3>

    <select>
      <option>1m x 20cm</option>
    </select>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <span class="qtd">1</span>
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar ao carrinho</button>
  </div>

</div>

<script>
function alterarQtd(botao, valor) {
  const contador = botao.parentElement;
  const qtdSpan = contador.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao) {
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);
  const medida = card.querySelector('select').value;

  const nomeCompleto = nome + " - " + medida;
  const existente = carrinho.find(item => item.nome === nomeCompleto);

  if (existente) {
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome: nomeCompleto, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert('Produto adicionado ao carrinho');
}
</script>

</body>
</html>
