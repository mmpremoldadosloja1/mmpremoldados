<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

/* CARRINHO LATERAL */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{
  right:0;
}

.carrinho-header{
  font-weight:bold;
  margin-bottom:15px;
}

.lista-carrinho{
  flex:1;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

/* OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav class="nav-right">
    <div class="nav-item" onclick="abrirCarrinho()">🛒 Carrinho</div>
  </nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinhoLateral">
  <div class="carrinho-header">Seu Carrinho</div>
  <div class="lista-carrinho" id="listaCarrinho"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar no WhatsApp</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>COBOGÓS</h1>

<!-- SEUS PRODUTOS CONTINUAM IGUAIS -->

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function abrirCarrinho(){
  document.getElementById("carrinhoLateral").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  renderizar();
}

function fecharCarrinho(){
  document.getElementById("carrinhoLateral").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

function renderizar(){
  const lista = document.getElementById("listaCarrinho");
  lista.innerHTML = "";

  if(carrinho.length === 0){
    lista.innerHTML = "Carrinho vazio";
    return;
  }

  carrinho.forEach((item, index)=>{
    lista.innerHTML += `
      <div class="item">
        ${item.nome} (x${item.qtd})
        <button class="remover" onclick="remover(${index})">X</button>
      </div>
    `;
  });
}

function remover(index){
  carrinho.splice(index,1);
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  renderizar();
}

function enviarWhatsApp(){
  if(carrinho.length === 0){
    alert("Carrinho vazio");
    return;
  }

  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`, "_blank");
}

function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value++;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, input.value - 1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Adicionado ao carrinho");
}

</script>

</body>
</html>
