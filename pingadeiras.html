<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pingadeiras | MM Pré-Moldados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin: 25px 0 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }

    select {
      padding: 8px;
      margin-bottom: 10px;
    }

    .contador {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .contador button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: #ddd;
      font-size: 18px;
      cursor: pointer;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      background: #111;
      color: #fff;
      border-radius: 5px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    /* BOTÃO VOLTAR IGUAL AO COBOGOS */
    .voltar {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 46px;
      height: 46px;
      background: #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .voltar svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
    }
  </style>
</head>

<body>

<a href="index.html" class="voltar" aria-label="Voltar">
  <svg viewBox="0 0 24 24">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</a>

<h1>Pingadeiras</h1>

<div class="grid">

  <div class="card">
    <h3>Modelo Casinha</h3>
    <select>
      <option>1m x 20cm</option>
      <option>1m x 23cm</option>
      <option>1m x 25cm</option>
      <option>1m x 30cm</option>
    </select>

    <div class="contador">
      <button>-</button>
      <span class="qtd">1</span>
      <button>+</button>
    </div>

    <button class="btn">Adicionar ao carrinho</button>
  </div>

  <div class="card">
    <h3>Modelo Reta</h3>
    <select>
      <option>1m x 20cm</option>
      <option>1m x 23cm</option>
      <option>1m x 25cm</option>
      <option>1m x 30cm</option>
      <option>1m x 40cm</option>
    </select>

    <div class="contador">
      <button>-</button>
      <span class="qtd">1</span>
      <button>+</button>
    </div>

    <button class="btn">Adicionar ao carrinho</button>
  </div>

  <div class="card">
    <h3>Modelo Degrau</h3>
    <select>
      <option>1m x 20cm</option>
    </select>

    <div class="contador">
      <button>-</button>
      <span class="qtd">1</span>
      <button>+</button>
    </div>

    <button class="btn">Adicionar ao carrinho</button>
  </div>

</div>

</body>
</html>
