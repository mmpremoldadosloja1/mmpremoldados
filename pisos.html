<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pisos e Pisadeiras | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* BASE */
body{
  background:#fff;
  font-family:'Montserrat', sans-serif;
  padding-top:90px;
}

/* HEADER IGUAL COBOGÓS */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TITULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  color:#e63946;
  margin-bottom:30px;
}

/* SUBTITULO */
h2{
  text-align:left;
  margin:40px 0 15px;
  font-size:22px;
  padding-left:20px;
}

/* GRID IGUAL COBOGÓS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;

  max-width:1100px;
  margin:0 auto;
}

/* CARD IGUAL COBOGÓS */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* IMAGEM */
.imagem-container{
  width:100%;
  height:130px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.imagem-container img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

/* TITULO CARD */
.card h3{
  font-size:14px;
  margin:10px 0;
  min-height:40px;
}

/* SELECT */
select{
  width:100%;
  padding:7px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
  font-family:'Montserrat', sans-serif;
}

/* CONTADOR IGUAL COBOGÓS (DIGITÁVEL) */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin:10px 0;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

/* BOTÃO IGUAL COBOGÓS */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

</style>
</head>

<body>

<header>
  <nav>
    <a href="index.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<h1>PISOS E PISADEIRAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* TITULOS */
function titulo(texto){
  grid.innerHTML += `
    <div style="grid-column:1/-1">
      <h2>${texto}</h2>
    </div>
  `;
}

/* CONTADOR IGUAL COBOGÓS */
function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = parseInt(input.value) + 1;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, parseInt(input.value) - 1);
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const qtd = parseInt(card.querySelector('.qtd').value);

  const nomeFinal = variacao ? nome + " - " + variacao : nome;

  const existente = carrinho.find(item => item.nome === nomeFinal);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome: nomeFinal, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado!");
}

/* PRODUTO */
function criarProduto(nome, img, opcoes=null){
  grid.innerHTML += `
  <div class="card">

    <div class="imagem-container">
      <img src="${img}">
    </div>

    <h3>${nome}</h3>

    ${opcoes ? `
      <select>
        ${opcoes.map(o=>`<option>${o}</option>`).join('')}
      </select>
    ` : ''}

    <div class="contador">
      <button onclick="diminuir(this)">−</button>
      <input type="number" class="qtd" value="1" min="1">
      <button onclick="aumentar(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>

  </div>`;
}

/* PRODUTOS */
titulo("Pisos");

criarProduto("Piso Quadrado Liso","img/pisos/piso-quadrado.jpg",["40x40cm","50x50cm","60x60cm"]);
criarProduto("Piso Copacabana 50x50cm","img/pisos/copacabana.jpg");
criarProduto("Piso Trabalhado em Flor 45x45cm","img/pisos/flor.jpg");
criarProduto("Piso em X 45x45cm","img/pisos/piso.jpg");

titulo("Pisadeiras");

criarProduto("Pezão de Jardim 50cm","img/pisos/pezao.jpg");
criarProduto("Círculo Estelar 50cm","img/pisos/circulo-estelar.jpg");
criarProduto("Pisadeira Xis 50cm","img/pisos/pisadeira-x.jpg");

titulo("Conjuntos");

criarProduto("Conjunto Trevo Oriente 60x60cm","img/pisos/trevo-oriente.jpg");
criarProduto("Conjunto Passarela Estrelado 70x70cm","img/pisos/passarela.jpg");
criarProduto("Conjunto Circulo Quadrado 140x140cm","img/pisos/conjunto-circulo-quadrado.jpg");

</script>

</body>
</html>
