<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEIO-FIO | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* FUNDO */
body{
  background: linear-gradient(to bottom, #ddd, #ccc);
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
  margin:0;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:transparent;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

/* TITULO */
h1{
  text-align:center;
  font-size:36px;
  margin-bottom:30px;
  color:#e63946;
}

/* GRID */
.grid{
  display:grid;
  gap:25px;
  padding:0 20px 60px;
}

@media(min-width:900px){
  .grid{
    grid-template-columns:repeat(3,280px);
    justify-content:center;
  }
}

@media(max-width:768px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

/* IMAGEM (PADRÃO IGUAL PINGADEIRAS) */
.imagem-box{
  width:100%;
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border-radius:8px;
  margin-bottom:10px;
}

.imagem-box img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

/* TITULO */
.card h3{
  font-size:14px;
  margin:10px 0;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

.contador button{
  padding:5px 10px;
  margin:0 5px;
  font-size:16px;
  border:none;
  border-radius:5px;
  background:#eee;
  cursor:pointer;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <nav>
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav>
    <a href="#" class="nav-item">Carrinho</a>
  </nav>
</header>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* CONTADOR */
function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText) + 1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText) - 1);
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado");
}

/* PRODUTOS COM IMAGENS CORRETAS */
const produtos = [
  {
    nome: "Meio-Fio Arredondado 80x25x8cm",
    img: "img/meiofio/arredondado.jpg"
  },
  {
    nome: "Meio-Fio Cordão 80x25x4cm",
    img: "img/meiofio/cordao.jpg"
  },
  {
    nome: "Guia de Jardim Ondulado 80x20x4cm",
    img: "img/meiofio/ondulado.jpg"
  }
];

/* CRIAR CARDS */
function criar(produto){
  grid.innerHTML += `
  <div class="card">

    <div class="imagem-box">
      <img src="${produto.img}" alt="${produto.nome}">
    </div>

    <h3>${produto.nome}</h3>

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>

  </div>`;
}

produtos.forEach(criar);

</script>

</body>
</html>
