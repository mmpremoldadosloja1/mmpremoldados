<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Pré-Moldados</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter', Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
  overflow-x:hidden;
}

/* ===== HEADER ===== */
header{
  background:#000;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
}

.logo img{
  height:85px;
}

.search-box{
  flex:1;
  display:flex;
  justify-content:center;
}

.search-box input{
  width:100%;
  max-width:500px;
  padding:12px 15px;
  border-radius:30px;
  border:2px solid #1f1f1f;
  font-size:14px;
  background:#111;
  color:#fff;
  outline:none;
}

.cart{
  font-size:22px;
}

/* ===== HOME ===== */
.home{
  display:flex;
  align-items:center;
  justify-content:center;
  height:70vh;
  text-align:center;
  padding:20px;
}

.home-content h1{
  font-size:36px;
  margin-bottom:15px;
}

.home-content p{
  font-size:16px;
  color:#aaa;
  max-width:500px;
  margin:0 auto 25px auto;
}

.btn-orcamento{
  background:#fff;
  color:#000;
  padding:14px 28px;
  border-radius:30px;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
  display:inline-block;
  cursor:pointer;
}

.btn-orcamento:hover{
  background:#ddd;
}

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  opacity:0;
  visibility:hidden;
  transition:0.4s;
  z-index:1500;
}

.overlay.active{
  opacity:1;
  visibility:visible;
}

/* ===== PAINEL CATEGORIAS ===== */
.categoria-panel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  box-shadow:-5px 0 30px rgba(0,0,0,0.8);
  padding-top:120px;
  transition:0.4s ease;
  z-index:2000;
}

.categoria-panel.active{
  right:0;
}

.categoria-panel a{
  display:block;
  padding:18px 25px;
  color:#fff;
  text-decoration:none;
  border-bottom:1px solid #1a1a1a;
  transition:0.3s;
}

.categoria-panel a:hover{
  background:#1c1c1c;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="img/logo.png" alt="MM Pré-Moldados">
  </div>

  <div class="search-box">
    <input type="text" placeholder="Buscar produtos">
  </div>

  <div class="cart">🛒</div>
</header>

<section class="home">
  <div class="home-content">
    <h1>MM Pré-Moldados</h1>
    <p>Soluções em pré-moldados com qualidade, resistência e acabamento profissional.</p>
    <div class="btn-orcamento" onclick="abrirCategorias()">Solicitar Orçamento</div>
  </div>
</section>

<div class="overlay" id="overlay" onclick="fecharCategorias()"></div>

<div class="categoria-panel" id="categoriaPanel">
  <a href="blocos.html">Blocos / Canaletas</a>
  <a href="manilhas.html">Manilhas</a>
  <a href="lajes.html">Lajes Pré-Moldadas</a>
  <a href="cobogos.html">Cobogós</a>
  <a href="pingadeiras.html">Pingadeiras</a>
  <a href="caixas.html">Caixas</a>
  <a href="pisos.html">Pisos e Pisadeiras</a>
  <a href="meio-fio.html">Meio-Fio de Jardim</a>
  <a href="revestimento-parede.html">Revestimento de Parede</a>
</div>

<script>
function abrirCategorias(){
  document.getElementById("categoriaPanel").classList.add("active");
  document.getElementById("overlay").classList.add("active");
}

function fecharCategorias(){
  document.getElementById("categoriaPanel").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}
</script>

</body>
</html>
