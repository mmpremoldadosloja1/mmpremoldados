```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MANILHAS E TAMPAS | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>

/* BASE */
body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family:'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

/* CARRINHO */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{
  right:0;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* TITULOS */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  margin:30px 20px 10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px;
  max-width:1100px;
  margin:auto;
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
}

.imagem-placeholder{
  height:110px;
  background:#f5f5f5;
  border-radius:8px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
}

select{
  margin:10px 0;
}

.contador{
  display:flex;
  justify-content:center;
  gap:5px;
}

.btn{
  margin-top:10px;
  padding:10px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item" onclick="abrirCarrinho()">Carrinho</a>
  </nav>
</header>

<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div id="lista"></div>
  <button onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>MANILHAS E TAMPAS</h1>

<h2>Manilhas</h2>
<div class="grid" id="manilhas"></div>

<h2>Tampas de Manilha</h2>
<div class="grid" id="tampas"></div>

<script>

const manilhas = document.getElementById("manilhas");
const tampas = document.getElementById("tampas");

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* PRODUTO */
function criarProduto(nome, opcoes, container){
  const div = document.createElement("div");
  div.classList.add("card");

  div.innerHTML = `
    <div class="imagem-placeholder">Imagem</div>
    <h3>${nome}</h3>

    ${opcoes ? `
      <select>
        ${opcoes.map(op => `<option>${op}</option>`).join('')}
      </select>
    ` : ''}

    <div class="contador">
      <button onclick="diminuir(this)">−</button>
      <input type="number" class="qtd" value="1">
      <button onclick="aumentar(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
  `;

  container.appendChild(div);
}

/* CONTADOR */
function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value++;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, input.value - 1);
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const qtd = parseInt(card.querySelector('.qtd').value);

  const nomeFinal = variacao ? nome + " - " + variacao : nome;

  const existente = carrinho.find(item => item.nome === nomeFinal);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome: nomeFinal, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Adicionado!");
}

/* CARRINHO UI */
function abrirCarrinho(){
  carrinhoEl = document.getElementById("carrinho");
  carrinhoEl.classList.add("active");
  overlay.classList.add("active");
  renderizar();
}

function fecharCarrinho(){
  carrinho.classList.remove("active");
  overlay.classList.remove("active");
}

function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  carrinho.forEach(item=>{
    lista.innerHTML += `<div>${item.nome} x${item.qtd}</div>`;
  });
}

function enviarWhatsApp(){
  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });
  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

/* PRODUTOS */
["Manilha 90cm x 50cm","Manilha 1,10m x 50cm"]
.forEach(n => criarProduto(n, null, manilhas));

criarProduto("Tampa 90cm", ["Aberta","Fechada"], tampas);
criarProduto("Tampa 1m", ["Aberta","Fechada"], tampas);
criarProduto("Tampa 1,10cm", ["Aberta","Fechada"], tampas);
criarProduto("Tampa 1,20cm", ["Aberta","Fechada"], tampas);

</script>

</body>
</html>
