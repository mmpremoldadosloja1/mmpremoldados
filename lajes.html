<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lajes Pré-Moldadas | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
body {
  background: #ddd;
  font-family: 'Montserrat', sans-serif;
  padding-top: 80px;
  margin:0;
}
h1{
  text-align:center;
  color:#e63946;
  text-shadow:1px 1px 3px rgba(0,0,0,0.3);
  margin-bottom:20px;
}
h2{
  margin-top:25px;
  padding-left:15px;
  font-size:20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
  gap:15px;
  padding:0 15px 50px 15px;
}
.card{
  background:transparent;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  min-height:280px;
}
.card h3{
  margin:5px 0;
}
select, input{
  width:100%;
  padding:8px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #ccc;
}
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px 0;
}
.contador button{
  padding:3px 8px;
  margin:0 5px;
  font-size:16px;
  cursor:pointer;
}
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{
  background:#c92f3b;
  transform:scale(1.03);
}
</style>
</head>
<body>

<h1>Lajes Pré-Moldadas</h1>

<div class="grid" id="gridProdutos"></div>

<script>
const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function titulo(texto){
  grid.innerHTML += `<div style="grid-column:1/-1"><h2>${texto}</h2></div>`;
}

function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText)+1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText)-1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const input = card.querySelector('input');
  const qtd = input ? input.value : parseInt(card.querySelector('.qtd').innerText);

  if(select && !variacao) return alert("Escolha uma opção!");
  if(input && (!qtd || qtd<=0)) return alert("Informe a metragem!");

  const nomeFinal = variacao ? `${nome} - ${variacao} - ${qtd}m²` : `${nome} - ${qtd}m²`;

  const existente = carrinho.find(item=>item.nome===nomeFinal);
  if(existente) existente.qtd+=1;
  else carrinho.push({nome:nomeFinal,qtd:1});

  localStorage.setItem('carrinho',JSON.stringify(carrinho));
  alert("Produto adicionado ao carrinho!");
}

function criarProduto(nome, opcoes=null, metragem=false){
  grid.innerHTML += `
  <div class="card">
    <h3>${nome}</h3>
    ${opcoes? `<select>
      <option value="">Escolher...</option>
      ${opcoes.map(op=>`<option>${op}</option>`).join('')}
    </select>`: ''}
    ${metragem? `<input type="number" min="1" placeholder="Metragem (m²)">`: ''}
    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>
    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
  </div>`;
}

/* ===== LAJES TETO H8 ===== */
titulo("Lajes Teto H8");
criarProduto("Laje Teto H8", ["7,5cm x 33cm","7,5cm x 40cm"], true);

/* ===== LAJES PISO H10 ===== */
titulo("Lajes Piso H10");
criarProduto("Laje Piso H10", ["9cm x 33cm","9cm x 40cm"], true);

/* ===== VIGAS ===== */
titulo("Vigas por Unidade");
criarProduto("Viga H8", null, true);
criarProduto("Viga H10", null, true);
</script>

</body>
</html>
