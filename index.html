<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Pré-Moldados</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top, #111827, #0b0f1a 60%);
  color:#fff;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(10px);
  padding:18px 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(10,132,255,0.3);
}

.logo img{
  height:55px;
}

.search-box{
  flex:1;
  margin:0 40px;
}

.search-box input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #1f2937;
  background:#111827;
  color:#fff;
  font-size:14px;
  transition:0.3s;
}

.search-box input:focus{
  outline:none;
  border:1px solid #0a84ff;
  box-shadow:0 0 15px rgba(10,132,255,0.5);
}

.cart{
  font-size:24px;
  cursor:pointer;
  transition:0.3s;
}

.cart:hover{
  color:#0a84ff;
}

/* BANNER */
.banner{
  padding:100px 60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}

.banner-text{
  max-width:550px;
  animation:fadeIn 1s ease forwards;
}

.banner-text h1{
  font-size:44px;
  font-weight:800;
  margin-bottom:20px;
  background:linear-gradient(90deg,#0a84ff,#4cc9ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.banner-text p{
  font-size:18px;
  color:#cbd5e1;
  margin-bottom:30px;
}

.banner button{
  background:linear-gradient(90deg,#0a84ff,#0070f3);
  border:none;
  padding:16px 30px;
  border-radius:12px;
  font-weight:700;
  font-size:15px;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 20px rgba(10,132,255,0.5);
}

.banner button:hover{
  transform:translateY(-3px);
  box-shadow:0 0 30px rgba(10,132,255,0.8);
}

.banner img{
  max-width:450px;
  width:100%;
  animation:float 4s ease-in-out infinite;
}

/* SECTION */
section{
  padding:70px 60px;
}

h2{
  font-size:26px;
  margin-bottom:40px;
  position:relative;
}

h2::after{
  content:"";
  width:60px;
  height:3px;
  background:#0a84ff;
  position:absolute;
  left:0;
  bottom:-10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:30px;
}

/* CARD */
.card{
  background:#111827;
  border-radius:18px;
  padding:25px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.05);
  transition:0.4s;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-8px);
  border:1px solid #0a84ff;
  box-shadow:0 0 25px rgba(10,132,255,0.6);
}

.card img{
  width:100%;
  height:170px;
  object-fit:contain;
}

.card h3{
  margin-top:20px;
  font-size:16px;
  font-weight:600;
}

/* PRODUTOS */
.produto-card{
  background:#111827;
  border-radius:18px;
  padding:25px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.05);
  transition:0.4s;
}

.produto-card:hover{
  transform:translateY(-8px);
  border:1px solid #0a84ff;
  box-shadow:0 0 25px rgba(10,132,255,0.6);
}

.produto-card img{
  width:100%;
  height:180px;
  object-fit:contain;
}

/* ANIMAÇÕES */
@keyframes float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-15px); }
}

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(30px); }
  to{ opacity:1; transform:translateY(0); }
}

/* RESPONSIVO */
@media(max-width:768px){
  .banner{
    flex-direction:column;
    text-align:center;
    padding:60px 20px;
  }

  section{
    padding:50px 20px;
  }

  .search-box{
    display:none;
  }
}

</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="img/logo.png">
  </div>

  <div class="search-box">
    <input type="text" placeholder="Buscar produtos...">
  </div>

  <div class="cart">🛒</div>
</header>

<div class="banner">
  <div class="banner-text">
    <h1>Construindo com Força e Qualidade</h1>
    <p>Blocos, Lajes, Manilhas e muito mais com resistência garantida para sua obra.</p>
    <button onclick="window.location.href='produtos.html?categoria=blocos'">
      Ver Produtos
    </button>
  </div>
  <img src="img/banner.png">
</div>

<section>
  <h2>Categorias</h2>
  <div class="grid">

    <div class="card" onclick="location.href='produtos.html?categoria=blocos'">
      <img src="img/categorias/blocos.jpg">
      <h3>Blocos</h3>
    </div>

    <div class="card" onclick="location.href='produtos.html?categoria=manilhas'">
      <img src="img/categorias/manilhas.jpg">
      <h3>Manilhas</h3>
    </div>

    <div class="card" onclick="location.href='produtos.html?categoria=lajes'">
      <img src="img/categorias/lajes.jpg">
      <h3>Lajes</h3>
    </div>

    <div class="card" onclick="location.href='produtos.html?categoria=pingadeiras'">
      <img src="img/categorias/pingadeiras.jpg">
      <h3>Pingadeiras</h3>
    </div>

  </div>
</section>

<section>
  <h2>Produtos</h2>
  <div class="grid" id="produtosHome"></div>
</section>

<script src="js/produtos.js"></script>

<script>
const homeContainer = document.getElementById("produtosHome");

Object.keys(PRODUTOS).forEach(categoria => {
  PRODUTOS[categoria].forEach(produto => {
    if(produto.imagem){
      const card = document.createElement("div");
      card.className = "produto-card";

      card.innerHTML = `
        <img src="${produto.imagem}">
        <h3>${produto.nome}</h3>
      `;

      homeContainer.appendChild(card);
    }
  });
});
</script>

</body>
</html>
