<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lajes Pré-Moldadas | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>

/* BASE */
body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family:'Montserrat', sans-serif;
}

/* HEADER PADRÃO */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
  transition:.3s;
}

header.hide{
  opacity:0;
  pointer-events:none;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

/* CARRINHO */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  padding:20px;
  transition:.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.carrinho-lateral.active{
  right:0;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* TITULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

/* GRID PADRÃO */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
  gap:20px;
  padding:0 20px 40px;
  max-width:1100px;
  margin:0 auto;
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* TITULO CARD */
.card h3{
  font-size:14px;
  margin:10px 0;
  min-height:40px;
}

/* SELECT */
select{
  width:100%;
  padding:7px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin:10px 0;
}

.contador button{
  padding:5px 10px;
  border:none;
  border-radius:5px;
  background:#eee;
  cursor:pointer;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  background:#c92f3b;
}

</style>
</head>

<body>

<header id="header">
  <nav>
    <a href="index.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav>
    <a href="#" class="nav-item" onclick="abrirCarrinho(); return false;">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<!-- CARRINHO -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div id="lista"></div>
  <button class="btn" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>LAJES PRÉ-MOLDADAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* CONTADOR */
function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = parseInt(input.value) + 1;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, parseInt(input.value) - 1);
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const qtd = parseInt(card.querySelector('.qtd').value);

  const nomeFinal = variacao ? nome + " - " + variacao : nome;

  const existente = carrinho.find(item => item.nome === nomeFinal);

  if(existente){
    existente.qtd += qtd;
  } else {
    carrinho.push({ nome: nomeFinal, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado!");
}

function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  document.getElementById("header").classList.add("hide");
  renderizar();
}

function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
  document.getElementById("header").classList.remove("hide");
}

function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if(carrinho.length === 0){
    lista.innerHTML = "Carrinho vazio";
    return;
  }

  carrinho.forEach((item, i)=>{
    lista.innerHTML += `
      <div>
        ${item.nome} (x${item.qtd})
        <button onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

function remover(i){
  carrinho.splice(i,1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  renderizar();
}

function enviarWhatsApp(){
  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

/* PRODUTOS */
function criarProduto(nome, opcoes=null){
  grid.innerHTML += `
  <div class="card">

    <h3>${nome}</h3>

    ${opcoes ? `
      <select>
        ${opcoes.map(op => `<option>${op}</option>`).join('')}
      </select>
    ` : ''}

    <div class="contador">
      <button onclick="diminuir(this)">−</button>
      <input type="number" class="qtd" value="1" min="1">
      <button onclick="aumentar(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>

  </div>`;
}

/* PRODUTOS */
criarProduto("Laje Teto H8", ["7,5cm x 33cm","7,5cm x 40cm"]);
criarProduto("Laje Piso H10", ["9cm x 33cm","9cm x 40cm"]);
criarProduto("Viga por Unidade", ["H8","H10"]);

</script>

</body>
</html>
