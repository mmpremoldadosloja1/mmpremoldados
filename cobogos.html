<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCOS | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/carrinho.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* TITULOS */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px 20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-bottom:8px;
}

.contador button{
  padding:5px 10px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

.contador input{
  width:50px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:5px;
  padding:5px;
}

.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

/* botão mobile */
.btn-carrinho{
  display:flex;
}

/* DESKTOP */
@media(min-width:900px){

  .btn-carrinho{
    display:none !important;
  }

}

</style>
</head>

<script>

// CONTADOR
function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = parseInt(input.value) + 1;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, parseInt(input.value) - 1);
}

// ADICIONAR PRODUTO (PADRÃO NOVO)
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  salvarCarrinho(); // 🔥 usa o carrinho.js
}

</script>
  
</body>
</html>
<script src="js/carrinho.js"></script>
