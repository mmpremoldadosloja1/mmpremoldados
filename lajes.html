<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lajes Pré-Moldadas</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:110px;
  font-family: 'Montserrat', sans-serif;
}

body.sem-header{
  padding-top:0 !important;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
  transition:0.3s;
}

header.sumir{
  display:none;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{
  width:24px;
  height:24px;
  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;
  transform:scale(1.05);
}

/* ===== CARRINHO PADRÃO ===== */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.25); /* 🔥 sombra melhor */
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;

  border-top-left-radius:50px;   /* 🔥 acabamento */
  border-bottom-left-radius:50px;
}

.carrinho-lateral.active{
  right:0;
}

.lista-carrinho{
  flex:1;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
}
/* OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* ===== IMAGENS ===== */
.imagem{
  width:100%;
  height:150px;
  background:#eee;
  border-radius:10px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.imagem img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== ORIGINAL ===== */

.bloco{
  background:#fff;
  margin:20px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

select, input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

select:invalid{
  color:#999;
}

.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-top:10px;
}

.contador button{
  padding:5px 10px;
  border:none;
  background:#eee;
  cursor:pointer;
}

.contador input{
  width:30px;
  text-align:center;
}

.btn{
  margin-top:15px;
  width:70%;
  padding:12px;
  background:#e63946;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
/* botão aparece só no mobile */
.btn-carrinho{
  display:flex;
}
  
/* DESKTOP */
@media(min-width:900px){
.btn-carrinho{
  display:none !important;
}
  .bloco{
    display:flex;
    gap:20px;
    align-items:center;
  }

  .imagem{
    width:200px;
    height:140px;
  }

  .conteudo{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    width:100%;
  }

  .conteudo select,
  .conteudo input{
    width:auto;
    min-width:140px;
  }

  .carrinho-lateral{
    right:0 !important;
  }

  .overlay{
    display:none !important;
  }

  body{
    padding-right:320px;
  }

  header{
    width:calc(100% - 320px);
  }

}

</style>
</head>

<body>

<header id="header">
  <nav class="nav-left">
    <a href="index.html" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 10L12 3l9 7"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Início
    </a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item btn-carrinho" onclick="abrirCarrinho(); return false;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
        <path d="M1 1h4l2.5 12h11.5l2-8H6"></path>
      </svg>
      Carrinho
    </a>
  </nav>
</header>

<!-- CARRINHO (🔥 removido active daqui) -->
<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1 style="text-align:center;color:#e63946;">LAJES</h1>

<!-- LAJE -->
<div class="bloco">
<div class="imagem">
<img src="img/lajes/laje.jpg">
</div>

<div class="conteudo">
<select id="tipoLaje" required onchange="atualizarIsopor()">
<option value="" disabled selected>Selecione a laje</option>
<option value="H8">Laje de Teto H8</option>
<option value="H10">Laje de Piso H10</option>
</select>

<select id="isopor" required>
<option value="" disabled selected>Selecione o isopor</option>
</select>

<input type="number" id="c" placeholder="Comprimento">
<input type="number" id="l" placeholder="Largura">

<div id="m2">0 m²</div>

<button class="btn" onclick="addLaje()">Adicionar</button>
</div>
</div>

<!-- VIGA -->
<div class="bloco">
<div class="imagem">
<img src="img/lajes/viga.jpg">
</div>

<div class="conteudo">
<select id="tipoViga">
<option>H8 TETO</option>
<option>H10 PISO</option>
</select>

<input list="listaVigas" id="tamViga" placeholder="Tamanho">
<datalist id="listaVigas"></datalist>

<div class="contador">
<button onclick="dim('qv')">-</button>
<input id="qv" value="1">
<button onclick="mais('qv')">+</button>
</div>

<button class="btn" onclick="addViga()">Adicionar</button>
</div>
</div>

<!-- ISOPOR -->
<div class="bloco">
<div class="imagem">
<img src="img/lajes/isopor.jpg">
</div>

<div class="conteudo">
<select id="tipoIso">
<option>H8 - 7,5x33</option>
<option>H8 - 7,5x40</option>
<option>H10 - 9x33</option>
<option>H10 - 9x40</option>
</select>

<div class="contador">
<button onclick="dim('qi')">-</button>
<input id="qi" value="1">
<button onclick="mais('qi')">+</button>
</div>

<button class="btn" onclick="addIso()">Adicionar</button>
</div>
</div>

<script>

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* ISOPOR */
function atualizarIsopor(){
  const tipo = document.getElementById("tipoLaje").value;
  const select = document.getElementById("isopor");

  select.innerHTML = `<option disabled selected>Selecione o isopor</option>`;

  if(tipo === "H8"){
    select.innerHTML += `<option>7,5x33</option>`;
    select.innerHTML += `<option>7,5x40</option>`;
  }

  if(tipo === "H10"){
    select.innerHTML += `<option>9x33</option>`;
    select.innerHTML += `<option>9x40</option>`;
  }
}

/* CONTADOR */
function mais(id){
  let el = document.getElementById(id);
  el.value = parseInt(el.value||1)+1;
}

function dim(id){
  let el = document.getElementById(id);
  el.value = Math.max(1, parseInt(el.value||1)-1);
}

/* LISTA VIGAS */
for(let i=0.8;i<=6;i+=0.1){
  listaVigas.innerHTML += `<option value="${i.toFixed(1)}m">`;
}

/* ADD (🔥 corrigido) */
function addLaje(){
  carrinho.push({nome:"Laje", qtd:1});
  salvar();
}

function addViga(){
  carrinho.push({nome:"Viga", qtd:1});
  salvar();
}

function addIso(){
  carrinho.push({nome:"Isopor", qtd:1});
  salvar();
}

/* SALVAR (🔥 agora sempre renderiza) */
function salvar(){
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  render();
}

/* ABRIR */
function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  render(); // 🔥 importante
}

/* FECHAR */
function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

/* RENDER */
function render(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if(carrinho.length === 0){
  
    return;
  }

  carrinho.forEach((item, i)=>{
    lista.innerHTML += `
      <div class="item">
        ${item.nome} (x${item.qtd})
        <button class="remover" onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

/* REMOVER */
function remover(i){
  carrinho.splice(i,1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  render();
}

/* WHATS */
function enviarWhatsApp(){
  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });

  window.open(`https://wa.me/5561999385680?text=${msg}`);
}

/* 🔥 DESKTOP */
window.addEventListener("load", () => {
  if(window.innerWidth >= 900){
    document.getElementById("carrinho").classList.add("active");
  }
  render(); // 🔥 garante que sempre aparece
});

</script>
  
</body>
</html>
