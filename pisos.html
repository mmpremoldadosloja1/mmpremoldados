<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pisos e Pisadeiras | MM Pré-Moldados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>

/* FUNDO */
body{
  background: linear-gradient(to bottom, #ddd, #ccc);
  font-family: 'Montserrat', sans-serif;
  padding-top:90px;
}

/* TÍTULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
  text-shadow:2px 2px 4px rgba(0,0,0,0.3);
}

/* SUBTÍTULO */
h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
  text-shadow:1px 1px 2px rgba(0,0,0,0.2);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px;
}

/* PC ATÉ 4 PRODUTOS */
@media(min-width:900px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

/* CARD */
.card{
  animation:fadeUp .6s ease forwards;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* IMAGEM */
.imagem-container{
  width:100%;
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.imagem-container img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:8px;
}

.contador button{
  padding:3px 8px;
  margin:0 5px;
  font-size:16px;
  cursor:pointer;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:8px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  background:#c92f3b;
}

</style>
</head>

<body>

<a href="index.html" class="voltar">
  <svg viewBox="0 0 24 24">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</a>

<h1>PISOS E PISADEIRAS</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function mais(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = parseInt(qtd.innerText) + 1;
}

function menos(btn){
  const qtd = btn.parentElement.querySelector('.qtd');
  qtd.innerText = Math.max(1, parseInt(qtd.innerText) - 1);
}

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const select = card.querySelector('select');
  const variacao = select ? select.value : "";
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const nomeFinal = variacao ? nome + " - " + variacao : nome;

  const existente = carrinho.find(item => item.nome === nomeFinal);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({ nome: nomeFinal, qtd });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado!");
}

/* TÍTULOS */
function titulo(texto){
  grid.innerHTML += `
  <div style="grid-column:1/-1">
    <h2>${texto}</h2>
  </div>`;
}

/* PRODUTOS COM IMAGEM */
function criarProduto(nome, imagem, opcoes = null){
  grid.innerHTML += `
  <div class="card">

    <div class="imagem-container">
      <img src="${imagem}" alt="${nome}">
    </div>

    <h3>${nome}</h3>

    ${opcoes ? `
    <select>
      ${opcoes.map(op => `<option>${op}</option>`).join('')}
    </select>` : ''}

    <div class="contador">
      <button onclick="menos(this)">−</button>
      <span class="qtd">1</span>
      <button onclick="mais(this)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>

  </div>`;
}

/* 🔥 PISOS */
titulo("Pisos");

criarProduto("Piso Quadrado Liso","img/pisos/quadrado.jpg",["40x40cm","50x50cm","60x60cm"]);
criarProduto("Piso Copacabana 50x50cm","img/pisos/copacabana.jpg");
criarProduto("Piso Trabalhado em Flor 45x45cm","img/pisos/flor.jpg");
criarProduto("Piso em X 45x45cm","img/pisos/x.jpg");

/* 🌿 PISADEIRAS */
titulo("Pisadeiras");

criarProduto("Pezão de Jardim 50cm","img/pisos/pezao.jpg");
criarProduto("Círculo Estelar 50cm","img/pisos/circulo.jpg");
criarProduto("Pisadeira Xis 50cm","img/pisos/xis.jpg");

/* ⭐ CONJUNTOS */
titulo("Conjuntos");

criarProduto("Conjunto Trevo Oriente 60x60cm","img/pisos/trevo.jpg");
criarProduto("Conjunto Passarela Estrelado 70x70cm","img/pisos/passarela.jpg");
criarProduto("Conjunto Passarela Estelar 140x140cm","img/pisos/passarela-grande.jpg");

</script>

</body>
</html>
