<style>

/* (TODO seu CSS foi mantido igual — não mexi no visual) */

body{
  background:#fff;
  color:#000;

  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;

  color:#000;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.nav-item svg{

  margin-bottom:3px;
  stroke:currentColor;
}

.nav-item:hover{
  color:#e63946;

}

/* CARRINHO (igual cobogó) */
.carrinho-lateral{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.25);
  padding:20px;
  transition:0.3s;
  z-index:1001;
  display:flex;
  flex-direction:column;
  border-top-left-radius:50px;
  border-bottom-left-radius:50px;
}

.carrinho-lateral.active{
  right:0;
}

.lista-carrinho{
  flex:1;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.remover{
  background:#e63946;
  color:#fff;
  border:none;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
}

.btn-finalizar{
  padding:15px;
  background:#25D366;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;

h1{

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));

}

/* CARD */

  padding:5px;

.btn{
  width:100%;
  padding:10px 0;

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item" onclick="abrirCarrinho(); return false;">
      Carrinho
    </a>
  </nav>
</header>

<div class="carrinho-lateral" id="carrinho">
  <h3>Seu Carrinho</h3>
  <div class="lista-carrinho" id="lista"></div>
  <button class="btn-finalizar" onclick="enviarWhatsApp()">Finalizar</button>
</div>

<div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

<h1>MANILHAS E TAMPAS</h1>

<h2>Manilhas</h2>
<div class="grid">

<div class="card">
<img src="img/manilha/manilha-90.jpg">
<h3>Manilha 90cm x 50cm</h3>
<div class="contador">
<button onclick="diminuir(this)">−</button>
<input type="number" class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/manilha/manilha-110.jpg">
<h3>Manilha 1,10m x 50cm</h3>
<div class="contador">
<button onclick="diminuir(this)">−</button>
<input type="number" class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

</div>

<h2>Tampas de Manilha</h2>
<div class="grid">

<div class="card">
<img src="img/manilha/tampa-90.jpg">
<h3>Tampa 90cm (Aberta/Fechada)</h3>
<div class="contador">
<button onclick="diminuir(this)">−</button>
<input type="number" class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/manilha/tampa-100.jpg">
<h3>Tampa 1m (Aberta/Fechada)</h3>
<div class="contador">
<button onclick="diminuir(this)">−</button>
<input type="number" class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

<div class="card">
<img src="img/manilha/tampa-110.jpg">
<h3>Tampa 1,10cm (Aberta/Fechada)</h3>
<div class="contador">
<button onclick="diminuir(this)">−</button>
<input type="number" class="qtd" value="1">
<button onclick="aumentar(this)">+</button>
</div>
<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

</div>

<script>
// 🔥 MESMO JS DOS COBOGÓS (mantido)
function aumentar(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = parseInt(input.value) + 1;
}

function diminuir(btn){
  const input = btn.parentElement.querySelector('.qtd');
  input.value = Math.max(1, parseInt(input.value) - 1);
}

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  renderizar();
}

function abrirCarrinho(){
  document.getElementById("carrinho").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  renderizar();
}

function fecharCarrinho(){
  document.getElementById("carrinho").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  carrinho.forEach((item, i)=>{
    lista.innerHTML += `
      <div class="item">
        ${item.nome} (x${item.qtd})
        <button class="remover" onclick="remover(${i})">X</button>
      </div>
    `;
  });
}

function remover(i){
  carrinho.splice(i,1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  renderizar();
}

function enviarWhatsApp(){
  let msg = "Pedido:%0A";
  carrinho.forEach(item=>{
    msg += `${item.nome} - ${item.qtd}%0A`;
  });
  window.open(`https://wa.me/5561999385680?text=${msg}`);
}
</script>

</body>
</html>
