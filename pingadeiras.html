<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEIO-FIO | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* FUNDO IGUAL PINGADEIRAS */
body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

/* NAV */
nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

/* TÍTULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:30px;
  color:#e63946;
}

/* GRID IGUAL */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:25px;
  padding:0 20px 40px;
}

@media (min-width:768px){
  .grid{
    grid-template-columns:repeat(3, 1fr);
  }
}

@media (min-width:1200px){
  .grid{
    max-width:1100px;
    margin:0 auto;
  }
}

/* CARD IGUAL */
.card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 25px rgba(0,0,0,0.12);
}

/* IMAGEM IGUAL (AQUI ESTÁ A CORREÇÃO) */
.card img{
  width:100%;
  height:140px;
  object-fit:contain;
  margin-bottom:10px;
}

/* CONTADOR */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:10px;
}

.contador button{
  padding:5px 10px;
  margin:0 5px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#eee;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn:hover{
  background:#c92f3b;
  transform:scale(1.05);
}

</style>
</head>

<body>

<header>
  <nav>
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav>
    <a href="#" class="nav-item">Carrinho</a>
  </nav>
</header>

<h1>MEIO-FIO DE JARDIM</h1>

<div class="grid" id="gridProdutos"></div>

<script>

const grid = document.getElementById("gridProdutos");
let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

/* CONTADOR */
function alterarQtd(botao, valor){
  const qtdSpan = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(qtdSpan.innerText);
  qtd = Math.max(1, qtd + valor);
  qtdSpan.innerText = qtd;
}

/* CARRINHO */
function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').innerText);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert("Produto adicionado");
}

/* PRODUTOS */
const produtos = [
  {
    nome: "Meio-Fio Arredondado 80x25x8cm",
    img: "img/meiofio/arredondado.jpg"
  },
  {
    nome: "Meio-Fio Cordão 80x25x4cm",
    img: "img/meiofio/cordao.jpg"
  },
  {
    nome: "Guia de Jardim Ondulado 80x20x4cm",
    img: "img/meiofio/ondulado.jpg"
  }
];

/* CRIAR */
function criar(produto){
  grid.innerHTML += `
  <div class="card">

    <img src="${produto.img}" alt="${produto.nome}">

    <h3>${produto.nome}</h3>

    <div class="contador">
      <button onclick="alterarQtd(this,-1)">−</button>
      <span class="qtd">1</span>
      <button onclick="alterarQtd(this,1)">+</button>
    </div>

    <button class="btn" onclick="adicionarCarrinho(this)">
      Adicionar
    </button>

  </div>`;
}

produtos.forEach(criar);

</script>

</body>
</html>
