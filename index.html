<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Pré-Moldados</title>

<style>
/* ================= BASE ================= */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f5f5;
}

/* ================= CABEÇALHO ================= */
header{
  background:#111;
  padding:15px 15px 18px;
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-btn{
  background:#222;
  color:#fff;
  border:none;
  font-size:22px;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.logo{
  height:60px;
}

@media (max-width:600px){
  .logo{
    height:50px;
  }
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  padding:10px 14px;
  border-radius:20px;
  border:none;
  font-size:14px;
}

/* ================= MENU HAMBURGUER ================= */
.menu{
  display:none;
  position:absolute;
  top:70px;
  left:15px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  overflow:hidden;
  z-index:10;
}

.menu a{
  display:block;
  padding:12px 16px;
  color:#333;
  text-decoration:none;
  border-bottom:1px solid #eee;
}

.menu a:hover{
  background:#f0f0f0;
}

/* ================= PRODUTOS ================= */
h2{
  margin:30px 20px 10px;
  border-left:5px solid #c9a24d;
  padding-left:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  padding:20px;
}

@media (max-width:1024px){
  .grid{ grid-template-columns:repeat(2,1fr); }
}

@media (max-width:600px){
  .grid{ grid-template-columns:1fr; }
}

.card{
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  text-align:center;
}

.card img{
  width:100%;
  height:220px;
  object-fit:contain; /* 🔥 NÃO CORTA */
  background:#fff;
}

@media (max-width:600px){
  .card img{
    height:260px;
  }
}

.card h3{
  font-size:15px;
  margin:12px 0;
}

.btn{
  display:inline-block;
  margin-bottom:15px;
  padding:10px 18px;
  background:#25d366;
  color:#fff;
  text-decoration:none;
  border-radius:5px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- ================= CABEÇALHO ================= -->
<header>
  <button class="menu-btn" onclick="toggleMenu()">≡</button>

  <img src="img/logo.png" class="logo">

  <div class="search">
    <input type="text" placeholder="Buscar produtos">
  </div>

  <div class="menu" id="menu">
    <a href="cobogos.html">Cobogós</a>
    <a href="manilhas.html">Manilhas</a>
    <a href="#">Lajes Pré-Moldadas</a>
    <a href="#">Pingadeiras</a>
    <a href="#">Blocos / Canaletas</a>
  </div>
</header>

<!-- ================= CONTEÚDO ================= -->
<h2>Produtos em Destaque</h2>

<div class="grid">

  <div class="card">
    <img src="img/cobogo-16-furos-40.jpg">
    <h3>Cobogó 16 Furos 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/cobogo-anti-chuva-40.jpg">
    <h3>Cobogó Anti-Chuva 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/cobogo-arabe-40.jpg">
    <h3>Cobogó Árabe 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/cobogo-flor-40.jpg">
    <h3>Cobogó Flor 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

</div>

<script>
function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
