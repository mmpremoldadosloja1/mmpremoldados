<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobogós | MM Pré-Moldados</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background:#fff;
  color:#000;
  padding-top:90px;
  font-family: 'Montserrat', sans-serif;
}

header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:fixed;
  top:0;
  z-index:999;
  background:#fff;
}

nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-left, .nav-right{
  display:flex;
  gap:20px;
}

.nav-right{
  margin-right:20px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}

.nav-item:hover{
  color:#e63946;
}

/* TITULO */
h1{
  text-align:center;
  text-transform:uppercase;
  font-size:36px;
  margin-bottom:20px;
  color:#e63946;
}

h2{
  text-align:left;
  margin-top:30px;
  margin-bottom:15px;
  font-size:22px;
  padding-left:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:20px;
  padding:0 20px 40px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
}

/* IMG */
.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

/* TITULO CARD */
.card h3{
  margin:10px 0;
  font-size:14px;
  min-height:40px;
}

/* CONTADOR NOVO */
.contador{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.contador button{
  width:30px;
  height:30px;
  border:none;
  background:#eee;
  border-radius:5px;
  cursor:pointer;
  font-size:16px;
}

.contador input{
  width:50px;
  text-align:center;
  padding:5px;
  border:1px solid #ccc;
  border-radius:5px;
  font-weight:bold;
}

/* BOTÃO */
.btn{
  width:100%;
  padding:10px 0;
  background:#e63946;
  color:#fff;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn:hover{
  background:#c92f3b;
}

</style>
</head>

<body>

<header>
  <nav class="nav-left">
    <a href="index.html" class="nav-item">Início</a>
  </nav>

  <nav class="nav-right">
    <a href="#" class="nav-item">Carrinho</a>
  </nav>
</header>

<h1>COBOGÓS</h1>

<h2>Cobogós 40x40</h2>
<div class="grid">

<!-- EXEMPLO (TODOS IGUAIS, NÃO MUDEI PRODUTOS) -->
<div class="card">
<img src="img/cobogo/cobogo-16-furos-40.jpg">
<h3>16 Furos 40x40</h3>

<div class="contador">
<button onclick="alterarQtd(this,-1)">−</button>
<input type="number" class="qtd" value="1" min="1">
<button onclick="alterarQtd(this,1)">+</button>
</div>

<button class="btn" onclick="adicionarCarrinho(this)">Adicionar</button>
</div>

</div>

<script>

/* CONTADOR SIMPLES */

function alterarQtd(botao, valor){
  const input = botao.parentElement.querySelector('.qtd');
  let qtd = parseInt(input.value) || 1;
  qtd = Math.max(1, qtd + valor);
  input.value = qtd;
}

/* CARRINHO */

let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

function adicionarCarrinho(botao){
  const card = botao.closest('.card');
  const nome = card.querySelector('h3').innerText;
  const qtd = parseInt(card.querySelector('.qtd').value);

  const existente = carrinho.find(item => item.nome === nome);

  if(existente){
    existente.qtd += qtd;
  }else{
    carrinho.push({nome, qtd});
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  alert('Produto adicionado');
}

</script>

</body>
</html>
