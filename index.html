<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MM Pré-Moldados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* ================= TÍTULOS ================= */
    h1 {
      text-align: center;
      margin: 25px 0 10px;
    }

    h2 {
      margin: 30px 20px 10px;
      border-left: 5px solid #c9a24d;
      padding-left: 10px;
      color: #333;
    }

    /* ================= GRID PRODUTOS ================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 20px;
    }

    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* ================= CARD ================= */
    .card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    /* 🔥 IMAGEM CORRETA (NÃO CORTA) */
    .card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #fff;
    }

    @media (max-width: 600px) {
      .card img {
        height: 260px;
      }
    }

    .card h3 {
      margin: 12px 0;
      font-size: 15px;
      padding: 0 10px;
    }

    .btn {
      display: inline-block;
      margin-bottom: 15px;
      padding: 10px 18px;
      background: #25d366;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>MM Pré-Moldados</h1>

<!-- ================= PRODUTOS EM DESTAQUE ================= -->
<h2>Produtos em Destaque</h2>

<div class="grid">

  <div class="card">
    <img src="img/cobogo-16-furos-40.jpg">
    <h3>Cobogó 16 Furos 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/cobogo-anti-chuva-40.jpg">
    <h3>Cobogó Anti-Chuva 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/cobogo-arabe-40.jpg">
    <h3>Cobogó Árabe 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/cobogo-flor-40.jpg">
    <h3>Cobogó Flor 40x40</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

</div>

<!-- ================= MANILHAS ================= -->
<h2>Manilhas</h2>

<div class="grid">

  <div class="card">
    <img src="img/manilha-90.jpg">
    <h3>Manilha 90</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

  <div class="card">
    <img src="img/manilha-110.jpg">
    <h3>Manilha 1,10</h3>
    <a class="btn" href="#">WhatsApp</a>
  </div>

</div>

</body>
</html>
